<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://gyyyzavjzvcxzgrtukqu.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_Rj6F5Fp2tHJSWzbRRdLVZQ_8D5wL8p-";

const db =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   الجداول
========================================================= */

const BUYER_TABLE =
    "orders";

const SELLER_TABLE =
    "seller_requests";

const PRODUCTS_TABLE =
    "products";


/* =========================================================
   الحالة
========================================================= */

let allOrders = [];

let allProducts = [];

let currentView = "all";


/* =========================================================
   أدوات
========================================================= */

function clean(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "";
    }

    return String(value).trim();

}


function safe(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


function pick(row, names) {

    for (const name of names) {

        if (
            row &&
            row[name] !== undefined &&
            row[name] !== null &&
            clean(row[name]) !== ""
        ) {

            return row[name];

        }

    }

    return "";

}


function money(value) {

    if (
        value === null ||
        value === undefined ||
        clean(value) === ""
    ) {

        return "—";

    }

    const number =
        Number(value);

    if (Number.isNaN(number)) {

        return safe(value) + " ر.س";

    }

    return number.toLocaleString(
        "ar-SA",
        {
            maximumFractionDigits: 2
        }
    ) + " ر.س";

}


function dateText(value) {

    if (!value) {

        return "—";

    }

    const date =
        new Date(value);

    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return safe(value);

    }

    return date.toLocaleString(
        "ar-SA"
    );

}


/* =========================================================
   توحيد قسم الأسر المنتجة
========================================================= */

function normalizeCategory(value) {

    const category =
        clean(value);

    if (
        category === "اسر منتجه" ||
        category === "أسر منتجه" ||
        category === "اسر منتجة" ||
        category === "أسر منتجة"
    ) {

        return "أسر منتجة";

    }

    return category;

}


/* =========================================================
   بيانات الأسرة
========================================================= */

function getFamilyData(row) {

    const sellerName =
        clean(
            pick(
                row,
                [
                    "family_name",
                    "familyName",
                    "seller_name"
                ]
            )
        );


    if (
        sellerName === "أسرة سكر وورد" ||
        sellerName === "سكر وورد" ||
        sellerName.toLowerCase() === "sugar rose"
    ) {

        return {

            familyName:
                "أسرة سكر وورد",

            familySlug:
                "sugar-rose",

            familyPage:
                "../family-sugar-rose.html"

        };

    }


    return {

        familyName:
            sellerName || "أسرة منتجة",

        familySlug:
            "",

        familyPage:
            ""

    };

}


/* =========================================================
   حالة الطلب
========================================================= */

function getStatus(value) {

    const status =
        clean(value).toLowerCase();

    if (
        status === "approved" ||
        status === "accepted" ||
        status === "confirmed" ||
        status === "مقبول"
    ) {

        return {

            text:
                "مقبول",

            className:
                "approved"

        };

    }

    if (
        status === "waiting_transfer"
    ) {

        return {

            text:
                "💳 بانتظار التحقق من التحويل",

            className:
                "transfer"

        };

    }

    return {

        text:
            "قيد الانتظار",

        className:
            ""

    };

}


/* =========================================================
   الصور
   FIX كامل للتعامل مع:
   - JSON Array
   - PostgreSQL Array
   - Array حقيقية
   - نص يحتوي روابط متعددة
   - كائنات الصور
   - image / image_url القديمة
========================================================= */

function getSellerImages(row) {

    const result = [];

    if (
        !row ||
        typeof row !== "object"
    ) {

        return [];

    }


    function addImage(value) {

        if (
            value === null ||
            value === undefined
        ) {

            return;

        }


        /* ---------------------------------------------
           مصفوفة JavaScript
        --------------------------------------------- */

        if (
            Array.isArray(value)
        ) {

            value.forEach(
                function(item) {

                    addImage(item);

                }
            );

            return;

        }


        /* ---------------------------------------------
           كائن صورة
        --------------------------------------------- */

        if (
            typeof value === "object"
        ) {

            const url =
                value.url ||
                value.publicUrl ||
                value.public_url ||
                value.image ||
                value.image_url ||
                value.imageUrl ||
                value.photo ||
                value.src;

            if (url) {

                addImage(url);

            }

            return;

        }


        /* ---------------------------------------------
           نص
        --------------------------------------------- */

        if (
            typeof value !== "string"
        ) {

            return;

        }


        let text =
            value.trim();


        if (!text) {

            return;

        }


        /* ---------------------------------------------
           JSON Array
           مثال:
           ["url1","url2","url3","url4"]
        --------------------------------------------- */

        if (
            text.startsWith("[") &&
            text.endsWith("]")
        ) {

            try {

                const parsed =
                    JSON.parse(text);

                if (
                    Array.isArray(parsed)
                ) {

                    parsed.forEach(
                        function(item) {

                            addImage(item);

                        }
                    );

                    return;

                }

            }
            catch (error) {

                console.warn(
                    "تعذر تحليل JSON للصور:",
                    error
                );

            }

        }


        /* ---------------------------------------------
           JSON Object
        --------------------------------------------- */

        if (
            text.startsWith("{") &&
            text.endsWith("}")
        ) {

            try {

                const parsedObject =
                    JSON.parse(text);

                if (
                    parsedObject &&
                    typeof parsedObject === "object" &&
                    !Array.isArray(parsedObject)
                ) {

                    addImage(
                        parsedObject
                    );

                    return;

                }

            }
            catch (error) {

                /*
                 * ليس JSON Object.
                 * قد يكون PostgreSQL Array.
                 */

            }


            /* -----------------------------------------
               PostgreSQL Array
               مثال:
               {"url1","url2","url3","url4"}
            ----------------------------------------- */

            const inside =
                text.slice(
                    1,
                    -1
                );


            if (
                inside.trim()
            ) {

                const parts =
                    inside
                        .split(/","|','/g)
                        .map(
                            function(item) {

                                return item
                                    .replace(
                                        /^["']|["']$/g,
                                        ""
                                    )
                                    .trim();

                            }
                        )
                        .filter(Boolean);


                if (
                    parts.length > 0
                ) {

                    parts.forEach(
                        function(item) {

                            addImage(item);

                        }
                    );

                    return;

                }

            }

        }


        /* ---------------------------------------------
           نص يحتوي عدة روابط
           مثال:
           url1,url2,url3
        --------------------------------------------- */

        if (
            text.includes(",")
        ) {

            const parts =
                text
                    .split(",")
                    .map(
                        function(item) {

                            return item
                                .trim()
                                .replace(
                                    /^["']|["']$/g,
                                    ""
                                );

                        }
                    )
                    .filter(Boolean);


            const looksLikeMultiple =
                parts.length > 1 &&
                parts.some(
                    function(item) {

                        return (
                            item.startsWith("http://") ||
                            item.startsWith("https://")
                        );

                    }
                );


            if (
                looksLikeMultiple
            ) {

                parts.forEach(
                    function(item) {

                        addImage(item);

                    }
                );

                return;

            }

        }


        /* ---------------------------------------------
           رابط صورة واحد
        --------------------------------------------- */

        if (
            text.startsWith("http://") ||
            text.startsWith("https://") ||
            text.startsWith("data:image/")
        ) {

            result.push(
                text
            );

        }

    }


    /* =================================================
       1 — العمود الرئيسي images
    ================================================= */

    addImage(
        row.images
    );


    /* =================================================
       2 — أسماء بديلة
    ================================================= */

    addImage(
        row.photos
    );

    addImage(
        row.productImages
    );

    addImage(
        row.imageUrls
    );

    addImage(
        row.gallery
    );


    /* =================================================
       3 — الصور المرقمة
       image1 ... image5
    ================================================= */

    for (
        let i = 1;
        i <= 5;
        i++
    ) {

        addImage(
            row["image" + i]
        );

    }


    /* =================================================
       4 — الحقول القديمة
    ================================================= */

    addImage(
        row.image
    );

    addImage(
        row.image_url
    );

    addImage(
        row.imageUrl
    );

    addImage(
        row.productImage
    );


    /* =================================================
       تنظيف ومنع التكرار
    ================================================= */

    return [
        ...new Set(
            result
                .map(

function parseOrderItems(value) {

    if (!value) {
        return [];
    }


    let items =
        value;


    if (
        typeof items === "string"
    ) {

        try {

            items =
                JSON.parse(items);

        }
        catch (error) {

            return [];

        }

    }


    if (
        !Array.isArray(items)
    ) {

        return [];

    }


    return items
        .filter(
            item =>
                item &&
                typeof item === "object"
        )
        .map(
            item => {

                const price =
                    Number(
                        item.price
                    ) || 0;


                const quantity =
                    Math.max(
                        1,
                        Number(
                            item.quantity
                        ) || 1
                    );


                const title =
                    item.title ||
                    item.name ||
                    item.product_name ||
                    "منتج";


                const image =
                    item.image ||
                    item.image_url ||
                    item.imageUrl ||
                    "";


                const familyName =
                    item.family_name ||
                    item.familyName ||
                    item.seller_name ||
                    "";


                return {

                    id:
                        item.id ??
                        item.product_id ??
                        item.productId ??
                        "",

                    name:
                        item.name ||
                        title,

                    title:
                        title,

                    category:
                        normalizeCategory(
                            item.category ||
                            item.product_category ||
                            ""
                        ),

                    familyName:
                        familyName,

                    familySlug:
                        item.family_slug ||
                        item.familySlug ||
                        "",

                    price:
                        price,

                    quantity:
                        quantity,

                    image:
                        image,

                    sellerRequestId:
                        item.seller_request_id ||
                        item.sellerRequestId ||
                        null,

                    sellerName:
                        item.seller_name ||
                        item.sellerName ||
                        "",

                    subtotal:
                        Number(
                            item.subtotal
                        ) ||
                        Number(
                            (
                                price *
                                quantity
                            ).toFixed(2)
                        )

                };

            }
        );

}

    ).map(

    );

async function loadSellerOrders() {

    const result =
        await db
            .from(SELLER_TABLE)
            .select("*");

    if (result.error) {

        throw new Error(
            "خطأ في جدول seller_requests: " +
            result.error.message
        );

    }

    const rows =
        result.data || [];


    rows.sort(
        function(a,b) {

            return (

                new Date(

========================================================= */

function buildProductData(seller) {

    const raw =
        seller.raw || {};


    const sellerRequestId =
        clean(
            raw.id
        ) || null;


    const sellerIdValue =
        raw.seller_id ??
        raw.sellerId ??
        null;


    const sellerNameValue =
        clean(
            raw.seller_name ||
            raw.sellerName ||
            seller.name
        ) || null;


    const title =
        pick(
            raw,
            [
                "product_name",
                "productName",
                "item_name",
                "title",
                "name"
            ]
        ) || "منتج";


    const description =
        pick(
            raw,
            [
                "description",
                "details",
                "product_description"
            ]
        ) || "";


    const priceValue =
        pick(
            raw,
            [
                "price",
                "product_price",
                "amount",
                "total"
            ]
        );


    const priceNumber =
        priceValue === ""
            ? 0
            : Number(
                priceValue
            );


    const rawCategory =
        pick(
            raw,
            [
                "category",
                "product_category",
                "category_name"
            ]
        );


    const category =
        normalizeCategory(
            rawCategory
        );


    const images =
        getSellerImages(
            raw
        );


    const firstImage =
        images.length > 0
            ? images[0]
            : null;


    const family =
        getFamilyData(
            raw
        );


    const productData = {

        title:
            title,

        description:
            description,

        price:
            Number.isFinite(
                priceNumber
            )
                ? priceNumber
                : 0,

        category:
            category,

        image:
            firstImage,

        available:
            true,

        images:
            images,

        family_name:
            family.familyName,

        family_slug:
            family.familySlug,

        family_page:
            family.familyPage,

        seller_id:
            sellerIdValue,

        seller_name:
            sellerNameValue,

        seller_request_id:
            sellerRequestId

    };


    if (
        family.familySlug === "sugar-rose"
    ) {

        productData.category =
            "أسر منتجة";

    }


    return productData;

}


/* =========================================================
   نشر المنتج
========================================================= */

async function publishSellerProduct(seller) {

    const productData =
        buildProductData(
            seller
        );


    if (
        !productData.seller_request_id
    ) {

        throw new Error(
            "تعذر نشر السلعة: معرف طلب البائع غير موجود."
        );

    }


    const existingByRequest =
        await db
            .from(PRODUCTS_TABLE)
            .select("id")
            .eq(
                "seller_request_id",
                productData.seller_request_id
            )
            .limit(1);


    if (existingByRequest.error) {

        throw new Error(
            "تعذر التحقق من ربط المنتج بالبائع: " +
            existingByRequest.error.message
        );

    }


    if (
        existingByRequest.data &&
        existingByRequest.data.length > 0
    ) {

        const existingId =
            existingByRequest
                .data[0]
                .id;


        const updateExisting =
            await db
                .from(PRODUCTS_TABLE)
                .update(
                    productData
                )
                .eq(
                    "id",
                    existingId
                );


        if (updateExisting.error) {

            throw new Error(
                "تعذر تحديث المنتج المرتبط بالبائع: " +
                updateExisting.error.message
            );

        }


        return {

            success:
                true,

            alreadyExists:
                true,

            productId:
                existingId

        };

    }


    const result =
        await db
            .from(PRODUCTS_TABLE)
            .insert(
                productData
            )
            .select()
            .single();


    if (result.error) {

        console.error(
            "PRODUCT INSERT ERROR:",
            result.error
        );


        throw new Error(
            "تعذر نشر السلعة في products: " +
            result.error.message
        );

    }


    return {

        success:
            true,

        alreadyExists:
            false,

        productId:
            result.data?.id || null

    };

}

        product.available === "false" ||
        product.available === 0 ||
        product.available === "0"
    ) {

        return false;

    }

    return true;

}

function updateStats() {

    const buyers =
        allOrders.filter(
            order =>
                order.type === "buyer"
        );


    const sellers =
        allOrders.filter(
            order =>
                order.type === "seller"
        );


    const pending =
        allOrders.filter(
            order => {

                const status =
                    clean(
                        order.status
                    ).toLowerCase();


                return ![
                    "approved",
                    "accepted",
                    "confirmed",
                    "مقبول"
                ].includes(
                    status
                );

            }
        );


    document.getElementById(
        "totalOrders"
    ).textContent =
        allOrders.length;


    document.getElementById(
        "buyerOrders"
    ).textContent =
        buyers.length;


    document.getElementById(
        "sellerOrders"
    ).textContent =
        sellers.length;


    document.getElementById(
        "pendingOrders"
    ).textContent =
        pending.length;


    document.getElementById(
        "publishedProducts"
    ).textContent =
        allProducts.filter(
            product =>
                productAvailable(
                    product
                )
        ).length;

}

    let list =
        allOrders;


    if (
        currentView === "buyer"
    ) {

        list =
            allOrders.filter(
                order =>
                    order.type === "buyer"
            );

    }


    if (
        currentView === "seller"
    ) {

        list =
            allOrders.filter(
                order =>
                    order.type === "seller"
            );

    }


    if (
        list.length === 0
    ) {

        container.innerHTML = `

            <div class="empty">
                لا توجد طلبات في هذا القسم.
            </div>

        `;

        return;

    }


    container.innerHTML =
        list
            .map(
                createCard
            )
            .join("");

}


/* =========================================================
   بطاقة الطلب
========================================================= */

function createCard(order) {

    const isBuyer =
        order.type === "buyer";


    const status =
        getStatus(
            order.status
        );


    const id =
        safe(
            order.id
        );


    const isTransfer =
        clean(
            order.status
        ).toLowerCase()
        ===
        "waiting_transfer";


    return `

        <article
            class="card"
            data-order-id="${id}"
            data-order-type="${safe(order.type)}"
        >

            <div class="card-head">

                <div>

                    <div
                        class="
                            badge
                            ${
                                isBuyer
                                    ? "badge-buyer"
                                    : "badge-seller"
                            }
                        "
                    >

                        ${
                            isBuyer
                                ? "🛒 طلب مشتري"
                                : "📦 طلب بائع"
                        }

                    </div>


                    <div class="order-number">

                        رقم الطلب:

                        ${safe(
                            order.number ||
                            order.id ||
                            "—"
                        )}

                    </div>

                </div>


                <div
                    class="
                        status
                        ${status.className}
                    "
                >

                    ${safe(
                        status.text
                    )}

                </div>

            </div>


            <div class="info-grid">


                <div class="info">

                    <div class="label">

                        ${
                            isBuyer
                                ? "اسم المشتري"
                                : "اسم البائع"
                        }

                    </div>

                    <div class="value">

                        ${safe(
                            order.name ||
                            "—"
                        )}

                    </div>

                </div>


                <div class="info">

                    <div class="label">
                        رقم الجوال
                    </div>

                    <div class="value">

                        ${safe(
                            order.phone ||
                            "—"
                        )}

                    </div>

                </div>


                <div class="info">

                    <div class="label">
                        المدينة
                    </div>

                    <div class="value">

                        ${safe(
                            order.city ||
                            "—"
                        )}

                    </div>

                </div>


                <div class="info">

                    <div class="label">
                        المبلغ
                    </div>

                    <div class="value">

                        ${money(
                            order.total
                        )}

                    </div>

                </div>


                ${
                    order.address
                        ? `

                            <div class="info">

                                <div class="label">
                                    العنوان
                                </div>

                                <div class="value">
                                    ${safe(
                                        order.address
                                    )}
                                </div>

                            </div>

                        `
                        : ""
                }


                <div class="info">

                    <div class="label">
                        تاريخ الطلب
                    </div>

                    <div class="value">

                        ${dateText(
                            order.created
                        )}

                    </div>

                </div>


            </div>


            ${
                isBuyer

                    ?

                    `

                        <div class="payment-box">

                            <div class="payment-title">
                                💳 طريقة الدفع
                            </div>

                            <div class="payment-value">

                                ${safe(
                                    order.paymentMethod ||
                                    "—"
                                )}

                            </div>


                            ${
                                isTransfer

                                    ?

                                    `

                                        <div class="transfer-warning">

                                            💳 بانتظار التحقق من التحويل
                                            من إشعار البنك.

                                        </div>

                                    `

                                    :

                                    ""
                            }

                        </div>


                        ${buyerItemsHtml(
                            order.items
                        )}

                    `

                    :

                    `

                        <div class="product">

                            <div class="product-name">

                                📦

                                ${safe(
                                    order.product ||
                                    "—"
                                )}

                            </div>


                            ${
                                order.productExtra

                                    ?

                                    `

                                        <div class="product-extra">

                                            ${order.productExtra}

                                        </div>

                                    `

                                    :

                                    ""
                            }

                        </div>


                        ${sellerImagesHtml(
                            order.images
                        )}

                    `
            }


            <div class="actions">


                ${
                    isBuyer && isTransfer

                        ?

                        `

                            <button
                                class="action accept"
                                type="button"
                                onclick="changeStatus(
                                    '${id}',
                                    'buyer',
                                    'approved'
                                )"
                            >
                                ✓ تم استلام المبلغ — قبول الطلب
                            </button>

                        `

                        :

                        `

                            <button
                                class="action accept"
                                type="button"
                                onclick="changeStatus(
                                    '${id}',

                <button

                    class="action wait"

            </div>

        </article>

}


/* =========================================================
   حذف الطلب
========================================================= */

async function deleteOrder(
    id,
    type
) {

    if (!id) {

        alert(
            "رقم الطلب غير موجود."
        );

        return;

    }


    const isBuyer =
        type === "buyer";


    const table =
        isBuyer
            ? BUYER_TABLE
            : SELLER_TABLE;


    const confirmed =
        confirm(

            isBuyer

                ?

                "⚠️ هل أنت متأكد من حذف طلب المشتري نهائيًا؟\n\nلا يمكن التراجع عن الحذف."

                :

                "⚠️ هل أنت متأكد من حذف طلب البائع نهائيًا؟\n\nلا يمكن التراجع عن الحذف."

        );


    if (!confirmed) {

        return;

    }


    try {

        const result =
            await db
                .from(table)
                .delete()
                .eq(
                    "id",
                    id
                );


        if (result.error) {

            throw new Error(
                result.error.message
            );

        }


        allOrders =
            allOrders.filter(
                function(order) {

                    return !(
                        String(
                            order.id
                        )
                        ===
                        String(id)

                        &&

                        order.type
                        ===
                        type
                    );

                }
            );


        updateStats();

        render();


        alert(

            isBuyer

                ?

                "✓ تم حذف طلب المشتري بنجاح."

                :

                "✓ تم حذف طلب البائع بنجاح."

        );

    }
    catch (error) {

        console.error(
            "DELETE ERROR:",
            error
        );


        alert(
            "❌ لم يتم الحذف.\n\n" +
            error.message
        );

    }

}


/* =========================================================
   تغيير حالة الطلب
========================================================= */

async function changeStatus(
    id,
    type,
    status
) {

    if (!id) {

        alert(
            "رقم الطلب غير موجود."
        );

        return;

    }


    if (
        type === "buyer"
    ) {

        const result =
            await db
                .from(BUYER_TABLE)
                .update({
                    status:
                        status
                })
                .eq(
                    "id",
                    id
                );


        if (result.error) {

            alert(
                "تعذر تحديث حالة طلب المشتري:\n\n" +
                result.error.message
            );

            return;

        }


        await loadAll();

        return;

    }


    const sellerResult =
        await db
            .from(SELLER_TABLE)
            .select("*")
            .eq(
                "id",
                id
            )
            .single();


    if (
        sellerResult.error
    ) {

        alert(
            "تعذر قراءة بيانات السلعة:\n\n" +
            sellerResult.error.message
        );

        return;

    }


    const seller =
        sellerResult.data;


    if (
        status === "approved"
    ) {

        try {

            const productData =
                buildProductData(
                    mapSeller(
                        seller
                    )
                );


            console.log(
                "PRODUCT TO PUBLISH:",
                productData
            );


            const publishResult =
                await publishSellerProduct(
                    mapSeller(
                        seller
                    )
                );


            const updateResult =
                await db
                    .from(SELLER_TABLE)
                    .update({

                        status:
                            "approved",

                        approved_at:
                            new Date().toISOString(),

                        published:
                            true,

                        published_at:
                            new Date().toISOString()

                    })
                    .eq(
                        "id",
                        id
                    );


            if (
                updateResult.error
            ) {

                throw new Error(

                    "تم نشر السلعة ولكن تعذر تحديث حالة البائع: " +

                    updateResult.error.message

                );

            }


            if (
                publishResult.alreadyExists
            ) {

                alert(
                    "✓ السلعة كانت منشورة مسبقًا، وتم تحديث ربطها بالبائع والصور بنجاح."
                );

            }
            else {

                alert(
                    "✓ تم قبول السلعة ونشرها في المتجر وربطها بالبائع والصور بنجاح."
                );

            }


            await loadAll();

        }
        catch (error) {

            console.error(
                "PUBLISH ERROR:",
                error
            );


            alert(
                "❌ لم يتم قبول السلعة:\n\n" +
                error.message
            );

        }


        return;

    }


    const result =
        await db
            .from(SELLER_TABLE)
            .update({
                status:
                    status
            })
            .eq(
                "id",
                id
            );


    if (
        result.error
    ) {

        alert(
            "تعذر تحديث حالة طلب البائع:\n\n" +
            result.error.message
        );

        return;

    }


    await loadAll();

}


/* =========================================================
   إخفاء / إظهار المنتج
========================================================= */

async function toggleProduct(
    id,
    available
) {

    if (!id) {

        alert(
            "معرّف المنتج غير موجود."
        );

        return;

    }


    const confirmed =
        confirm(

            available

                ?

                "إظهار المنتج في المتجر؟"

                :

                "إخفاء المنتج من المتجر؟"

        );


    if (!confirmed) {

        return;

    }


    try {

        const result =
            await db
                .from(PRODUCTS_TABLE)
                .update({
                    available:
                        available
                })
                .eq(
                    "id",
                    id
                );


        if (
            result.error
        ) {

            throw new Error(
                result.error.message
            );

        }


        await loadAll();


        alert(

            available

                ?

                "✓ تم إظهار المنتج في المتجر."

                :

                "✓ تم إخفاء المنتج من المتجر."

        );

    }
    catch (error) {

        console.error(
            "TOGGLE PRODUCT ERROR:",
            error
        );


        alert(
            "❌ تعذر تغيير حالة المنتج:\n\n" +
            error.message
        );

    }

}


/* =========================================================
   حذف المنتج
========================================================= */

async function deleteProduct(
    id
) {

    if (!id) {

        alert(
            "معرّف المنتج غير موجود."
        );

        return;

    }


    const confirmed =
        confirm(

            "⚠️ هل أنت متأكد من حذف هذا المنتج نهائيًا؟\n\nسيختفي من المتجر ولا يمكن التراجع عن الحذف."

        );


    if (!confirmed) {

        return;

    }


    try {

        const result =
            await db
                .from(PRODUCTS_TABLE)
                .delete()
                .eq(
                    "id",
                    id
                );


        if (
            result.error
        ) {

            throw new Error(
                result.error.message
            );

        }


        allProducts =
            allProducts.filter(
                product =>
                    String(
                        product.id
                    )
                    !==
                    String(id)
            );


        updateStats();

        render();


        alert(
            "✓ تم حذف المنتج بنجاح."
        );

    }
    catch (error) {

        console.error(
            "DELETE PRODUCT ERROR:",
            error
        );


        alert(
            "❌ لم يتم حذف المنتج.\n\n" +
            error.message
        );

    }

}


/* =========================================================
   تحميل كل البيانات
========================================================= */

async function loadAll() {

    const container =
        document.getElementById(
            "ordersContainer"
        );


    const connection =
        document.getElementById(
            "connectionStatus"
        );


    const refresh =
        document.getElementById(
            "refreshButton"
        );


    refresh.disabled =
        true;


    refresh.textContent =
        "⏳ جاري التحديث...";


    container.innerHTML = `

        <div class="loading">
            جاري تحميل البيانات...
        </div>

    `;


    try {

        const buyers =
            await loadBuyerOrders();


        const sellers =
            await loadSellerOrders();


        const products =
            await loadProducts();


        allOrders = [

            ...buyers,

            ...sellers

        ];


        allProducts =
            products;


        allOrders.sort(
            function(a,b) {

                return (

                    new Date(
                        b.created || 0
                    )

                    -

                    new Date(
                        a.created || 0
                    )

                );

            }
        );


        updateStats();

        render();


        connection.textContent =
            "✓ متصل — تم تحميل الطلبات والمنتجات";

    }
    catch (error) {

        console.error(
            "ADMIN ERROR:",
            error
        );


        container.innerHTML = `

            <div class="error">

                <strong>
                    تعذر تحميل البيانات
                </strong>

                ${safe(
                    error.message
                )}

            </div>

        `;


        connection.textContent =
            "❌ حدث خطأ في الاتصال";

    }
    finally {

        refresh.disabled =
            false;


        refresh.textContent =
            "🔄 تحديث";

    }

}


/* =========================================================
   نافذة الصور
========================================================= */

function openImageModal(
    url
) {

    const modal =
        document.getElementById(
            "imageModal"
        );


    const image =
        document.getElementById(
            "modalImage"
        );


    image.src =
        url;


    modal.classList.add(
        "open"
    );

}


function closeImageModal() {

    const modal =
        document.getElementById(
            "imageModal"
        );


    const image =
        document.getElementById(
            "modalImage"
        );


    modal.classList.remove(
        "open"
    );


    image.src =
        "";

}


document
    .getElementById(
        "closeModal"
    )
    .addEventListener(
        "click",
        closeImageModal
    );


document
    .getElementById(
        "imageModal"
    )
    .addEventListener(
        "click",
        function(event) {

            if (
                event.target ===
                this
            ) {

                closeImageModal();

            }

        }
    );


document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key ===
            "Escape"
        ) {

            closeImageModal();

        }

    }
);


/* =========================================================
   التبويبات
========================================================= */

document
    .querySelectorAll(
        ".tab"
    )
    .forEach(
        function(button) {

            button.addEventListener(
                "click",
                function() {

                    document
                        .querySelectorAll(
                            ".tab"
                        )
                        .forEach(
                            function(item) {

                                item.classList.remove(
                                    "active"
                                );

                            }
                        );


                    button.classList.add(
                        "active"
                    );


                    currentView =
                        button.dataset.view;


                    const titles = {

                        all:
                            "كل الطلبات",

                        buyer:
                            "طلبات المشترين",

                        seller:
                            "طلبات البائعين",

                        products:
                            "المنتجات المنشورة"

                    };


                    document.getElementById(
                        "panelTitle"
                    ).textContent =
                        titles[
                            currentView
                        ];


                    render();

                }
            );

        }
    );


/* =========================================================
   التحديث
========================================================= */

document
    .getElementById(
        "refreshButton"
    )
    .addEventListener(
        "click",
        loadAll
    );


/* =========================================================
   التشغيل
========================================================= */

loadAll();

</script>
