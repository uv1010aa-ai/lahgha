<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>لوحة التحكم | لَحْقها</title>

    <meta
        http-equiv="Cache-Control"
        content="no-cache, no-store, must-revalidate"
    >

    <meta
        http-equiv="Pragma"
        content="no-cache"
    >

    <meta
        http-equiv="Expires"
        content="0"
    >

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Tahoma, Arial, sans-serif;
            background: #f4f6f8;
            color: #172033;
            line-height: 1.7;
        }

        button,
        input,
        select {
            font-family: inherit;
        }

        .topbar {
            background: #111827;
            color: #fff;
            padding: 18px 22px;
        }

        .topbar-inner {
            width: min(1400px, 95%);
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .logo {
            font-size: 23px;
            font-weight: 900;
        }

        .subtitle {
            margin-top: 5px;
            color: #cbd5e1;
            font-size: 13px;
        }

        .top-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .top-button {
            border: 0;
            background: #fff;
            color: #111827;
            padding: 11px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 900;
            text-decoration: none;
            display: inline-block;
        }

        .top-button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .container {
            width: min(1400px, 95%);
            margin: 25px auto 50px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat {
            background: #fff;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, .06);
        }

        .stat-title {
            color: #64748b;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .stat-number {
            font-size: 30px;
            font-weight: 900;
        }

        .tabs {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 18px;
        }

        .tab {
            border: 0;
            padding: 12px 19px;
            border-radius: 10px;
            background: #e2e8f0;
            cursor: pointer;
            font-weight: 900;
        }

        .tab.active {
            background: #111827;
            color: #fff;
        }

        .panel {
            background: #fff;
            border-radius: 18px;
            padding: 20px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, .06);
        }

        .panel-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .panel-title {
            font-size: 21px;
            font-weight: 900;
        }

        .connection {
            font-size: 13px;
            color: #64748b;
        }

        .orders {
            display: grid;
            gap: 16px;
        }

        .card {
            border: 1px solid #e2e8f0;
            border-radius: 15px;
            padding: 18px;
            background: #fff;
        }

        .card-head {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }

        .badge {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 900;
            margin-bottom: 8px;
        }

        .badge-buyer {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .badge-seller {
            background: #dcfce7;
            color: #15803d;
        }

        .badge-product {
            background: #ede9fe;
            color: #6d28d9;
        }

        .order-number {
            color: #64748b;
            font-size: 13px;
            word-break: break-all;
        }

        .status {
            padding: 7px 12px;
            border-radius: 8px;
            background: #fef3c7;
            color: #92400e;
            font-size: 12px;
            font-weight: 900;
        }

        .status.transfer {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .status.approved {
            background: #dcfce7;
            color: #166534;
        }

        .status.hidden {
            background: #e2e8f0;
            color: #475569;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .info {
            background: #f8fafc;
            border-radius: 10px;
            padding: 12px;
            min-height: 68px;
        }

        .label {
            color: #64748b;
            font-size: 12px;
            margin-bottom: 7px;
        }

        .value {
            font-size: 14px;
            font-weight: 800;
            word-break: break-word;
        }

        .product {
            margin-top: 14px;
            padding: 14px;
            background: #f8fafc;
            border-radius: 11px;
        }

        .product-name {
            font-weight: 900;
        }

        .product-extra {
            margin-top: 7px;
            color: #64748b;
            font-size: 13px;
            line-height: 1.8;
        }

        .payment-box {
            margin-top: 14px;
            padding: 15px;
            border-radius: 12px;
            background: #eff6ff;
            border: 1px solid #bfdbfe;
        }

        .payment-title {
            font-weight: 900;
            margin-bottom: 7px;
            color: #1e3a8a;
        }

        .payment-value {
            font-size: 14px;
            font-weight: 800;
        }

        .transfer-warning {
            margin-top: 8px;
            color: #1d4ed8;
            font-size: 13px;
            font-weight: 900;
        }

        .seller-images {
            margin-top: 15px;
            padding: 15px;
            background: #f8fafc;
            border-radius: 12px;
        }

        .seller-images-title {
            font-size: 14px;
            font-weight: 900;
            margin-bottom: 12px;
        }

        .images-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
        }

        .product-image {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            display: block;
            border-radius: 11px;
            border: 1px solid #e2e8f0;
            background: #e5e7eb;
            cursor: pointer;
            transition: transform .2s, box-shadow .2s;
        }

        .product-image:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 18px rgba(0, 0, 0, .15);
        }

        .no-image {
            padding: 20px;
            text-align: center;
            color: #64748b;
            font-size: 13px;
            background: #fff;
            border-radius: 10px;
            border: 1px dashed #cbd5e1;
        }

        .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 16px;
            padding-top: 15px;
            border-top: 1px solid #edf0f3;
        }

        .action {
            border: 0;
            padding: 9px 15px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 900;
            color: #fff;
        }

        .action-approve {
            background: #16a34a;
        }

        .action-reject {
            background: #dc2626;
        }

        .action-step {
            background: #2563eb;
        }

        .action-settle {
            background: #ea580c;
        }

        .action:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        /* نافذة المعاينة الكبيرة للصورة */
        .image-modal {
            display: none;
            position: fixed;
            z-index: 10000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, .85);
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .image-modal-content {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, .5);
        }

        .image-modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #fff;
            font-size: 35px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
        }
    </style>
</head>

<body>

    <div class="topbar">
        <div class="topbar-inner">
            <div>
                <div class="logo">لوحة تحكم لَحْقها 🛍</div>
                <div class="subtitle">نظام الإدارة الشامل لتسوية المعاملات</div>
            </div>
            <div class="top-actions">
                <button class="top-button" id="btn-sync" onclick="loadAllData()">🔄 تحديث البيانات</button>
