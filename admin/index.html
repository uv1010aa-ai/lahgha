<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>لوحة التحكم | لَحْقها</title>

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Tahoma, Arial, sans-serif;
            background: #f4f6f8;
            color: #172033;
            line-height: 1.7;
        }

        button,
        input,
        select,
        textarea {
            font-family: inherit;
        }

        button {
            -webkit-tap-highlight-color: transparent;
        }

        .topbar {
            background: #111827;
            color: #fff;
            padding: 18px 22px;
        }

        .topbar-inner {
            width: min(1400px, 95%);
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .logo {
            font-size: 23px;
            font-weight: 900;
        }

        .subtitle {
            margin-top: 5px;
            color: #cbd5e1;
            font-size: 13px;
        }

        .top-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .top-button {
            border: 0;
            background: #fff;
            color: #111827;
            padding: 11px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 900;
            text-decoration: none;
            display: inline-block;
        }

        .top-button:hover {
            opacity: .9;
        }

        .top-button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .container {
            width: min(1400px, 95%);
            margin: 25px auto 50px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat {
            background: #fff;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, .06);
        }

        .stat-title {
            color: #64748b;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .stat-number {
            font-size: 30px;
            font-weight: 900;
        }

        .tabs {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 18px;
        }

        .tab {
            border: 0;
            padding: 12px 19px;
            border-radius: 10px;
            background: #e2e8f0;
            cursor: pointer;
            font-weight: 900;
        }

        .tab:hover {
            background: #cbd5e1;
        }

        .tab.active {
            background: #111827;
            color: #fff;
        }

        .panel {
            background: #fff;
            border-radius: 18px;
            padding: 20px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, .06);
        }

        .panel-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .panel-title {
            font-size: 21px;
            font-weight: 900;
        }

        .connection {
            font-size: 13px;
            color: #64748b;
        }

        .orders {
            display: grid;
            gap: 16px;
        }

        .card {
            border: 1px solid #e2e8f0;
            border-radius: 15px;
            padding: 18px;
            background: #fff;
        }

        .card-head {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }

        .badge {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 900;
            margin-bottom: 8px;
        }

        .badge-buyer {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .badge-seller {
            background: #dcfce7;
            color: #15803d;
        }

        .badge-product {
            background: #ede9fe;
            color: #6d28d9;
        }

        .order-number {
            color: #64748b;
            font-size: 13px;
            word-break: break-all;
        }

        .status {
            padding: 7px 12px;
            border-radius: 8px;
            background: #fef3c7;
            color: #92400e;
            font-size: 12px;
            font-weight: 900;
        }

        .status.transfer {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .status.approved {
            background: #dcfce7;
            color: #166534;
        }

        .status.hidden {
            background: #e2e8f0;
            color: #475569;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .info {
            background: #f8fafc;
            border-radius: 10px;
            padding: 12px;
            min-height: 68px;
        }

        .label {
            color: #64748b;
            font-size: 12px;
            margin-bottom: 7px;
        }

        .value {
            font-size: 14px;
            font-weight: 800;
            word-break: break-word;
        }

        .product {
            margin-top: 14px;
            padding: 14px;
            background: #f8fafc;
            border-radius: 11px;
        }

        .product-name {
            font-weight: 900;
        }

        .product-extra {
            margin-top: 7px;
            color: #64748b;
            font-size: 13px;
            line-height: 1.8;
        }

        .payment-box {
            margin-top: 14px;
            padding: 15px;
            border-radius: 12px;
            background: #eff6ff;
            border: 1px solid #bfdbfe;
        }

        .payment-title {
            font-weight: 900;
            margin-bottom: 7px;
            color: #1e3a8a;
        }

        .payment-value {
            font-size: 14px;
            font-weight: 800;
        }

        .transfer-warning {
            margin-top: 8px;
            color: #1d4ed8;
            font-size: 13px;
            font-weight: 900;
        }

        .seller-images {
            margin-top: 15px;
            padding: 15px;
            background: #f8fafc;
            border-radius: 12px;
        }

        .seller-images-title {
            font-size: 14px;
            font-weight: 900;
            margin-bottom: 12px;
        }

        .images-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
        }

        .product-image {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            display: block;
            border-radius: 11px;
            border: 1px solid #e2e8f0;
            background: #e5e7eb;
            cursor: pointer;
            transition: transform .2s, box-shadow .2s;
        }

        .product-image:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 18px rgba(0, 0, 0, .15);
        }

        .no-image {
            padding: 20px;
            text-align: center;
            color: #64748b;
            font-size: 13px;
            background: #fff;
            border-radius: 10px;
            border: 1px dashed #cbd5e1;
        }

        .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 16px;
            padding-top: 15px;
            border-top: 1px solid #edf0f3;
        }

        .action {
            border: 0;
            padding: 9px 15px;
            border-radius: 9px;
            cursor: pointer;
            font-weight: 900;
        }

        .action:hover {
            opacity: .88;
        }

        .action:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .accept {
            background: #dcfce7;
            color: #166534;
        }

        .delete {
            background: #fee2e2;
            color: #991b1b;
        }

        .wait {
            background: #fef3c7;
            color: #92400e;
        }

        .hide {
            background: #e2e8f0;
            color: #334155;
        }

        .show {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .edit {
            background: #ede9fe;
            color: #6d28d9;
        }

        .sync {
            background: #dbeafe;
            color: #1e40af;
        }

        .whatsapp-actions {
            margin-top: 14px;
            padding: 15px;
            border-radius: 12px;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
        }

        .whatsapp-title {
            font-weight: 900;
            color: #166534;
            margin-bottom: 10px;
        }

        .whatsapp-list {
            display: grid;
            gap: 10px;
        }

        .whatsapp-seller {
            background: #fff;
            border: 1px solid #dcfce7;
            border-radius: 10px;
            padding: 12px;
        }

        .whatsapp-seller-name {
            font-weight: 900;
            margin-bottom: 5px;
        }

        .whatsapp-seller-info {
            color: #64748b;
            font-size: 13px;
            margin-bottom: 9px;
        }

        .whatsapp-button {
            border: 0;
            background: #16a34a;
            color: #fff;
            padding: 10px 15px;
            border-radius: 9px;
            cursor: pointer;
            font-weight: 900;
        }

        .whatsapp-button:hover {
            background: #15803d;
        }

        .whatsapp-missing {
            color: #991b1b;
            font-size: 13px;
            font-weight: 800;
        }

        .sync-box {
            margin-bottom: 18px;
            padding: 15px;
            border-radius: 12px;
            background: #eff6ff;
            border: 1px solid #bfdbfe;
        }

        .sync-box-title {
            font-weight: 900;
            color: #1e3a8a;
            margin-bottom: 6px;
        }

        .sync-box-text {
            color: #64748b;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .empty,
        .loading,
        .error {
            text-align: center;
            padding: 50px 15px;
            color: #64748b;
        }

        .error {
            color: #b91c1c;
        }

        .error strong {
            display: block;
            margin-bottom: 10px;
        }

        .image-modal,
        .edit-modal {
            display: none;
            position: fixed;
            z-index: 9999;
            inset: 0;
            background: rgba(0, 0, 0, .75);
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .image-modal.open,
        .edit-modal.open {
            display: flex;
        }

        .image-modal img {
            max-width: 95vw;
            max-height: 90vh;
            object-fit: contain;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, .4);
        }

        .close-modal {
            position: absolute;
            top: 20px;
            left: 25px;
            width: 44px;
            height: 44px;
            border: 0;
            border-radius: 50%;
            background: #fff;
            color: #111827;
            font-size: 25px;
            font-weight: bold;
            cursor: pointer;
        }

        .edit-box {
            width: min(700px, 96vw);
            max-height: 92vh;
            overflow-y: auto;
            background: #fff;
            border-radius: 18px;
            padding: 22px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, .3);
        }

        .edit-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 18px;
        }

        .edit-title {
            font-size: 21px;
            font-weight: 900;
        }

        .edit-close {
            border: 0;
            background: #f1f5f9;
            color: #111827;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 22px;
            font-weight: 900;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        .form-label {
            font-size: 13px;
            color: #475569;
            font-weight: 900;
        }

        .form-input,
        .form-select,
        .form-textarea {
            width: 100%;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            padding: 11px 12px;
            outline: none;
            background: #fff;
            color: #172033;
            font-size: 14px;
        }

        .form-input:focus,
        .form-select:focus,
        .form-textarea:focus {
            border-color: #64748b;
            box-shadow: 0 0 0 3px rgba(100, 116, 139, .12);
        }

        .form-textarea {
            min-height: 120px;
            resize: vertical;
        }

        .edit-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 18px;
            padding-top: 15px;
            border-top: 1px solid #e2e8f0;
        }

        .save-button {
            border: 0;
            background: #111827;
            color: #fff;
            padding: 11px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 900;
        }

        .cancel-button {
            border: 0;
            background: #e2e8f0;
            color: #334155;
            padding: 11px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 900;
        }

        .edit-preview {
            margin-top: 15px;
            padding: 12px;
            background: #f8fafc;
            border-radius: 11px;
        }

        .edit-preview img {
            width: 110px;
            height: 110px;
            object-fit: cover;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
        }

        @media (max-width: 1150px) {

            .stats {
                grid-template-columns: repeat(3, 1fr);
            }

            .info-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .images-grid {
                grid-template-columns: repeat(4, 1fr);
            }

        }

        @media (max-width: 800px) {

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .images-grid {
                grid-template-columns: repeat(3, 1fr);
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }

        }

        @media (max-width: 600px) {

            .topbar-inner {
                flex-direction: column;
                align-items: flex-start;
            }

            .container {
                width: 96%;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .info-grid {
                grid-template-columns: 1fr;
            }

            .images-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .close-modal {
                top: 10px;
                left: 10px;
            }

            .top-actions {
                width: 100%;
            }

            .top-button {
                flex: 1;
                text-align: center;
            }

            .card {
                padding: 14px;
            }

        }

    </style>

</head>

<body>

<header class="topbar">

    <div class="topbar-inner">

        <div>

            <div class="logo">
                🔐 لوحة التحكم — لَحْقها
            </div>

            <div class="subtitle">
                إدارة طلبات المشترين والبائعين والمنتجات
            </div>

        </div>

        <div class="top-actions">

            <a
                href="../index.html"
                target="_blank"
                rel="noopener"
                class="top-button"
            >
                🏠 زيارة الموقع
            </a>

            <button
                id="syncButton"
                class="top-button"
                type="button"
            >
                🔄 مزامنة المنتجات
            </button>

            <button
                id="refreshButton"
                class="top-button"
                type="button"
            >
                🔄 تحديث
            </button>

        </div>

    </div>

</header>


<main class="container">

    <section class="stats">

        <div class="stat">
            <div class="stat-title">إجمالي الطلبات</div>
            <div id="totalOrders" class="stat-number">0</div>
        </div>

        <div class="stat">
            <div class="stat-title">طلبات المشترين</div>
            <div id="buyerOrders" class="stat-number">0</div>
        </div>

        <div class="stat">
            <div class="stat-title">طلبات البائعين</div>
            <div id="sellerOrders" class="stat-number">0</div>
        </div>

        <div class="stat">
            <div class="stat-title">قيد الانتظار</div>
            <div id="pendingOrders" class="stat-number">0</div>
        </div>

        <div class="stat">
            <div class="stat-title">المنتجات المنشورة</div>
            <div id="publishedProducts" class="stat-number">0</div>
        </div>

    </section>


    <section class="tabs">

        <button class="tab active" data-view="all" type="button">
            📋 كل الطلبات
        </button>

        <button class="tab" data-view="buyer" type="button">
            🛒 طلبات المشترين
        </button>

        <button class="tab" data-view="seller" type="button">
            📦 طلبات البائعين
        </button>

        <button class="tab" data-view="products" type="button">
            🏪 المنتجات المنشورة
        </button>

    </section>


    <section class="panel">

        <div class="panel-head">

            <div id="panelTitle" class="panel-title">
                كل الطلبات
            </div>

            <div id="connectionStatus" class="connection">
                جاري الاتصال...
            </div>

        </div>

        <div id="productsSyncBox" style="display:none;"></div>

        <div id="ordersContainer" class="orders">

            <div class="loading">
                جاري تحميل البيانات...
            </div>

        </div>

    </section>

</main>


<!-- نافذة الصور -->

<div id="imageModal" class="image-modal">

    <button
        id="closeModal"
        class="close-modal"
        type="button"
    >
        ×
    </button>

    <img
        id="modalImage"
        src=""
        alt="صورة المنتج"
    >

</div>


<!-- نافذة تعديل المنتج -->

<div id="editModal" class="edit-modal">

    <div class="edit-box">

        <div class="edit-head">

            <div class="edit-title">
                ✏️ تعديل المنتج
            </div>

            <button
                id="editCloseButton"
                class="edit-close"
                type="button"
            >
                ×
            </button>

        </div>

        <form id="editProductForm">

            <input
                type="hidden"
                id="editProductId"
            >

            <div class="form-grid">

                <div class="form-group">

                    <label class="form-label">
                        اسم المنتج
                    </label>

                    <input
                        id="editTitle"
                        class="form-input"
                        type="text"
                        required
                    >

                </div>


                <div class="form-group">

                    <label class="form-label">
                        السعر
                    </label>

                    <input
                        id="editPrice"
                        class="form-input"
                        type="number"
                        min="0"
                        step="0.01"
                        required
                    >

                </div>


                <div class="form-group">

                    <label class="form-label">
                        القسم
                    </label>

                    <select
                        id="editCategory"
                        class="form-select"
                    >

                        <option value="">اختر القسم</option>
                        <option value="كتب">كتب</option>
                        <option value="جوالات">جوالات</option>
                        <option value="كمبيوتر">كمبيوتر</option>
                        <option value="ألعاب">ألعاب</option>
                        <option value="أثاث">أثاث</option>
                        <option value="أجهزة">أجهزة</option>
                        <option value="رياضة">رياضة</option>
                        <option value="أدوات">أدوات</option>
                        <option value="ملابس">ملابس</option>
                        <option value="أسر منتجة">أسر منتجة</option>
                        <option value="أخرى">أخرى</option>

                    </select>

                </div>


                <div class="form-group">

                    <label class="form-label">
                        اسم البائع / الأسرة
                    </label>

                    <input
                        id="editSellerName"
                        class="form-input"
                        type="text"
                    >

                </div>


                <div class="form-group full">

                    <label class="form-label">
                        وصف المنتج
                    </label>

                    <textarea
                        id="editDescription"
                        class="form-textarea"
                    ></textarea>

                </div>


                <div class="form-group full">

                    <label class="form-label">
                        رابط الصورة الرئيسية
                    </label>

                    <input
                        id="editImage"
                        class="form-input"
                        type="url"
                        placeholder="https://..."
                    >

                </div>


                <div class="form-group full">

                    <label class="form-label">
                        روابط الصور الإضافية
                    </label>

                    <textarea
                        id="editImages"
                        class="form-textarea"
                        placeholder="ضع كل رابط صورة في سطر مستقل"
                    ></textarea>

                </div>

            </div>


            <div
                id="editPreview"
                class="edit-preview"
                style="display:none;"
            >

                <div
                    style="
                        font-weight:900;
                        margin-bottom:8px;
                    "
                >
                    معاينة الصورة
                </div>

                <img
                    id="editPreviewImage"
                    src=""
                    alt="معاينة"
                >

            </div>


            <div class="edit-actions">

                <button
                    class="save-button"
                    type="submit"
                    id="saveProductButton"
                >
                    💾 حفظ التعديلات
                </button>

                <button
                    class="cancel-button"
                    type="button"
                    id="editCancelButton"
                >
                    إلغاء
                </button>

            </div>

        </form>

    </div>

</div>

/* =========================================================
   أدوات عامة
========================================================= */

function clean(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "";
    }

    return String(value).trim();

}


function safe(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


function pick(row, names) {

    for (const name of names) {

        if (
            row &&
            row[name] !== undefined &&
            row[name] !== null &&
            clean(row[name]) !== ""
        ) {
            return row[name];
        }

    }

    return "";

}


function money(value) {

    if (
        value === null ||
        value === undefined ||
        clean(value) === ""
    ) {
        return "—";
    }

    const number = Number(value);

    if (Number.isNaN(number)) {
        return safe(value) + " ر.س";
    }

    return number.toLocaleString(
        "ar-SA",
        {
            maximumFractionDigits: 2
        }
    ) + " ر.س";

}


function dateText(value) {

    if (!value) {
        return "—";
    }

    const date = new Date(value);

    if (
        Number.isNaN(
            date.getTime()
        )
    ) {
        return safe(value);
    }

    return date.toLocaleString("ar-SA");

}


function normalizeCategory(value) {

    const category =
        clean(value);

    if (
        category === "اسر منتجه" ||
        category === "أسر منتجه" ||
        category === "اسر منتجة" ||
        category === "أسر منتجة"
    ) {
        return "أسر منتجة";
    }

    return category;

}

function getSellerImages(row) {

    const result = [];

    if (
        !row ||
        typeof row !== "object"
    ) {
        return [];
    }


    function addImage(value) {

        if (
            value === null ||
            value === undefined
        ) {
            return;
        }


        if (
            Array.isArray(value)
        ) {

            value.forEach(
                function(item) {
                    addImage(item);
                }
            );

            return;
        }


        if (
            typeof value === "object"
        ) {

            const possibleUrl =
                value.url ||
                value.publicUrl ||
                value.public_url ||
                value.image ||
                value.image_url ||
                value.imageUrl ||
                value.photo ||
                value.src;

            if (possibleUrl) {
                addImage(possibleUrl);
            }

            return;
        }


        if (
            typeof value !== "string"
        ) {
            return;
        }


        let text =
            value.trim();

        if (!text) {
            return;
        }


        if (
            text.startsWith("[") &&
            text.endsWith("]")
        ) {

            try {

                const parsed =
                    JSON.parse(text);

                if (
                    Array.isArray(parsed)
                ) {

                    parsed.forEach(
                        function(item) {
                            addImage(item);
                        }
                    );

                    return;
                }

            }
            catch (error) {
                console.warn(
                    "تعذر تحليل JSON للصور",
                    error
                );
            }

        }


        if (
            text.startsWith("{") &&
            text.endsWith("}")
        ) {

            try {

                const parsed =
                    JSON.parse(text);

                if (
                    parsed &&
                    typeof parsed === "object" &&
                    !Array.isArray(parsed)
                ) {

                    addImage(parsed);

                    return;
                }

            }
            catch (error) {
                /* نتابع المحاولة */
            }

            const inside =
                text.slice(
                    1,
                    -1
                ).trim();

            if (inside) {

                const parts = [];

                let current = "";
                let quoted = false;
                let escaped = false;

                for (
                    let i = 0;
                    i < inside.length;
                    i++
                ) {

                    const char =
                        inside[i];

                    if (escaped) {
                        current += char;
                        escaped = false;
                        continue;
                    }

                    if (char === "\\") {
                        escaped = true;
                        continue;
                    }

                    if (char === '"') {
                        quoted = !quoted;
                        continue;
                    }

                    if (
                        char === "," &&
                        !quoted
                    ) {

                        if (
                            current.trim()
                        ) {
                            parts.push(
                                current.trim()
                            );
                        }

                        current = "";

                        continue;
                    }

                    current += char;

                }

                if (
                    current.trim()
                ) {
                    parts.push(
                        current.trim()
                    );
                }

                parts.forEach(
                    function(item) {

                        const cleaned =
                            item
                                .replace(
                                    /^["']|["']$/g,
                                    ""
                                )
                                .trim();

                        if (cleaned) {
                            addImage(cleaned);
                        }

                    }
                );

                return;

            }

        }


        if (
            text.includes(",")
        ) {

            const parts =
                text
                    .split(",")
                    .map(
                        function(item) {

                            return item
                                .trim()
                                .replace(
                                    /^["']|["']$/g,
                                    ""
                                )
                                .trim();

                        }
                    )
                    .filter(Boolean);

            const imageParts =
                parts.filter(
                    function(item) {

                        return (
                            item.startsWith("http://") ||
                            item.startsWith("https://") ||
                            item.startsWith("data:image/")
                        );

                    }
                );

            if (
                imageParts.length > 0
            ) {

                imageParts.forEach(
                    function(item) {
                        addImage(item);
                    }
                );

                return;

            }

        }


        if (
            text.startsWith("http://") ||
            text.startsWith("https://") ||
            text.startsWith("data:image/")
        ) {

            result.push(text);

        }

    }


    addImage(row.images);
    addImage(row.photos);
    addImage(row.productImages);
    addImage(row.imageUrls);
    addImage(row.gallery);

    for (
        let i = 1;
        i <= 5;
        i++
    ) {

        addImage(
            row["image" + i]
        );

    }

    addImage(row.image);
    addImage(row.image_url);
    addImage(row.imageUrl);
    addImage(row.productImage);


    return [
        ...new Set(
            result
                .map(
                    function(item) {
                        return String(item).trim();
                    }
                )
                .filter(Boolean)
        )
    ];

}

========================================================= */

function parseOrderItems(value) {

    if (!value) {
        return [];
    }

    let items = value;

    if (
        typeof items === "string"
    ) {

        try {

            items =
                JSON.parse(items);

        }
        catch (error) {

            console.error(
                "تعذر تحليل items:",
                error
            );

            return [];

        }

    }

    if (
        !Array.isArray(items)
    ) {
        return [];
    }


    return items
        .filter(
            item =>
                item &&
                typeof item === "object"
        )
        .map(
            item => {

                const price =
                    Number(
                        item.price
                    ) || 0;

                const quantity =
                    Math.max(
                        1,
                        Number(
                            item.quantity
                        ) || 1
                    );

                const title =
                    item.title ||
                    item.name ||
                    item.product_name ||
                    "منتج";

                const image =
                    item.image ||
                    item.image_url ||
                    item.imageUrl ||
                    "";

                const familyName =
                    item.family_name ||
                    item.familyName ||
                    item.seller_name ||
                    "";

                return {

                    id:
                        item.id ??
                        item.product_id ??
                        item.productId ??
                        "",

                    name:
                        item.name ||
                        title,

                    title:
                        title,

                    category:
                        normalizeCategory(
                            item.category ||
                            item.product_category ||
                            ""
                        ),

                    familyName:
                        familyName,

                    familySlug:
                        item.family_slug ||
                        item.familySlug ||
                        "",

                    price:
                        price,

                    quantity:
                        quantity,

                    image:
                        image,

                    sellerRequestId:
                        item.seller_request_id ||
                        item.sellerRequestId ||
                        null,

                    sellerName:
                        item.seller_name ||
                        item.sellerName ||
                        "",

                    subtotal:
                        Number(
                            item.subtotal
                        ) ||
                        Number(
                            (
                                price *
                                quantity
                            ).toFixed(2)
                        )

                };

            }
        );

}

async function getOrderSellers(order) {

    const items =
        order.items || [];

    if (
        !items.length
    ) {
        return [];
    }


    /*
     * أولًا نأخذ seller_request_id الموجود أصلًا
     */
    const directRequestIds =
        [
            ...new Set(
                items
                    .map(
                        item =>
                            clean(
                                item.sellerRequestId ||
                                item.seller_request_id
                            )
                    )
                    .filter(Boolean)
            )
        ];


    /*
     * نحاول ربط المنتجات من products
     */
    const productIds =
        [
            ...new Set(
                items
                    .map(
                        item =>
                            clean(
                                item.id ||
                                item.product_id ||
                                item.productId
                            )
                    )
                    .filter(Boolean)
            )
        ];


    let productRows = [];


    if (
        productIds.length > 0
    ) {

        const productResult =
            await db
                .from(PRODUCTS_TABLE)
                .select(
                    "id,seller_request_id,seller_id,seller_name,title,product_name"
                )
                .in(
                    "id",
                    productIds
                );


        if (
            productResult.error
        ) {

            console.warn(
                "تعذر قراءة ربط المنتجات:",
                productResult.error.message
            );

        }
        else {

            productRows =
                productResult.data || [];

        }

    }


    const productMap =
        new Map();


    productRows.forEach(
        product => {

            productMap.set(
                String(product.id),
                product
            );

        }
    );


    /*
     * إذا لم يوجد seller_request_id،
     * نحاول الربط بالاسم مع seller_requests.
     */
    let sellerRows = [];

    const sellerRequestResult =
        await db
            .from(SELLER_TABLE)
            .select(
                "id,seller_name,phone,city,product_name,status,published"
            );


    if (
        !sellerRequestResult.error
    ) {

        sellerRows =
            sellerRequestResult.data || [];

    }


    const resolvedItems =
        items.map(
            item => {

                let sellerRequestId =
                    clean(
                        item.sellerRequestId ||
                        item.seller_request_id
                    );

                const productId =
                    clean(
                        item.id ||
                        item.product_id ||
                        item.productId
                    );

                const product =
                    productMap.get(
                        String(productId)
                    );


                if (
                    !sellerRequestId &&
                    product &&
                    product.seller_request_id
                ) {

                    sellerRequestId =
                        clean(
                            product.seller_request_id
                        );

                }


                /*
                 * محاولة أخيرة بالاسم
                 */
                if (
                    !sellerRequestId &&
                    sellerRows.length > 0
                ) {

                    const itemTitle =
                        clean(
                            item.title ||
                            item.name
                        ).toLowerCase();

                    const itemSeller =
                        clean(
                            item.sellerName ||
                            item.seller_name ||
                            product?.seller_name
                        ).toLowerCase();


                    const matched =
                        sellerRows.find(
                            seller => {

                                const sellerTitle =
                                    clean(
                                        seller.product_name
                                    ).toLowerCase();

                                const sellerName =
                                    clean(
                                        seller.seller_name
                                    ).toLowerCase();


                                const titleMatch =
                                    itemTitle &&
                                    sellerTitle &&
                                    (
                                        itemTitle === sellerTitle
                                    );


                                const sellerMatch =
                                    itemSeller &&
                                    sellerName &&
                                    (
                                        itemSeller === sellerName
                                    );


                                return (
                                    titleMatch &&
                                    (
                                        !itemSeller ||
                                        sellerMatch
                                    )
                                );

                            }
                        );


                    if (
                        matched
                    ) {

                        sellerRequestId =
                            clean(
                                matched.id
                            );

                    }

                }


                return {

                    ...item,

                    sellerRequestId:
                        sellerRequestId || null,

                    sellerName:
                        clean(
                            item.sellerName ||
                            item.seller_name ||
                            product?.seller_name
                        )

                };

            }
        );


    const ids =
        [
            ...new Set(
                resolvedItems
                    .map(
                        item =>
                            clean(
                                item.sellerRequestId
                            )
                    )
                    .filter(Boolean)
            )
        ];


    if (
        ids.length === 0
    ) {
        return [];
    }


    const sellerResult =
        await db
            .from(SELLER_TABLE)
            .select(
                "id,seller_name,phone,city,product_name,status,published"
            )
            .in(
                "id",
                ids
            );


    if (
        sellerResult.error
    ) {

        throw new Error(
            "تعذر قراءة بيانات أصحاب السلع: " +
            sellerResult.error.message
        );

    }


    const sellers =
        sellerResult.data || [];


    const sellerMap =
        new Map();


    sellers.forEach(
        seller => {

            sellerMap.set(
                String(seller.id),
                seller
            );

        }
    );


    const grouped =
        new Map();


    resolvedItems.forEach(
        item => {

            const requestId =
                clean(
                    item.sellerRequestId
                );

            if (
                !requestId
            ) {
                return;
            }


            const seller =
                sellerMap.get(
                    String(requestId)
                );


            if (
                !seller
            ) {
                return;
            }


            if (
                !grouped.has(requestId)
            ) {

                grouped.set(
                    requestId,
                    {

                        sellerRequestId:
                            requestId,

                        sellerName:
                            clean(
                                seller.seller_name ||
                                item.sellerName
                            ) ||
                            "صاحب السلعة",

                        phone:
                            clean(
                                seller.phone
                            ),

                        city:
                            clean(
                                seller.city
                            ),

                        items:
                            []

                    }
                );

            }


            grouped
                .get(requestId)
                .items
                .push(item);

        }
    );


    return [
        ...grouped.values()
    ];

}


/* =========================================================
   واتساب
========================================================= */

function whatsappPhone(value) {

    let phone =
        clean(value);

    if (
        !phone
    ) {
        return "";
    }


    phone =
        phone.replace(
            /[\s\-()]/g,
            ""
        );


    if (
        phone.startsWith("00")
    ) {

        phone =
            phone.substring(2);

    }


    if (
        phone.startsWith("05") &&
        phone.length === 10
    ) {

        phone =
            "966" +
            phone.substring(1);

    }


    if (
        phone.startsWith("+")
    ) {

        phone =
            phone.substring(1);

    }


    if (
        phone.startsWith("966")
    ) {

        return phone;

    }


    /*
     * إذا كان رقمًا سعوديًا بدون 0
     * مثل 5xxxxxxxx
     */
    if (
        phone.length === 9 &&
        phone.startsWith("5")
    ) {

        phone =
            "966" +
            phone;

    }


    return phone;

}

async function openSellerWhatsApp(
    orderId,
    sellerRequestId
) {

    try {

        const order =
            allOrders.find(
                item =>
                    item.type === "buyer" &&
                    String(item.id) ===
                    String(orderId)
            );


        if (
            !order
        ) {

            alert(
                "تعذر العثور على الطلب."
            );

            return;

        }


        const sellers =
            await getOrderSellers(
                order
            );


        const seller =
            sellers.find(
                item =>
                    String(
                        item.sellerRequestId
                    ) ===
                    String(
                        sellerRequestId
                    )
            );


        if (
            !seller
        ) {

            alert(
                "تعذر العثور على صاحب هذه السلعة."
            );

            return;

        }


        const phone =
            whatsappPhone(
                seller.phone
            );


        if (
            !phone
        ) {

            alert(
                "لا يوجد رقم جوال محفوظ لصاحب هذه السلعة."
            );

            return;

        }


        const message =
            buildSellerWhatsAppMessage(
                order,
                seller
            );


        const url =
            "https://wa.me/" +
            phone +
            "?text=" +
            encodeURIComponent(
                message
            );


        window.open(
            url,
            "_blank",
            "noopener,noreferrer"
        );

    }
    catch (error) {

        console.error(
            "WHATSAPP ERROR:",
            error
        );

        alert(
            "❌ تعذر تجهيز رسالة واتساب:\n\n" +
            error.message
        );

    }

}

async function loadBuyerOrders() {

    const result =
        await db
            .from(BUYER_TABLE)
            .select("*")
            .order(
                "created_at",
                {
                    ascending: false
                }
            );


    if (
        result.error
    ) {

            "خطأ في جدول orders: " +
            result.error.message
        );

    }


    return (
        result.data || []
    ).map(
        mapBuyer
    );

}


async function loadSellerOrders() {

    const result =
        await db
            .from(SELLER_TABLE)
            .select("*");


    if (
        result.error
    ) {

        throw new Error(
            "خطأ في جدول seller_requests: " +
            result.error.message
        );

    }


    const rows =
        result.data || [];


    rows.sort(
        function(a, b) {

            return (
                new Date(
                    b.created_at || 0
                )
                -
                new Date(
                    a.created_at || 0
                )
            );

        }
    );


    return rows.map(
        mapSeller
    );

}

========================================================= */

function buildProductData(seller) {

    const raw =
        seller.raw || {};


    const sellerRequestId =
        clean(
            raw.id
        ) || null;


    const sellerIdValue =
        raw.seller_id ??
        raw.sellerId ??
        null;


    const sellerNameValue =
        clean(
            raw.seller_name ||
            raw.sellerName ||
            seller.name
        ) || null;


    const title =
        pick(
            raw,
            [
                "product_name",
                "productName",
                "item_name",
                "title",
                "name"
            ]
        ) || "منتج";


    const description =
        pick(
            raw,
            [
                "description",
                "details",
                "product_description"
            ]
        ) || "";


    const priceValue =
        pick(
            raw,
            [
                "price",
                "product_price",
                "amount",
                "total"
            ]
        );


    const priceNumber =
        priceValue === ""
            ? 0
            : Number(
                priceValue
            );


    const category =
        normalizeCategory(
            pick(
                raw,
                [
                    "category",
                    "product_category",
                    "category_name"
                ]
            )
        );


    const images =
        getSellerImages(
            raw
        );


    const firstImage =
        images.length > 0
            ? images[0]
            : null;


    const family =
        getFamilyData(
            raw
        );


    const productData = {

        title:
            title,

        description:
            description,

        price:
            Number.isFinite(
                priceNumber
            )
                ? priceNumber
                : 0,

        category:
            category,

        image:
            firstImage,

        available:
            true,

        images:
            images,

        family_name:
            family.familyName,

        family_slug:
            family.familySlug,

        family_page:
            family.familyPage,

        seller_id:
            sellerIdValue,

        seller_name:
            sellerNameValue,

        seller_request_id:
            sellerRequestId

    };


    if (
        family.familySlug === "sugar-rose"
    ) {

        productData.category =
            "أسر منتجة";

    }


    return productData;

}


/* =========================================================
   نشر المنتج
========================================================= */

async function publishSellerProduct(seller) {

    const productData =
        buildProductData(
            seller
        );


    if (
        !productData.seller_request_id
    ) {

        throw new Error(
            "معرف طلب البائع غير موجود."
        );

    }


    const existingByRequest =
        await db
            .from(PRODUCTS_TABLE)
            .select("id")
            .eq(
                "seller_request_id",
                productData.seller_request_id
            )
            .limit(1);


    if (
        existingByRequest.error
    ) {

        throw new Error(
            "تعذر التحقق من المنتج المرتبط: " +
            existingByRequest.error.message
        );

    }


    if (
        existingByRequest.data &&
        existingByRequest.data.length > 0
    ) {

        const existingId =
            existingByRequest
                .data[0]
                .id;


        const updateExisting =
            await db
                .from(PRODUCTS_TABLE)
                .update(
                    productData
                )
                .eq(
                    "id",
                    existingId
                );


        if (
            updateExisting.error
        ) {

            throw new Error(
                "تعذر تحديث المنتج: " +
                updateExisting.error.message
            );

        }


        return {

            success:
                true,

            alreadyExists:
                true,

            productId:
                existingId

        };

    }


    const result =
        await db
            .from(PRODUCTS_TABLE)
            .insert(
                productData
            )
            .select()
            .single();


    if (
        result.error
    ) {

        throw new Error(
            "تعذر نشر السلعة في products: " +
            result.error.message
        );

    }


    return {

        success:
            true,

        alreadyExists:
            false,

        productId:
            result.data?.id || null

    };

}

function productAvailable(product) {

    if (
        product.available === false ||
        product.available === "false" ||
        product.available === 0 ||
        product.available === "0"
    ) {

        return false;

    }

    return true;

}


function productStatus(product) {

    if (

            className:
                "approved"

        };

    }


    return {

        className:
            "hidden"

    };

}

/* =========================================================
   اعتماد الطلب / نشر المنتج
========================================================= */

async function changeStatus(
    id,
    type,
    status
) {

    if (
        !id
    ) {

        alert(
            "رقم الطلب غير موجود."
        );

        return;

    }


    try {

        if (
            type === "buyer"
        ) {

            const result =
                await db
                    .from(BUYER_TABLE)
                    .update({
                        status:
                            status
                    })
                    .eq(
                        "id",
                        id
                    );


            if (
                result.error
            ) {

                throw new Error(
                    result.error.message
                );

            }


            await loadAll();

            return;

        }


        const sellerResult =
            await db
                .from(SELLER_TABLE)
                .select("*")
                .eq(
                    "id",
                    id
                )
                .single();


        if (
            sellerResult.error
        ) {

            throw new Error(
                "تعذر قراءة بيانات السلعة: " +
                sellerResult.error.message
            );

        }


        const seller =
            sellerResult.data;


        if (
            status === "approved"
        ) {

            const publishResult =
                await publishSellerProduct(
                    mapSeller(
                        seller
                    )
                );


            const now =
                new Date().toISOString();


            const updateResult =
                await db
                    .from(SELLER_TABLE)
                    .update({

                        status:
                            "approved",

                        approved_at:
                            now,

                        published:
                            true,

                        published_at:
                            now

                    })
                    .eq(
                        "id",
                        id
                    );


            if (
                updateResult.error
            ) {

                throw new Error(
                    "تم نشر المنتج ولكن تعذر تحديث حالة طلب البائع: " +
                    updateResult.error.message
                );

            }


            if (
                publishResult.alreadyExists
            ) {

                alert(
                    "✓ المنتج كان موجودًا، وتم تحديث بياناته وربطه بالبائع."
                );

            }
            else {

                alert(
                    "✓ تم قبول طلب البائع ونشر المنتج في المتجر."
                );

            }


            await loadAll();

            return;

        }


        const result =
            await db
                .from(SELLER_TABLE)
                .update({
                    status:
                        status
                })
                .eq(
                    "id",
                    id
                );


        if (
            result.error
        ) {

            throw new Error(
                result.error.message
            );

        }


        await loadAll();

    }
    catch (error) {

        console.error(
            "CHANGE STATUS ERROR:",
            error
        );

        alert(
            "❌ تعذر تنفيذ العملية:\n\n" +
            error.message
        );

    }

}

   حذف الطلب
========================================================= */

async function deleteOrder(
    id,
    type
) {

    if (
        !id
    ) {

        alert(
            "رقم الطلب غير موجود."
        );

        return;

    }


    const table =
        type === "buyer"
            ? BUYER_TABLE
            : SELLER_TABLE;


    const confirmed =
        confirm(

            type === "buyer"

            ?

            "⚠️ هل أنت متأكد من حذف طلب المشتري نهائيًا؟"

            :

            "⚠️ هل أنت متأكد من حذف طلب البائع نهائيًا؟"

        );


    if (
        !confirmed
    ) {
        return;
    }


    try {

        const result =
            await db
                .from(table)
                .delete()
                .eq(
                    "id",
                    id
                );


        if (
            result.error
        ) {

            throw new Error(
                result.error.message
            );

        }


        allOrders =
            allOrders.filter(
                order =>
                    !(
                        String(order.id) === String(id) &&
                        order.type === type
                    )
            );


        updateStats();
        render();


        alert(
            "✓ تم حذف الطلب بنجاح."
        );

    }
    catch (error) {

        console.error(
            "DELETE ERROR:",
            error
        );

        alert(
            "❌ لم يتم الحذف:\n\n" +
            error.message
        );

    }

}

        product.family_name ||

/* =========================================================
   مزامنة المنتجات
========================================================= */

async function syncProductsFromSellerRequests() {

    const button =
        document.getElementById(
            "syncButton"
        );


    const confirmed =
        confirm(
            "سيتم البحث عن طلبات البائعين المعتمدة أو المنشورة وإنشاء المنتجات الناقصة في جدول products.\n\nهل تريد المتابعة؟"
        );


    if (
        !confirmed
    ) {
        return;
    }


    button.disabled =
        true;

    button.textContent =
        "⏳ جاري المزامنة...";


    try {

        const sellerResult =
            await db
                .from(SELLER_TABLE)
                .select("*");


        if (
            sellerResult.error
        ) {

            throw new Error(
                "تعذر قراءة طلبات البائعين: " +
                sellerResult.error.message
            );

        }


        const sellerRows =
            sellerResult.data || [];


        const approvedRows =
            sellerRows.filter(
                row => {

                    const status =
                        clean(
                            row.status
                        ).toLowerCase();

                    return (
                        isApprovedStatus(status) ||
                        row.published === true
                    );

                }
            );


        if (
            approvedRows.length === 0
        ) {

            alert(
                "لا توجد طلبات بائعين معتمدة أو منشورة للمزامنة."
            );

            return;

        }


        let created =
            0;

        let updated =
            0;

        let failed =
            0;


        for (
            const row of approvedRows
        ) {

            try {

                const result =
                    await publishSellerProduct(
                        mapSeller(row)
                    );


                if (
                    result.alreadyExists
                ) {

                    updated++;

                }
                else {

                    created++;

                }

            }
            catch (error) {

                console.error(
                    "SYNC ITEM ERROR:",
                    error
                );

                failed++;

            }

        }


        await loadAll();


        alert(
            "✓ انتهت المزامنة.\n\n" +
            "منتجات جديدة: " +
            created +
            "\n" +
            "منتجات تم تحديثها: " +
            updated +
            "\n" +
            "فشل: " +
            failed
        );

    }
    catch (error) {

        console.error(
            "SYNC ERROR:",
            error
        );

        alert(
            "❌ فشلت مزامنة المنتجات:\n\n" +
            error.message
        );

    }
    finally {

        button.disabled =
            false;

        button.textContent =
            "🔄 مزامنة المنتجات";

    }

}


/* =========================================================
   تحميل كل البيانات
========================================================= */

async function loadAll() {

    const container =
        document.getElementById(
            "ordersContainer"
        );


    const connection =
        document.getElementById(
            "connectionStatus"
        );


    const refresh =
        document.getElementById(
            "refreshButton"
        );


    refresh.disabled =
        true;


    refresh.textContent =
        "⏳ جاري التحديث...";


    container.innerHTML = `

        <div class="loading">
            جاري تحميل البيانات...
        </div>

    `;


    try {

        const buyers =
            await loadBuyerOrders();


        const sellers =
            await loadSellerOrders();


        const products =
            await loadProducts();


        allOrders = [

            ...buyers,

            ...sellers

        ];


        allProducts =
            products;


        allOrders.sort(
            function(a, b) {

                return (

                    new Date(
                        b.created || 0
                    )

                    -

                    new Date(
                        a.created || 0
                    )

                );

            }
        );


        updateStats();
        render();


        connection.textContent =
            "✓ متصل — تم تحميل الطلبات والمنتجات";

    }
    catch (error) {

        console.error(
            "ADMIN ERROR:",
            error
        );


        container.innerHTML = `

            <div class="error">

                <strong>
                    تعذر تحميل البيانات
                </strong>

                ${safe(
                    error.message
                )}

                <br><br>

                تأكد من أن مفتاح Supabase في أعلى الملف
                هو المفتاح الموجود في نسختك الأصلية.

            </div>

        `;


        connection.textContent =
            "❌ حدث خطأ في الاتصال";

    }
    finally {

        refresh.disabled =
            false;

        refresh.textContent =
            "🔄 تحديث";

    }

}


/* =========================================================
   نافذة الصور
========================================================= */

function openImageModal(
    url
) {

    const modal =
        document.getElementById(
            "imageModal"
        );


    const image =
        document.getElementById(
            "modalImage"
        );


    image.src =
        url;


    modal.classList.add(
        "open"
    );

}


function closeImageModal() {

    const modal =
        document.getElementById(
            "imageModal"
        );


    const image =
        document.getElementById(
            "modalImage"
        );


    modal.classList.remove(
        "open"
    );


    image.src =
        "";

}


document
    .getElementById(
        "closeModal"
    )
    .addEventListener(
        "click",
        closeImageModal
    );


document
    .getElementById(
        "imageModal"
    )
    .addEventListener(
        "click",
        function(event) {

            if (
                event.target ===
                this
            ) {

                closeImageModal();

            }

        }
    );


/* =========================================================
   نافذة التعديل
========================================================= */

document
    .getElementById(
        "editCloseButton"
    )
    .addEventListener(
        "click",
        closeEditProduct
    );


document
    .getElementById(
        "editCancelButton"
    )
    .addEventListener(
        "click",
        closeEditProduct
    );


document
    .getElementById(
        "editProductForm"
    )
    .addEventListener(
        "submit",
        saveProductEdit
    );


document
    .getElementById(
        "editImage"
    )
    .addEventListener(
        "input",
        updateEditPreview
    );


document
    .getElementById(
        "editModal"
    )
    .addEventListener(
        "click",
        function(event) {

            if (
                event.target ===
                this
            ) {

                closeEditProduct();

            }

        }
    );


/* =========================================================
   لوحة الصور والتعديل - ESC
========================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key ===
            "Escape"
        ) {

            closeImageModal();
            closeEditProduct();

        }

    }
);


/* =========================================================
   التبويبات
========================================================= */

document
    .querySelectorAll(
        ".tab"
    )
    .forEach(
        function(button) {

            button.addEventListener(
                "click",
                function() {

                    document
                        .querySelectorAll(
                            ".tab"
                        )
                        .forEach(
                            function(item) {

                                item.classList.remove(
                                    "active"
                                );

                            }
                        );


                    button.classList.add(
                        "active"
                    );


                    currentView =
                        button.dataset.view;


                    const titles = {

                        all:
                            "كل الطلبات",

                        buyer:
                            "طلبات المشترين",

                        seller:
                            "طلبات البائعين",

                        products:
                            "المنتجات المنشورة"

                    };


                    document.getElementById(
                        "panelTitle"
                    ).textContent =
                        titles[
                            currentView
                        ];


                    render();

                }
            );

        }
    );


/* =========================================================
   الأزرار
========================================================= */

document
    .getElementById(
        "refreshButton"
    )
    .addEventListener(
        "click",
        loadAll
    );


document
    .getElementById(
        "syncButton"
    )
    .addEventListener(
        "click",
        syncProductsFromSellerRequests
    );


/* =========================================================
   التشغيل
========================================================= */

loadAll();

</script>
