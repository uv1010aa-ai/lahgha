<script>


/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://gyyyzavjzvcxzgrtukqu.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_Rj6F5Fp2tHJSWzbRRdLVZQ_8D5wL8p-";


const db =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   الجداول
========================================================= */

const BUYER_TABLE =
    "orders";


const SELLER_TABLE =
    "seller_requests";


const PRODUCTS_TABLE =
    "products";


/* =========================================================
   الحالة
========================================================= */

let allOrders = [];

let currentView = "all";


/* =========================================================
   أدوات
========================================================= */

function clean(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }


    return String(value).trim();

}


function safe(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


function pick(row,names){

    for(
        const name of names
    ){

        if(
            row &&
            row[name] !== undefined &&
            row[name] !== null &&
            clean(row[name]) !== ""
        ){

            return row[name];

        }

    }


    return "";

}


function money(value){

    if(
        value === null ||
        value === undefined ||
        clean(value) === ""
    ){

        return "—";

    }


    const number =
        Number(value);


    if(
        Number.isNaN(number)
    ){

        return safe(value) +
            " ر.س";

    }


    return number.toLocaleString(
        "ar-SA",
        {
            maximumFractionDigits:2
        }
    ) +
    " ر.س";

}


function dateText(value){

    if(!value){

        return "—";

    }


    const date =
        new Date(value);


    if(
        Number.isNaN(
            date.getTime()
        )
    ){

        return safe(value);

    }


    return date.toLocaleString(
        "ar-SA"
    );

}


/* =========================================================
   حالة الطلب
========================================================= */

function getStatus(value){

    const status =
        clean(value).toLowerCase();


    if(
        status === "approved" ||
        status === "accepted" ||
        status === "confirmed" ||
        status === "مقبول"
    ){

        return {

            text:
                "مقبول",

            className:
                "approved"

        };

    }


    if(
        status === "waiting_transfer"
    ){

        return {

            text:
                "💳 بانتظار التحقق من التحويل",

            className:
                "transfer"

        };

    }


    return {

        text:
            "قيد الانتظار",

        className:
            ""

    };

}


/* =========================================================
   صور البائع
========================================================= */

function getSellerImages(row){

    const result = [];


    let images =
        row
        ? row.images
        : null;


    if(
        typeof images === "string"
    ){

        try{

            images =
                JSON.parse(images);

        }
        catch(error){

            images =
                [images];

        }

    }


    if(
        Array.isArray(images)
    ){

        images.forEach(
            function(item){

                if(
                    typeof item === "string" &&
                    item.trim()
                ){

                    result.push(
                        item.trim()
                    );

                }

                else if(
                    item &&
                    typeof item === "object"
                ){

                    const url =
                        item.url ||
                        item.publicUrl ||
                        item.image ||
                        item.image_url;


                    if(url){

                        result.push(
                            String(url)
                        );

                    }

                }

            }
        );

    }


    const oldImage =
        row
        ? (
            row.image ||
            row.image_url
        )
        : "";


    if(
        oldImage &&
        !result.includes(
            String(oldImage)
        )
    ){

        result.unshift(
            String(oldImage)
        );

    }


    return [
        ...new Set(
            result.filter(Boolean)
        )
    ];

}


function sellerImagesHtml(images){

    if(
        !images ||
        images.length === 0
    ){

        return `

        <div class="seller-images">

            <div class="seller-images-title">
                📷 صور السلعة
            </div>

            <div class="no-image">
                لا توجد صورة مرفقة بهذا الطلب.
            </div>

        </div>

        `;

    }


    return `

    <div class="seller-images">

        <div class="seller-images-title">

            📷 صور السلعة
            (${images.length})

        </div>


        <div class="images-grid">

            ${
                images
                .map(
                    function(url,index){

                        return `

                        <img
                            class="product-image"
                            src="${safe(url)}"
                            alt="صورة السلعة ${index + 1}"
                            loading="lazy"
                            onclick="openImageModal(this.src)"
                            onerror="this.style.display='none'"
                        >

                        `;

                    }
                )
                .join("")
            }

        </div>

    </div>

    `;

}


/* =========================================================
   بيانات المشتري
========================================================= */

function productName(row){

    return pick(
        row,
        [
            "product_name",
            "productName",
            "item_name",
            "title",
            "name"
        ]
    ) || "—";

}


function mapBuyer(row){

    return {

        type:
            "buyer",

        id:
            pick(
                row,
                ["id"]
            ),

        number:
            pick(
                row,
                [
                    "order_number",
                    "orderNumber"
                ]
            ),

        name:
            pick(
                row,
                [
                    "buyer_name",
                    "buyerName"
                ]
            ),

        phone:
            pick(
                row,
                [
                    "buyer_phone",
                    "buyerPhone"
                ]
            ),

        city:
            pick(
                row,
                [
                    "buyer_city",
                    "city"
                ]
            ),

        address:
            pick(
                row,
                [
                    "buyer_address",
                    "address",
                    "shipping_address"
                ]
            ),

        total:
            pick(
                row,
                [
                    "total"
                ]
            ),

        status:
            pick(
                row,
                [
                    "status"
                ]
            ),

        paymentMethod:
            pick(
                row,
                [
                    "payment_method",
                    "paymentMethod"
                ]
            ),

        created:
            pick(
                row,
                [
                    "created_at"
                ]
            ),

        product:
            productName(row),

        productExtra:
            "",

        images:
            [],

        raw:
            row

    };

}


/* =========================================================
   بيانات البائع
========================================================= */

function sellerExtra(row){

    const parts = [];


    const quantity =
        pick(
            row,
            [
                "quantity",
                "qty"
            ]
        );


    const category =
        pick(
            row,
            [
                "category",
                "product_category"
            ]
        );


    if(quantity){

        parts.push(
            "الكمية: " +
            safe(quantity)
        );

    }


    if(category){

        parts.push(
            "التصنيف: " +
            safe(category)
        );

    }


    return parts.join(
        " — "
    );

}


function mapSeller(row){

    return {

        type:
            "seller",

        id:
            pick(
                row,
                ["id"]
            ),

        number:
            pick(
                row,
                [
                    "order_number",
                    "request_number",
                    "id"
                ]
            ),

        name:
            pick(
                row,
                [
                    "seller_name"
                ]
            ),

        phone:
            pick(
                row,
                [
                    "phone"
                ]
            ),

        city:
            pick(
                row,
                [
                    "city",
                    "seller_city"
                ]
            ),

        address:
            pick(
                row,
                [
                    "address",
                    "seller_address"
                ]
            ),

        total:
            pick(
                row,
                [
                    "price",
                    "total",
                    "amount"
                ]
            ),

        status:
            pick(
                row,
                [
                    "status"
                ]
            ),

        paymentMethod:
            "",

        created:
            pick(
                row,
                [
                    "created_at",
                    "createdAt"
                ]
            ),

        product:
            pick(
                row,
                [
                    "product_name",
                    "productName",
                    "item_name",
                    "title",
                    "name"
                ]
            ) || "—",

        productExtra:
            sellerExtra(row),

        images:
            getSellerImages(row),

        raw:
            row

    };

}


/* =========================================================
   تحميل طلبات المشترين
========================================================= */

async function loadBuyerOrders(){

    const result =
        await db
            .from(BUYER_TABLE)
            .select("*")
            .order(
                "created_at",
                {
                    ascending:false
                }
            );


    if(result.error){

        throw new Error(
            "خطأ في جدول orders: " +
            result.error.message
        );

    }


    return (
        result.data || []
    ).map(
        mapBuyer
    );

}


/* =========================================================
   تحميل طلبات البائعين
========================================================= */

async function loadSellerOrders(){

    const result =
        await db
            .from(SELLER_TABLE)
            .select("*");


    if(result.error){

        throw new Error(
            "خطأ في جدول seller_requests: " +
            result.error.message
        );

    }


    const rows =
        result.data || [];


    rows.sort(
        function(a,b){

            return (
                new Date(
                    b.created_at || 0
                )
                -
                new Date(
                    a.created_at || 0
                )
            );

        }
    );


    return rows.map(
        mapSeller
    );

}


/* =========================================================
   بناء المنتج
========================================================= */

function buildProductData(seller){

    const title =
        pick(
            seller.raw,
            [
                "product_name",
                "productName",
                "item_name",
                "title",
                "name"
            ]
        ) || "منتج";


    const description =
        pick(
            seller.raw,
            [
                "description",
                "details",
                "product_description"
            ]
        ) || "";


    const priceValue =
        pick(
            seller.raw,
            [
                "price",
                "product_price",
                "amount",
                "total"
            ]
        );


    const price =
        priceValue === ""
        ? 0
        : Number(priceValue);


    const category =
        pick(
            seller.raw,
            [
                "category",
                "product_category",
                "category_name"
            ]
        ) || "";


    const images =
        getSellerImages(
            seller.raw
        );


    const firstImage =
        images.length > 0
        ? images[0]
        : null;


    return {

        title:
            title,

        description:
            description,

        price:
            Number.isFinite(price)
            ? price
            : 0,

        category:
            category,

        image:
            firstImage,

        available:
            true,

        images:
            images

    };

}


/* =========================================================
   نشر سلعة البائع
========================================================= */

async function publishSellerProduct(
    seller
){

    const productData =
        buildProductData(
            seller
        );


    const existing =
        await db
            .from(PRODUCTS_TABLE)
            .select("id")
            .eq(
                "title",
                productData.title
            )
            .eq(
                "price",
                productData.price
            )
            .eq(
                "category",
                productData.category
            )
            .limit(1);


    if(existing.error){

        throw new Error(
            "تعذر التحقق من المنتج: " +
            existing.error.message
        );

    }


    if(
        existing.data &&
        existing.data.length > 0
    ){

        return {

            success:
                true,

            alreadyExists:
                true

        };

    }


    const result =
        await db
            .from(PRODUCTS_TABLE)
            .insert(
                productData
            );


    if(result.error){

        console.error(
            "PRODUCT INSERT ERROR:",
            result.error
        );


        throw new Error(
            "تعذر نشر السلعة في products: " +
            result.error.message
        );

    }


    return {

        success:
            true,

        alreadyExists:
            false

    };

}


/* =========================================================
   تحميل كل الطلبات
========================================================= */

async function loadAll(){

    const container =
        document.getElementById(
            "ordersContainer"
        );


    const connection =
        document.getElementById(
            "connectionStatus"
        );


    const refresh =
        document.getElementById(
            "refreshButton"
        );


    refresh.disabled =
        true;


    refresh.textContent =
        "⏳ جاري التحديث...";


    container.innerHTML =
        `
        <div class="loading">
            جاري تحميل الطلبات...
        </div>
        `;


    try{

        const buyers =
            await loadBuyerOrders();


        const sellers =
            await loadSellerOrders();


        allOrders = [

            ...buyers,

            ...sellers

        ];


        allOrders.sort(
            function(a,b){

                return (
                    new Date(
                        b.created || 0
                    )
                    -
                    new Date(
                        a.created || 0
                    )
                );

            }
        );


        updateStats();

        render();


        connection.textContent =
            "✓ متصل — تم تحميل بيانات المشترين والبائعين";

    }
    catch(error){

        console.error(
            "ADMIN ERROR:",
            error
        );


        container.innerHTML =
            `
            <div class="error">

                <strong>
                    تعذر تحميل الطلبات
                </strong>

                ${safe(
                    error.message
                )}

            </div>
            `;


        connection.textContent =
            "حدث خطأ في الاتصال";

    }
    finally{

        refresh.disabled =
            false;


        refresh.textContent =
            "🔄 تحديث الطلبات";

    }

}


/* =========================================================
   الإحصائيات
========================================================= */

function updateStats(){

    const buyers =
        allOrders.filter(
            order =>
                order.type ===
                "buyer"
        );


    const sellers =
        allOrders.filter(
            order =>
                order.type ===
                "seller"
        );


    const pending =
        allOrders.filter(
            order => {

                const status =
                    clean(
                        order.status
                    ).toLowerCase();


                return ![

                    "approved",

                    "accepted",

                    "confirmed",

                    "مقبول"

                ].includes(
                    status
                );

            }
        );


    document.getElementById(
        "totalOrders"
    ).textContent =
        allOrders.length;


    document.getElementById(
        "buyerOrders"
    ).textContent =
        buyers.length;


    document.getElementById(
        "sellerOrders"
    ).textContent =
        sellers.length;


    document.getElementById(
        "pendingOrders"
    ).textContent =
        pending.length;

}


/* =========================================================
   العرض
========================================================= */

function render(){

    const container =
        document.getElementById(
            "ordersContainer"
        );


    let list =
        allOrders;


    if(
        currentView ===
        "buyer"
    ){

        list =
            allOrders.filter(
                order =>
                    order.type ===
                    "buyer"
            );

    }


    if(
        currentView ===
        "seller"
    ){

        list =
            allOrders.filter(
                order =>
                    order.type ===
                    "seller"
            );

    }


    if(
        list.length === 0
    ){

        container.innerHTML =
            `
            <div class="empty">
                لا توجد طلبات في هذا القسم.
            </div>
            `;

        return;

    }


    container.innerHTML =
        list
        .map(
            createCard
        )
        .join("");

}

/* =========================================================
   حذف الطلب
========================================================= */

async function deleteOrder(
    id,
    type
){

    if(!id){

        alert(
            "رقم الطلب غير موجود."
        );

        return;

    }


    const isBuyer =
        type ===
        "buyer";


    const table =
        isBuyer
        ? BUYER_TABLE
        : SELLER_TABLE;


    const confirmed =
        confirm(
            isBuyer
            ?
            "⚠️ هل أنت متأكد من حذف طلب المشتري نهائيًا؟\n\nلا يمكن التراجع عن الحذف."
            :
            "⚠️ هل أنت متأكد من حذف طلب البائع نهائيًا؟\n\nلا يمكن التراجع عن الحذف."
        );


    if(!confirmed){

        return;

    }


    try{

        const result =
            await db
                .from(table)
                .delete()
                .eq(
                    "id",
                    id
                )
                .select("id");


        if(result.error){

            throw new Error(
                result.error.message
            );

        }


        if(
            !result.data ||
            result.data.length === 0
        ){

            throw new Error(
                isBuyer
                ?
                "لم يتم حذف المشتري فعليًا. تحقق من صلاحية DELETE في جدول orders."
                :
                "لم يتم حذف البائع فعليًا. تحقق من صلاحية DELETE في جدول seller_requests."
            );

        }


        allOrders =
            allOrders.filter(
                function(order){

                    return !(
                        String(
                            order.id
                        ) ===
                        String(id)
                        &&
                        order.type ===
                        type
                    );

                }
            );


        updateStats();

        render();


        alert(
            isBuyer
            ?
            "✓ تم حذف المشتري بنجاح."
            :
            "✓ تم حذف البائع بنجاح."
        );

    }
    catch(error){

        console.error(
            "DELETE ERROR:",
            error
        );


        alert(
            "❌ لم يتم الحذف.\n\n" +
            error.message
        );

    }

}


/* =========================================================
   تغيير حالة الطلب
========================================================= */

async function changeStatus(
    id,
    type,
    status
){

    if(!id){

        alert(
            "رقم الطلب غير موجود."
        );

        return;

    }


    /* -----------------------------------------
       طلب المشتري
    ----------------------------------------- */

    if(
        type ===
        "buyer"
    ){

        const result =
            await db
                .from(BUYER_TABLE)
                .update({

                    status:
                        status

                })
                .eq(
                    "id",
                    id
                );


        if(result.error){

            alert(
                "تعذر تحديث حالة طلب المشتري:\n\n" +
                result.error.message
            );

            return;

        }


        await loadAll();

        return;

    }


    /* -----------------------------------------
       طلب البائع
    ----------------------------------------- */

    const sellerResult =
        await db
            .from(SELLER_TABLE)
            .select("*")
            .eq(
                "id",
                id
            )
            .single();


    if(
        sellerResult.error
    ){

        alert(
            "تعذر قراءة بيانات السلعة:\n\n" +
            sellerResult.error.message
        );

        return;

    }


    const seller =
        sellerResult.data;


    /* -----------------------------------------
       قبول السلعة
    ----------------------------------------- */

    if(
        status ===
        "approved"
    ){

        try{

            const publishResult =
                await publishSellerProduct(
                    mapSeller(
                        seller
                    )
                );


            const updateResult =
                await db
                    .from(SELLER_TABLE)
                    .update({

                        status:
                            "approved"

                    })
                    .eq(
                        "id",
                        id
                    );


            if(
                updateResult.error
            ){

                throw new Error(
                    "تم نشر السلعة ولكن تعذر تحديث حالة البائع: " +
                    updateResult.error.message
                );

            }


            if(
                publishResult.alreadyExists
            ){

                alert(
                    "✓ السلعة موجودة مسبقًا في المنتجات، وتم قبول طلب البائع."
                );

            }
            else{

                alert(
                    "✓ تم قبول السلعة ونشرها في المنتجات بنجاح."
                );

            }


            await loadAll();

        }
        catch(error){

            console.error(
                "PUBLISH ERROR:",
                error
            );


            alert(
                "❌ لم يتم قبول السلعة:\n\n" +
                error.message
            );

        }


        return;

    }


    /* -----------------------------------------
       قيد الانتظار
    ----------------------------------------- */

    const result =
        await db
            .from(SELLER_TABLE)
            .update({

                status:
                    status

            })
            .eq(
                "id",
                id
            );


    if(result.error){

        alert(
            "تعذر تحديث حالة طلب البائع:\n\n" +
            result.error.message
        );

        return;

    }


    await loadAll();

}


/* =========================================================
   نافذة الصور
========================================================= */

function openImageModal(
    url
){

    const modal =
        document.getElementById(
            "imageModal"
        );


    const image =
        document.getElementById(
            "modalImage"
        );


    image.src =
        url;


    modal.classList.add(
        "open"
    );

}


function closeImageModal(){

    const modal =
        document.getElementById(
            "imageModal"
        );


    const image =
        document.getElementById(
            "modalImage"
        );


    modal.classList.remove(
        "open"
    );


    image.src =
        "";

}


document
    .getElementById(
        "closeModal"
    )
    .addEventListener(
        "click",
        closeImageModal
    );


document
    .getElementById(
        "imageModal"
    )
    .addEventListener(
        "click",
        function(event){

            if(
                event.target ===
                this
            ){

                closeImageModal();

            }

        }
    );


document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key ===
            "Escape"
        ){

            closeImageModal();

        }

    }
);
