<script>

/* =====================================================

const SUPABASE_URL =
    "https://gyyyzavjzvcxzgrtukqu.supabase.co";

const SUPABASE_KEY =

   العناصر
===================================================== */

const ordersContainer =

let orders = [];

let sellerCache = new Map();


/* =====================================================
   حماية النصوص
===================================================== */

function escapeHtml(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


/* =====================================================
   المال
===================================================== */

function money(value) {

    const number =
        Number(value || 0);

    return number.toLocaleString(
        "ar-SA",
        {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        }
    ) + " ريال";

}


/* =====================================================
   التاريخ
===================================================== */

function dateText(value) {

    if (!value) {
        return "—";
    }

    const date =
        new Date(value);

    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return "—";

    }

    return date.toLocaleString(
        "ar-SA"
    );

}


/* =====================================================
   اسم الحالة
===================================================== */

function statusText(status) {

    const map = {

        pending:
            "جديد",

        processing:
            "قيد التجهيز",

        shipped:
            "تم الشحن",

        delivered:
            "تم التسليم",

        confirmed:
            "أكد المشتري الاستلام",

        completed:
            "مكتمل / تمت التسوية",

        cancelled:
            "ملغى"

    };

    return map[status] || "جديد";

}


/* =====================================================
   دورة الطلب
   المراحل أصبحت أزرارًا
===================================================== */

const workflowStatuses = [

    "pending",
    "processing",
    "shipped",
    "delivered",
    "confirmed",
    "completed"

];


function getNextWorkflowStatus(status) {

    const index =
        workflowStatuses.indexOf(
            status
        );

    if (
        index === -1 ||
        index >= workflowStatuses.length - 1
    ) {

        return null;

    }

    return workflowStatuses[
        index + 1
    ];

}


function workflowHtml(order) {

    const status =
        order.status || "pending";


    const currentIndex =
        workflowStatuses.indexOf(
            status
        );


    const nextStatus =
        getNextWorkflowStatus(
            status
        );


    return `

        <div class="workflow">

            <div class="workflow-title">
                🔄 دورة الطلب
            </div>


            <div class="workflow-steps">

                ${
                    workflowStatuses
                        .map(
                            (
                                step,
                                index
                            ) => {

                                const isCurrent =
                                    index === currentIndex;


                                const isPrevious =
                                    currentIndex >= 0 &&
                                    index < currentIndex;


                                const isNext =
                                    nextStatus === step;


                                /*
                                 * مرحلة أكد المشتري:
                                 * لا يمكن للإدارة تفعيلها،
                                 * لأنها تأتي من صفحة المشتري.
                                 */

                                const waitingForBuyer =
                                    step === "confirmed" &&
                                    status === "delivered";


                                /*
                                 * مرحلة مكتمل:
                                 * عند confirmed تصبح قابلة للضغط
                                 * لأنها مرتبطة بتسوية البائع.
                                 */

                                const isSettleStep =
                                    step === "completed" &&
                                    status === "confirmed";


                                let className =
                                    "workflow-step";


                                let disabled =
                                    true;


                                let attributes =
                                    "";


                                if (isCurrent) {

                                    className +=
                                        " current-step";

                                }
                                else if (
                                    isPrevious
                                ) {

                                    className +=
                                        " completed-step";

                                }


                                if (
                                    waitingForBuyer
                                ) {

                                    className +=
                                        " waiting-step";

                                }


                                if (
                                    isNext &&
                                    step !== "confirmed"
                                ) {

                                    className +=
                                        " next-step";

                                    disabled =
                                        false;

                                    attributes +=
                                        `data-workflow-status="${step}"`;

                                }


                                if (
                                    isSettleStep
                                ) {

                                    className +=
                                        " settle-step";

                                    disabled =
                                        false;

                                    attributes +=
                                        `data-workflow-settle="true"`;

                                }


                                if (
                                    disabled
                                ) {

                                    attributes +=
                                        "disabled";

                                }


                                return `

                                    <button
                                        type="button"
                                        class="${className}"
                                        ${attributes}
                                    >

                                        ${
                                            step === "confirmed" &&
                                            status === "delivered"

                                                ? "⏳ أكد المشتري الاستلام"

                                                : step === "completed" &&
                                                  status === "confirmed"

                                                    ? "💸 مكتمل / تمت التسوية"

                                                    : statusText(step)
                                        }

                                    </button>

                                `;

                            }
                        )
                        .join("")
                }

            </div>


            ${
                status === "delivered"

                    ?

                    `

                        <div class="workflow-note">

                            📬 تم تسليم الطلب للمشتري.

                            <br>

                            بانتظار أن يؤكد المشتري الاستلام من صفحة متابعة الطلب.

                        </div>

                    `

                    :

                    status === "confirmed"

                        ?

                        `

                            <div
                                class="workflow-note"
                                style="
                                    background:#dcfce7;
                                    color:#166534;
                                "
                            >

                                ✅ أكد المشتري الاستلام.

                                <br>

                                يمكنك الآن تنفيذ تسوية مستحق البائع.

                            </div>

                        `

                        :

                        ""

            }


            <!-- زر حذف الطلب - لم يتغير -->

            <button
                type="button"
                class="delete-order-button"
                data-delete-id="${escapeHtml(order.id)}"
            >

                🗑️ حذف الطلب

            </button>

        </div>

    `;

}


/* =====================================================
   قراءة items
===================================================== */

function normalizeItems(value) {

    if (Array.isArray(value)) {
        return value;
    }


    if (typeof value === "string") {

        try {

            const parsed =
                JSON.parse(value);

            return Array.isArray(parsed)
                ? parsed
                : [];

        }
        catch {

            return [];

        }

    }


    return [];

}


/* =====================================================
   جلب البائعين المرتبطين بالطلب
===================================================== */

async function loadSellersForOrders(
    orderList
) {

    const sellerIds =
        [
            ...new Set(
                orderList
                    .flatMap(
                        order =>
                            normalizeItems(
                                order.items
                            )
                    )
                    .map(
                        item =>
                            item.seller_request_id ||
                            item.sellerRequestId ||
                            ""
                    )
                    .map(
                        value =>
                            String(
                                value
                            ).trim()
                    )
                    .filter(Boolean)
            )
        ];


    if (!sellerIds.length) {
        return;
    }


    const missing =
        sellerIds.filter(
            id =>
                !sellerCache.has(id)
        );


    if (!missing.length) {
        return;
    }


    const {
        data,
        error
    } =
        await supabaseClient
            .from("seller_requests")
            .select(
                "id,seller_name,phone,city,commission,price,product_name"
            )
            .in(
                "id",
                missing
            );


    if (error) {

        console.error(
            "Seller lookup error:",
            error
        );

        return;

    }


    (data || []).forEach(
        seller => {

            sellerCache.set(
                String(
                    seller.id
                ),
                seller
            );

        }
    );

}


/* =====================================================
   حساب مستحقات البائع
===================================================== */

function buildSellerSummary(
    items
) {

    const sellers = [];


    items.forEach(
        item => {

            const sellerRequestId =
                String(
                    item.seller_request_id ||
                    item.sellerRequestId ||
                    ""
                ).trim();


            if (!sellerRequestId) {
                return;
            }


            const existing =
                sellers.find(
                    seller =>
                        seller.id ===
                        sellerRequestId
                );


            const subtotal =
                Number(
                    item.subtotal
                ) ||
                (
                    Number(item.price) || 0
                ) *
                (
                    Number(item.quantity) || 1
                );


            if (existing) {

                existing.amount +=
                    subtotal;

                return;

            }


            const seller =
                sellerCache.get(
                    sellerRequestId
                );


            sellers.push({

                id:
                    sellerRequestId,

                name:
                    seller?.seller_name ||
                    item.seller_name ||
                    "بائع غير معروف",

                phone:
                    seller?.phone ||
                    "",

                city:
                    seller?.city ||
                    "",

                amount:
                    subtotal

            });

        }
    );


    return sellers;

}

/* =====================================================
   المنتجات
===================================================== */

function itemsHtml(
    items
) {

    if (!items.length) {

        return `

            <div class="empty">
                لا توجد تفاصيل للمنتجات.
            </div>

        `;

    }


    return items.map(
        item => {

            const title =
                item.title ||
                item.name ||
                item.product_name ||
                "منتج";


            const quantity =
                Math.max(
                    1,
                    Number(
                        item.quantity
                    ) || 1
                );


            const price =
                Number(
                    item.price
                ) || 0;


            const subtotal =
                Number(
                    item.subtotal
                ) ||
                price * quantity;


            const image =
                item.image ||
                item.image_url ||
                "";


            const imageHtml =
                image

                ?

                `

                    <img
                        class="item-image"
                        src="${escapeHtml(image)}"
                        alt="${escapeHtml(title)}"
                        loading="lazy"
                        onerror="this.style.display='none'"
                    >

                `

                :

                `

                    <div
                        class="item-image"
                        style="
                            display:flex;
                            align-items:center;
                            justify-content:center;
                            font-size:34px;
                        "
                    >
                        📦
                    </div>

                `;


            const sellerRequestId =
                item.seller_request_id ||
                item.sellerRequestId ||
                "";


            const seller =
                sellerRequestId
                    ? sellerCache.get(
                        String(
                            sellerRequestId
                        )
                    )
                    : null;


            const sellerName =
                seller?.seller_name ||
                item.seller_name ||
                "غير محدد";


            return `

                <div class="item">

                    <div class="item-grid">

                        <div>
                            ${imageHtml}
                        </div>


                        <div>

                            <div class="item-title">

                                ${escapeHtml(
                                    title
                                )}

                            </div>


                            <div class="item-extra">

                                🔢 الكمية:
                                <strong>
                                    ${quantity}
                                </strong>

                                <br>

                                💰 سعر الوحدة:
                                <strong>
                                    ${money(price)}
                                </strong>

                                <br>

                                🧾 إجمالي السلعة:
                                <strong>
                                    ${money(subtotal)}
                                </strong>

                            </div>


                            <div class="seller-box">

                                <div class="seller-title">

                                    🏪 البائع

                                </div>


                                <div class="seller-details">

                                    ${escapeHtml(
                                        sellerName
                                    )}

                                    ${
                                        seller?.phone
                                            ? `
                                                <br>
                                                📱 ${escapeHtml(
                                                    seller.phone
                                                )}
                                              `
                                            : ""
                                    }

                                </div>

                            </div>

                        </div>

                    </div>

                </div>

            `;

        }
    ).join("");

}


/* =====================================================

function actionHtml(order) {

        return `

                </div>

                </span>

                    type="button"
                    class="action-button"

        `;

    if (status === "processing") {

            <div class="action-box">

                <span class="action-label">
                    الخطوة التالية:
                </span>

                <button
                    type="button"
                    class="action-button"
                    data-next-status="shipped"
                    data-order-id="${escapeHtml(order.id)}"
                >
                    📦 تم تجهيز الطلب — تسجيل الشحن
                </button>

            </div>

        `;

    }


    if (status === "shipped") {

        return `

            <div class="action-box">

                <span class="action-label">
                    الخطوة التالية:
                </span>

                <button
                    type="button"
                    class="action-button"
                    data-next-status="delivered"
                    data-order-id="${escapeHtml(order.id)}"
                >

    if (status === "delivered") {

                    background:#fff7ed;
                    color:#9a3412;

                </div>

            </div>

        `;

    }


    if (status === "confirmed") {

        const hasSeller =
            sellerSummary.length > 0;


        if (!hasSeller) {

            return `

                <div class="action-box">

                    <div class="blocked-box">

                        ⚠️ لا يمكن تسوية الطلب.

                        <br>

                        لا يوجد بائع مرتبط بالسلعة.

                    </div>

                </div>

            `;

        }


        const totalDue =
            sellerSummary.reduce(
                (
                    sum,
                    seller
                ) =>

                    ),

            );


        if (
            order.seller_paid === true
        ) {

                </div>


                <div class="settlement-amount">

        `;

    }


    if (status === "completed") {

        return `

            <div class="success-box">

                ✅ اكتملت دورة الطلب وتمت التسوية.

            </div>

        `;

    }


    return "";

/* =====================================================
   تحميل الطلبات
===================================================== */

async function loadOrders() {

    ordersContainer.innerHTML = `

        <div class="loading">

            ⏳ جاري تحميل الطلبات...

        </div>

    `;


    const {
        data,
        error
    } =
        await supabaseClient
            .from("orders")
            .select("*")
            .order(
                "created_at",
                {
                    ascending: false
                }
            );


    if (error) {

        console.error(
            "Orders error:",
            error
        );


        ordersContainer.innerHTML = `

            <div class="empty">

                ❌ تعذر تحميل الطلبات.

                <br><br>

                ${escapeHtml(
                    error.message
                )}

            </div>

        `;

        return;

    }


    orders =
        Array.isArray(data)
            ? data
            : [];


    await loadSellersForOrders(
        orders
    );


    updateStats();

    renderOrders();

}


/* =====================================================
   الإحصائيات
===================================================== */

function updateStats() {

    totalOrders.textContent =
        orders.length;


    pendingOrders.textContent =
        orders.filter(
            order =>
                (
                    order.status ||
                    "pending"
                ) === "pending"
        ).length;


    activeOrders.textContent =
        orders.filter(
            order =>
                [
                    "processing",
                    "shipped",
                    "delivered",
                    "confirmed"
                ].includes(
                    order.status
                )
        ).length;


    issueOrders.textContent =
        orders.filter(
            order =>
                order.issue_reported === true
        ).length;


    dueOrders.textContent =
        orders.filter(
            order =>
                order.status === "confirmed" &&
                order.seller_paid !== true &&
                order.issue_reported !== true
        ).length;

}


/* =====================================================
   فلترة الطلبات
===================================================== */

function getFilteredOrders() {

    const selected =
        filterStatus.value;


    if (
        selected === "all"
    ) {

        return orders;

    }


    if (
        selected === "issues"
    ) {

        return orders.filter(
            order =>
                order.issue_reported === true
        );

    }


    if (
        selected === "due"
    ) {

        return orders.filter(
            order =>
                order.status === "confirmed" &&
                order.seller_paid !== true &&
                order.issue_reported !== true
        );

    }


    return orders.filter(
        order =>
            (
                order.status ||
                "pending"
            ) === selected
    );

}

/* =====================================================
   تحديث حالة الطلب
===================================================== */

async function updateOrderStatus(
    orderId,
    newStatus,
    button
) {

    if (!orderId || !newStatus) {
        return;
    }


    button.disabled =
        true;


    const originalText =
        button.textContent;


    button.textContent =
        "⏳ جاري الحفظ...";


    const {
        error
    } =
        await supabaseClient
            .from("orders")
            .update({

                status:
                    newStatus,

                updated_at:
                    new Date().toISOString()

            })
            .eq(
                "id",
                orderId
            );


    if (error) {

        console.error(
            "Status update error:",
            error
        );


        showMessage(
            "❌ تعذر تحديث حالة الطلب."
        );


        button.disabled =
            false;


        button.textContent =
            originalText;


        return;

    }


    showMessage(
        "✅ تم انتقال الطلب إلى: " +
        statusText(
            newStatus
        )
    );


    await loadOrders();

}

    } =
        await supabaseClient
            .from("orders")
            .delete()
            .eq(
                "id",
                orderId
            );


    if (error) {

        console.error(
            "Delete order error:",
            error
        );


        showMessage(
            "❌ تعذر حذف الطلب: " +
            error.message
        );


        button.disabled =
            false;


        button.textContent =
            "🗑️ حذف الطلب";


        return;

    }


    showMessage(
        "✅ تم حذف الطلب بنجاح."
    );


    await loadOrders();

}


/* =====================================================
   تسوية مستحق البائع
===================================================== */

async function settleSeller(
    orderId,
    button
) {

    const order =
        orders.find(
            item =>
                String(
                    item.id
                ) ===
                String(
                    orderId
                )
        );


    if (!order) {

        showMessage(
            "❌ لم يتم العثور على الطلب."
        );

        return;

    }


    if (
        order.status !== "confirmed"
    ) {

        showMessage(
            "❌ لا يمكن التسوية قبل تأكيد المشتري."
        );

        return;

    }


    if (
        order.issue_reported === true
    ) {

        showMessage(
            "❌ لا يمكن التسوية مع وجود اعتراض."
        );

        return;

    }


    if (
        order.seller_paid === true
    ) {

        return;

    }


    const items =
        normalizeItems(
            order.items
        );


    const sellerSummary =
        buildSellerSummary(
            items
        );


    if (!sellerSummary.length) {

        showMessage(
            "❌ لا يوجد بائع مرتبط بهذا الطلب."
        );

        return;

    }


    const totalDue =
        sellerSummary.reduce(
            (
                sum,
                seller
            ) =>
                sum +
                Number(
                    seller.amount || 0
                ),
            0
        );


    const confirmed =
        window.confirm(

            "هل نفذت التحويل للبائع؟\n\n" +

            "إجمالي المستحق: " +
            money(
                totalDue
            )

        );


    if (!confirmed) {

        return;

    }


    button.disabled =
        true;


    button.textContent =
        "⏳ جاري تسجيل التسوية...";


    const {
        error
    } =
        await supabaseClient
            .from("orders")
            .update({

                seller_paid:
                    true,

                seller_paid_at:
                    new Date().toISOString(),

                status:
                    "completed",

                updated_at:
                    new Date().toISOString()

            })
            .eq(
                "id",
                orderId
            )
            .eq(
                "status",
                "confirmed"
            )
            .eq(
                "issue_reported",
                false
            );


    if (error) {

        console.error(
            "Settlement error:",
            error
        );


        showMessage(
            "❌ تعذر تسجيل التسوية."
        );


        button.disabled =
            false;


        button.textContent =
            "💸 تم تحويل مستحق البائع";


        return;

    }


    showMessage(
        "✅ تم تسجيل تسوية مستحق البائع."
    );


    await loadOrders();

}


/* =====================================================
   إلغاء الطلب
===================================================== */

async function cancelOrder(
    orderId,
    button
) {

    const confirmed =
        window.confirm(
            "هل تريد إلغاء هذا الطلب؟"
        );


    if (!confirmed) {
        return;
    }


    button.disabled =
        true;


    button.textContent =
        "⏳ جاري الإلغاء...";


    await updateOrderStatus(
        orderId,
        "cancelled",
        button
    );

}


/* =====================================================
   ربط أزرار دورة الطلب والأزرار الأخرى
===================================================== */

function bindActionButtons() {

    /*
     * أزرار الانتقال القديمة أسفل البطاقة
     */

    document
        .querySelectorAll(
            ".action-button"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    () => {

                        updateOrderStatus(
                            button.dataset.orderId,
                            button.dataset.nextStatus,
                            button
                        );

                    }
                );

            }
        );


    /*
     * إلغاء الطلب
     */

    document
        .querySelectorAll(
            ".secondary-button"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    () => {

                        cancelOrder(
                            button.dataset.cancelId,
                            button
                        );

                    }
                );

            }
        );


    /*
     * تسوية مستحق البائع
     */

    document
        .querySelectorAll(
            ".settlement-button"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    () => {

                        settleSeller(
                            button.dataset.settleId,
                            button
                        );

                    }
                );

            }
        );


    /*
     * حذف الطلب
     */

    document
        .querySelectorAll(
            ".delete-order-button"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    () => {

                        deleteOrder(
                            button.dataset.deleteId,
                            button
                        );

                    }
                );

            }
        );


    /*
     * أزرار دورة الطلب نفسها
     */

    document
        .querySelectorAll(
            ".workflow-step.next-step"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    () => {

                        const order =
                            findOrderFromWorkflowButton(
                                button
                            );


                        if (!order) {

                            showMessage(
                                "❌ تعذر العثور على الطلب."
                            );

                            return;

                        }


                        const nextStatus =
                            button.dataset.workflowStatus;


                        updateOrderStatus(
                            order.id,
                            nextStatus,
                            button
                        );

                    }
                );

            }
        );


    /*
     * زر مكتمل / تمت التسوية داخل الدورة
     */

    document
        .querySelectorAll(
            ".workflow-step.settle-step"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    () => {

                        const order =
                            findOrderFromWorkflowButton(
                                button
                            );


                        if (!order) {

                            showMessage(
                                "❌ تعذر العثور على الطلب."
                            );

                            return;

                        }


                        settleSeller(
                            order.id,
                            button
                        );

                    }
                );

            }
        );

}


/* =====================================================
   العثور على الطلب من زر الدورة
===================================================== */

function findOrderFromWorkflowButton(
    button
) {

    const workflow =
        button.closest(
            ".workflow"
        );


    if (!workflow) {

        return null;

    }


    const deleteButton =
        workflow.querySelector(
            ".delete-order-button"
        );


    if (!deleteButton) {

        return null;

    }


    const orderId =
        deleteButton.dataset.deleteId;


    return orders.find(
        order =>
            String(
                order.id
            ) ===
            String(
                orderId
            )
    ) || null;

}


/* =====================================================
   الرسالة
===================================================== */

function showMessage(text) {

    message.textContent =
        text;


    message.classList.add(
        "show"
    );


    clearTimeout(
        showMessage.timer
    );


    showMessage.timer =
        setTimeout(
            () => {

                message.classList.remove(
                    "show"
                );

            },
            3000
        );

}


/* =====================================================
   الأحداث
===================================================== */

filterStatus.addEventListener(
    "change",
    renderOrders
);


refreshButton.addEventListener(
    "click",
    loadOrders
);


/* =====================================================
   التشغيل
===================================================== */

loadOrders();

</script>
