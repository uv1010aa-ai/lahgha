<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>طلبات المشترين | لَحْقها</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Tahoma, Arial, sans-serif;
            background: #f5f7fa;
            color: #172033;
            line-height: 1.7;
        }

        button,
        select,
        input,
        textarea {
            font-family: inherit;
        }

        header {
            background: #1e3a5f;
            color: #fff;
            text-align: center;
            padding: 25px 15px;
        }

        header h1 {
            margin: 0 0 7px;
        }

        header p {
            margin: 0;
            opacity: .9;
        }

        main {
            width: min(1250px, 94%);
            margin: 25px auto 60px;
        }

        .top-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .top-button {
            display: inline-block;
            border: 0;
            padding: 12px 18px;
            border-radius: 10px;
            background: #fff;
            color: #1e3a5f;
            text-decoration: none;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 3px 12px rgba(0,0,0,.06);
        }

        .top-button:hover {
            background: #eef3f8;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat {
            background: #fff;
            border-radius: 16px;
            padding: 18px;
            text-align: center;
            box-shadow: 0 4px 16px rgba(0,0,0,.06);
        }

        .stat-title {
            color: #64748b;
            font-size: 13px;
            margin-bottom: 5px;
        }

        .stat-number {
            font-size: 28px;
            font-weight: 900;
            color: #1e3a5f;
        }

        .stat.warning .stat-number {
            color: #c2410c;
        }

        .stat.success .stat-number {
            color: #166534;
        }

        .orders-box {
            background: #fff;
            border-radius: 18px;
            padding: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,.06);
        }

        .orders-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .orders-header h2 {
            margin: 0;
            color: #1e3a5f;
        }

        .filter {
            padding: 11px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            background: #fff;
            min-width: 210px;
        }

        .order {
            border: 1px solid #e2e8f0;
            border-radius: 17px;
            padding: 18px;
            margin-bottom: 16px;
            background: #fff;
        }

        .order:last-child {
            margin-bottom: 0;
        }

        .order-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            border-bottom: 1px solid #edf1f5;
            padding-bottom: 13px;
            margin-bottom: 15px;
        }

        .order-number {
            font-size: 18px;
            font-weight: 900;
            color: #1e3a5f;
        }

        .order-date {
            margin-top: 4px;
            color: #64748b;
            font-size: 13px;
        }

        .status {
            display: inline-block;
            padding: 7px 13px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 900;
        }

        .status.pending {
            background: #fff7ed;
            color: #c2410c;
        }

        .status.processing {
            background: #eff6ff;
            color: #1d4ed8;
        }

        .status.shipped {
            background: #f5f3ff;
            color: #6d28d9;
        }

        .status.delivered {
            background: #ecfdf5;
            color: #047857;
        }

        .status.confirmed {
            background: #dcfce7;
            color: #166534;
        }

        .status.completed {
            background: #dcfce7;
            color: #166534;
        }

        .status.cancelled {
            background: #fee2e2;
            color: #991b1b;
        }

        .buyer-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 10px;
        }

        .info {
            background: #f8fafc;
            border-radius: 11px;
            padding: 13px;
        }

        .info strong {
            display: block;
            color: #1e3a5f;
            margin-bottom: 5px;
        }

        .address-box {
            margin-bottom: 15px;
        }

        .section-title {
            margin: 18px 0 10px;
            color: #1e3a5f;
            font-size: 17px;
        }

        .items {
            display: grid;
            gap: 10px;
        }

        .item {
            background: #f8fafc;
            border: 1px solid #e5eaf0;
            border-radius: 12px;
            padding: 13px;
        }

        .item-grid {
            display: grid;
            grid-template-columns: 85px 1fr;
            gap: 13px;
            align-items: center;
        }

        .item-image {
            width: 85px;
            height: 85px;
            object-fit: cover;
            border-radius: 10px;
            background: #e5e7eb;
            display: block;
        }

        .item-title {
            font-weight: 900;
            color: #1e3a5f;
            margin-bottom: 6px;
        }

        .item-extra {
            color: #64748b;
            font-size: 13px;
            line-height: 1.9;
        }

        .seller-box {
            margin-top: 11px;
            padding: 12px;
            background: #fffaf0;
            border: 1px solid #f1d7a8;
            border-radius: 10px;
        }

        .seller-title {
            color: #8b5517;
            font-weight: 900;
            margin-bottom: 5px;
        }

        .seller-details {
            color: #5f4a2b;
            font-size: 13px;
        }

        .seller-missing {
            color: #991b1b;
            font-weight: 900;
        }

        .money-row {
            margin-top: 12px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .money-box {
            background: #eef7ef;
            border-radius: 11px;
            padding: 13px;
        }

        .money-box.warning {
            background: #fff7ed;
        }

        .money-box strong {
            display: block;
            margin-bottom: 5px;
        }

        .total {
            margin-top: 15px;
            padding: 15px;
            border-radius: 11px;
            background: #eef7ef;
            color: #166534;
            font-size: 19px;
            font-weight: 900;
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .payment-box {
            margin-top: 15px;
            padding: 14px;
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 11px;
        }

        .payment-title {
            color: #1e3a8a;
            font-weight: 900;
            margin-bottom: 5px;
        }

        .payment-note {
            color: #1d4ed8;
            font-size: 13px;
        }

        /* =====================================================
           دورة الطلب
        ===================================================== */

        .workflow {
            margin-top: 18px;
            padding: 15px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
        }

        .workflow-title {
            color: #1e3a5f;
            font-weight: 900;
            margin-bottom: 12px;
        }

        .workflow-steps {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
        }

        /*
         * كل المراحل أزرار حقيقية وقابلة للضغط
         */

        .workflow-step {
            border: 2px solid transparent;
            padding: 11px 8px;
            border-radius: 10px;
            background: #e2e8f0;
            color: #64748b;
            font-size: 12px;
            font-weight: 900;
            text-align: center;
            min-height: 58px;
            cursor: pointer;
            transition: .2s;
        }

        .workflow-step:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0,0,0,.10);
        }

        /*
         * مرحلة سابقة
         */

        .workflow-step.completed-step {
            background: #dbeafe;
            color: #1d4ed8;
            border-color: #bfdbfe;
        }

        /*
         * المرحلة الحالية
         */

        .workflow-step.current-step {
            background: #1e3a5f;
            color: #fff;
            border-color: #1e3a5f;
            box-shadow: 0 4px 12px rgba(30,58,95,.20);
        }

        /*
         * مرحلة مستقبلية قابلة للضغط
         */

        .workflow-step.clickable-step {
            background: #166534;
            color: #fff;
            border-color: #166534;
        }

        .workflow-step.clickable-step:hover {
            background: #15803d;
        }

        /*
         * مرحلة التسوية
         */

        .workflow-step.settle-step {
            background: #b45309;
            color: #fff;
            border-color: #b45309;
        }

        .workflow-step.settle-step:hover {
            background: #92400e;
        }

        .workflow-step:disabled {
            opacity: .6;
            cursor: wait;
            transform: none;
        }

        .workflow-note {
            margin-top: 10px;
            padding: 10px;
            border-radius: 9px;
            background: #fff7ed;
            color: #9a3412;
            font-size: 13px;
            font-weight: 900;
            text-align: center;
        }

        .issue-box {
            margin-top: 15px;
            padding: 15px;
            background: #fff7ed;
            border: 1px solid #fdba74;
            border-radius: 11px;
        }

        .issue-title {
            color: #9a3412;
            font-weight: 900;
            margin-bottom: 6px;
        }

        .issue-details {
            color: #7c2d12;
            white-space: pre-wrap;
        }

        .blocked-box {
            margin-top: 15px;
            padding: 14px;
            background: #fee2e2;
            color: #991b1b;
            border-radius: 11px;
            font-weight: 900;
            text-align: center;
        }

        .success-box {
            margin-top: 15px;
            padding: 14px;
            background: #dcfce7;
            color: #166534;
            border-radius: 11px;
            font-weight: 900;
            text-align: center;
        }

        .action-box {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #edf1f5;
        }

        .secondary-button {
            width: 100%;
            margin-top: 8px;
            border: 1px solid #fecaca;
            padding: 12px;
            border-radius: 10px;
            background: #fff;
            color: #991b1b;
            font-weight: 900;
            cursor: pointer;
        }

        .settlement-box {
            margin-top: 15px;
            padding: 15px;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 12px;
        }

        .settlement-title {
            color: #166534;
            font-weight: 900;
            margin-bottom: 7px;
        }

        .settlement-amount {
            font-size: 22px;
            color: #166534;
            font-weight: 900;
            margin-bottom: 10px;
        }

        .settlement-button {
            width: 100%;
            border: 0;
            padding: 13px;
            border-radius: 10px;
            background: #166534;
            color: #fff;
            font-weight: 900;
            cursor: pointer;
        }

        .settlement-button:hover {
            opacity: .9;
        }

        .settlement-button:disabled {
            opacity: .6;
            cursor: wait;
        }

        .settled {
            margin-top: 12px;
            padding: 12px;
            border-radius: 10px;
            background: #dcfce7;
            color: #166534;
            font-weight: 900;
            text-align: center;
        }

        /*
         * زر حذف الطلب
         */

        .delete-order-button {
            width: 100%;
            margin-top: 14px;
            padding: 12px;
            border: 1px solid #fecaca;
            border-radius: 10px;
            background: #fff;
            color: #991b1b;
            font-weight: 900;
            cursor: pointer;
        }

        .delete-order-button:hover {
            background: #fef2f2;
        }

        .delete-order-button:disabled {
            opacity: .6;
            cursor: wait;
        }

        .empty,
        .loading {
            padding: 45px 20px;
            text-align: center;
            color: #64748b;
        }

        #message {
            position: fixed;
            right: 20px;
            bottom: 20px;
            background: #1e3a5f;
            color: #fff;
            padding: 13px 18px;
            border-radius: 10px;
            opacity: 0;
            pointer-events: none;
            transition: .3s;
            z-index: 9999;
            max-width: 90%;
        }

        #message.show {
            opacity: 1;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #64748b;
        }

        @media (max-width: 1000px) {

            .stats {
                grid-template-columns: repeat(3, 1fr);
            }

            .buyer-grid {
                grid-template-columns: 1fr 1fr;
            }

            .money-row {
                grid-template-columns: 1fr 1fr;
            }

            .workflow-steps {
                grid-template-columns: repeat(3, 1fr);
            }

        }

        @media (max-width: 700px) {

            .stats {
                grid-template-columns: 1fr 1fr;
            }

            .buyer-grid {
                grid-template-columns: 1fr;
            }

            .money-row {
                grid-template-columns: 1fr;
            }

            .workflow-steps {
                grid-template-columns: 1fr 1fr;
            }

        }

        @media (max-width: 500px) {

            .stats {
                grid-template-columns: 1fr;
            }

            .item-grid {
                grid-template-columns: 1fr;
            }

            .item-image {
                width: 100%;
                height: 190px;
            }

            .total {
                flex-direction: column;
            }

            .workflow-steps {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


<header>

    <h1>🔐 لوحة طلبات المشترين — لَحْقها</h1>

    <p>
        إدارة الطلب من وصوله حتى الاستلام وتسوية مستحق البائع
    </p>

</header>


<main>

    <div class="top-actions">

        <a
            href="admin/index.html"
            class="top-button"
        >
            ← لوحة التحكم الرئيسية
        </a>

        <button
            type="button"
            id="refreshButton"
            class="top-button"
        >
            🔄 تحديث الطلبات
        </button>

    </div>


    <section class="stats">

        <div class="stat">
            <div class="stat-title">إجمالي الطلبات</div>
            <div id="totalOrders" class="stat-number">0</div>
        </div>

        <div class="stat warning">
            <div class="stat-title">طلبات جديدة</div>
            <div id="pendingOrders" class="stat-number">0</div>
        </div>

        <div class="stat">
            <div class="stat-title">قيد التنفيذ</div>
            <div id="activeOrders" class="stat-number">0</div>
        </div>

        <div class="stat warning">
            <div class="stat-title">اعتراضات</div>
            <div id="issueOrders" class="stat-number">0</div>
        </div>

        <div class="stat success">
            <div class="stat-title">مستحقات معلقة</div>
            <div id="dueOrders" class="stat-number">0</div>
        </div>

    </section>


    <section class="orders-box">

        <div class="orders-header">

            <h2>
                🛍️ طلبات المشترين
            </h2>

            <select
                id="filterStatus"
                class="filter"
            >

                <option value="all">
                    جميع الطلبات
                </option>

                <option value="pending">
                    جديدة
                </option>

                <option value="processing">
                    قيد التجهيز
                </option>

                <option value="shipped">
                    تم الشحن
                </option>

                <option value="delivered">
                    تم التسليم
                </option>

                <option value="confirmed">
                    أكد المشتري الاستلام
                </option>

                <option value="completed">
                    مكتملة / تمت التسوية
                </option>

                <option value="cancelled">
                    ملغاة
                </option>

                <option value="issues">
                    🔴 عليها اعتراض
                </option>

                <option value="due">
                    💰 مستحق للبائع
                </option>

            </select>

        </div>


        <div id="ordersContainer">

            <div class="loading">
                ⏳ جاري تحميل الطلبات...
            </div>

        </div>

    </section>

</main>


<footer>
    © 2026 لَحْقها 🛍️
</footer>


<div id="message"></div>


<script>

/* =====================================================
   Supabase
===================================================== */

const SUPABASE_URL =
    "https://gyyyzavjzvcxzgrtukqu.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_Rj6F5Fp2tHJSWzbRRdLVZQ_8D5wL8p-";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   العناصر
===================================================== */

const ordersContainer =
    document.getElementById("ordersContainer");

const totalOrders =
    document.getElementById("totalOrders");

const pendingOrders =
    document.getElementById("pendingOrders");

const activeOrders =
    document.getElementById("activeOrders");

const issueOrders =
    document.getElementById("issueOrders");

const dueOrders =
    document.getElementById("dueOrders");

const filterStatus =
    document.getElementById("filterStatus");

const refreshButton =
    document.getElementById("refreshButton");

const message =
    document.getElementById("message");


let orders = [];

let sellerCache = new Map();


/* =====================================================
   حماية النصوص
===================================================== */

function escapeHtml(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


/* =====================================================
   المال
===================================================== */

function money(value) {

    const number =
        Number(value || 0);

    return number.toLocaleString(
        "ar-SA",
        {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        }
    ) + " ريال";

}


/* =====================================================
   التاريخ
===================================================== */

function dateText(value) {

    if (!value) {
        return "—";
    }

    const date =
        new Date(value);

    if (Number.isNaN(date.getTime())) {
        return "—";
    }

    return date.toLocaleString("ar-SA");

}


/* =====================================================
   توحيد الحالة
===================================================== */

function normalizeStatus(value) {

    const raw =
        String(value ?? "")
            .trim()
            .toLowerCase();


    const map = {

        "pending":
            "pending",

        "جديد":
            "pending",

        "قيد الانتظار":
            "pending",

        "processing":
            "processing",

        "قيد التجهيز":
            "processing",

        "shipped":
            "shipped",

        "تم الشحن":
            "shipped",

        "delivered":
            "delivered",

        "تم التسليم":
            "delivered",

        "confirmed":
            "confirmed",

        "أكد المشتري الاستلام":
            "confirmed",

        "تأكيد الاستلام":
            "confirmed",

        "completed":
            "completed",

        "مكتمل":
            "completed",

        "مكتمل / تمت التسوية":
            "completed",

        "cancelled":
            "cancelled",

        "ملغى":
            "cancelled"

    };


    return map[raw] || "pending";

}


/* =====================================================
   اسم الحالة
===================================================== */

function statusText(status) {

    const normalized =
        normalizeStatus(status);


    const map = {

        pending:
            "جديد",

        processing:
            "قيد التجهيز",

        shipped:
            "تم الشحن",

        delivered:
            "تم التسليم",

        confirmed:
            "أكد المشتري الاستلام",

        completed:
            "مكتمل / تمت التسوية",

        cancelled:
            "ملغى"

    };


    return map[normalized] || "جديد";

}


/* =====================================================
   دورة الطلب
===================================================== */

const workflowStatuses = [

    "pending",
    "processing",
    "shipped",
    "delivered",
    "confirmed",
    "completed"

];


/* =====================================================
   HTML دورة الطلب
===================================================== */

function workflowHtml(order) {

    const status =
        normalizeStatus(order.status);


    const currentIndex =
        workflowStatuses.indexOf(status);


    return `

        <div class="workflow">

            <div class="workflow-title">

                🔄 دورة الطلب
                <span style="
                    font-size:12px;
                    color:#64748b;
                    font-weight:700;
                ">
                    — اضغط على المرحلة لتفعيلها
                </span>

            </div>


            <div class="workflow-steps">

                ${workflowStatuses.map(
                    (step, index) => {

                        const isCurrent =
                            index === currentIndex;


                        const isPrevious =
                            currentIndex >= 0 &&
                            index < currentIndex;


                        let className =
                            "workflow-step";


                        if (isCurrent) {

                            className +=
                                " current-step";

                        }
                        else if (isPrevious) {

                            className +=
                                " completed-step";

                        }
                        else {

                            className +=
                                " clickable-step";

                        }


                        if (step === "completed") {

                            className =
                                isCurrent
                                    ? "workflow-step current-step"
                                    : "workflow-step settle-step";

                        }


                        let icon = "";

                        if (step === "pending") {
                            icon = "🆕";
                        }

                        if (step === "processing") {
                            icon = "🔧";
                        }

                        if (step === "shipped") {
                            icon = "📦";
                        }

                        if (step === "delivered") {
                            icon = "🚚";
                        }

                        if (step === "confirmed") {
                            icon = "✅";
                        }

                        if (step === "completed") {
                            icon = "💸";
                        }


                        return `

                            <button
                                type="button"
                                class="${className}"
                                data-workflow-status="${step}"
                                data-order-id="${escapeHtml(order.id)}"
                                title="اضغط لتفعيل مرحلة ${escapeHtml(statusText(step))}"
                            >

                                ${icon}
                                ${escapeHtml(

/* =====================================================
   قراءة items
===================================================== */

function normalizeItems(value) {

    if (Array.isArray(value)) {
        return value;
    }


    if (typeof value === "string") {

        try {

            const parsed =
                JSON.parse(value);

            return Array.isArray(parsed)
                ? parsed
                : [];

        }
        catch {

            return [];

        }

    }


    return [];

}


/* =====================================================
   جلب البائعين
===================================================== */

async function loadSellersForOrders(orderList) {

    const sellerIds =
        [
            ...new Set(
                orderList
                    .flatMap(
                        order =>
                            normalizeItems(order.items)
                    )
                    .map(
                        item =>
                            item.seller_request_id ||
                            item.sellerRequestId ||
                            ""
                    )
                    .map(
                        value =>
                            String(value).trim()
                    )
                    .filter(Boolean)
            )
        ];


    if (!sellerIds.length) {
        return;
    }


    const missing =
        sellerIds.filter(
            id =>
                !sellerCache.has(id)
        );


    if (!missing.length) {
        return;
    }


    const {
        data,
        error
    } =
        await supabaseClient
            .from("seller_requests")
            .select(
                "id,seller_name,phone,city,commission,price,product_name"
            )
            .in(
                "id",
                missing
            );


    if (error) {

        console.error(
            "Seller lookup error:",
            error
        );

        return;

    }


    (data || []).forEach(
        seller => {

            sellerCache.set(
                String(seller.id),
                seller
            );

        }
    );

}


/* =====================================================
   حساب مستحقات البائع
===================================================== */

function buildSellerSummary(items) {

    const sellers = [];


    items.forEach(item => {

        const sellerRequestId =
            String(
                item.seller_request_id ||
                item.sellerRequestId ||
                ""
            ).trim();


        if (!sellerRequestId) {
            return;
        }


        const existing =
            sellers.find(
                seller =>
                    seller.id === sellerRequestId
            );


        const subtotal =
            Number(item.subtotal) ||
            (
                Number(item.price) || 0
            ) *
            (
                Number(item.quantity) || 1
            );


        if (existing) {

            existing.amount += subtotal;

            return;

        }


        const seller =
            sellerCache.get(
                sellerRequestId
            );


        sellers.push({

            id:
                sellerRequestId,

            name:
                seller?.seller_name ||
                item.seller_name ||
                "بائع غير معروف",

            phone:
                seller?.phone ||
                "",

            city:
                seller?.city ||
                "",

            amount:
                subtotal

        });

    });


    return sellers;

}

===================================================== */

async function loadOrders() {

    ordersContainer.innerHTML = `

        <div class="loading">
            ⏳ جاري تحميل الطلبات...
        </div>

    `;


    const {
        data,
        error
    } =
        await supabaseClient
            .from("orders")
            .select("*")
            .order(
                "created_at",
                {
                    ascending: false
                }
            );


    if (error) {

        console.error(
            "Orders error:",
            error
        );


        ordersContainer.innerHTML = `

            <div class="empty">

                ❌ تعذر تحميل الطلبات.

                <br><br>

                ${escapeHtml(error.message)}

            </div>

        `;

        return;

    }


    orders =
        Array.isArray(data)
            ? data
            : [];


    await loadSellersForOrders(orders);


    updateStats();

    renderOrders();

}


/* =====================================================
   الإحصائيات
===================================================== */

function updateStats() {

    totalOrders.textContent =
        orders.length;


    pendingOrders.textContent =
        orders.filter(
            order =>
                normalizeStatus(order.status) ===
                "pending"
        ).length;


    activeOrders.textContent =
        orders.filter(
            order =>
                [
                    "processing",
                    "shipped",
                    "delivered",
                    "confirmed"
                ].includes(
                    normalizeStatus(order.status)
                )
        ).length;


    issueOrders.textContent =
        orders.filter(
            order =>
                order.issue_reported === true
        ).length;


    dueOrders.textContent =
        orders.filter(
            order =>
                normalizeStatus(order.status) ===
                    "confirmed" &&
                order.seller_paid !== true &&
                order.issue_reported !== true
        ).length;

}


/* =====================================================
   فلترة
===================================================== */

function getFilteredOrders() {

    const selected =
        filterStatus.value;


    if (selected === "all") {
        return orders;
    }


    if (selected === "issues") {

        return orders.filter(
            order =>
                order.issue_reported === true
        );

    }


    if (selected === "due") {

        return orders.filter(
            order =>
                normalizeStatus(order.status) ===
                    "confirmed" &&
                order.seller_paid !== true &&
                order.issue_reported !== true
        );

    }


    return orders.filter(
        order =>
            normalizeStatus(order.status) ===
            selected
    );

}

/* =====================================================
   تحديث الحالة في Supabase
===================================================== */

async function updateOrderStatus(
    orderId,
    newStatus,
    button
) {

    if (!orderId || !newStatus) {
        return;
    }


    const order =
        orders.find(
            item =>
                String(item.id) ===
                String(orderId)
        );


    if (!order) {

        showMessage(
            "❌ لم يتم العثور على الطلب."
        );

        return;

    }


    const currentStatus =
        normalizeStatus(order.status);


    if (currentStatus === newStatus) {

        showMessage(
            "ℹ️ الطلب موجود بالفعل في هذه المرحلة."
        );

        return;

    }


    const originalText =
        button.textContent;


    button.disabled = true;

    button.textContent =
        "⏳ جاري الحفظ...";


    const now =
        new Date().toISOString();


    const {
        data,
        error
    } =
        await supabaseClient
            .from("orders")
            .update({

                status:
                    newStatus,

                updated_at:
                    now

            })
            .eq(
                "id",
                orderId
            )
            .select(
                "id,status"
            )
            .maybeSingle();


    if (error) {

        console.error(
            "Status update error:",
            error
        );


        showMessage(
            "❌ فشل تحديث الحالة: " +
            error.message
        );


        button.disabled = false;

        button.textContent =
            originalText;

        return;

    }


    /*
     * إذا لم يرجع Supabase صفًا،
     * فهذا يعني غالبًا أن سياسة RLS تمنع UPDATE.
     */

    if (!data) {

        console.error(
            "No row updated. Check Supabase UPDATE policy / RLS."
        );


        showMessage(
            "❌ لم يتم حفظ الحالة. تحقق من صلاحية UPDATE في Supabase."
        );


        button.disabled = false;

        button.textContent =
            originalText;

        return;

    }


    showMessage(
        "✅ تم تغيير حالة الطلب إلى: " +
        statusText(newStatus)
    );


    await loadOrders();

}


/* =====================================================
   التعامل مع الضغط على مراحل الدورة
===================================================== */

async function handleWorkflowClick(
    button
) {

    const orderId =
        button.dataset.orderId;


    const newStatus =
        button.dataset.workflowStatus;


    if (!orderId || !newStatus) {

        showMessage(
            "❌ بيانات زر المرحلة غير مكتملة."
        );

        return;

    }


    const order =
        orders.find(
            item =>
                String(item.id) ===
                String(orderId)
        );


    if (!order) {

        showMessage(
            "❌ لم يتم العثور على الطلب."
        );

        return;

    }


    const currentStatus =
        normalizeStatus(order.status);


    /*
     * الضغط على مكتمل يعني تنفيذ التسوية.
     */

    if (newStatus === "completed") {

        if (currentStatus !== "confirmed") {

            showMessage(
                "⚠️ يجب أولًا أن تكون حالة الطلب «أكد المشتري الاستلام» قبل التسوية."
            );

            return;

        }


        await settleSeller(
            orderId,
            button
        );

        return;

    }


    /*
     * بقية المراحل تحدث الحالة مباشرة.
     */

    await updateOrderStatus(
        orderId,
        newStatus,
        button
    );

}


/* =====================================================
   حذف الطلب
===================================================== */

async function deleteOrder(
    orderId,
    button
) {

    const order =
        orders.find(
            item =>
                String(item.id) ===
                String(orderId)
        );


    if (!order) {

        showMessage(
            "❌ لم يتم العثور على الطلب."
        );

        return;

    }


    const confirmed =
        window.confirm(

            "⚠️ هل أنت متأكد من حذف هذا الطلب نهائيًا؟\n\n" +

            "رقم الطلب: " +
            (
                order.order_number ||
                "بدون رقم"
            ) +

            "\n\n" +

            "سيتم حذف الطلب من قاعدة البيانات ولا يمكن التراجع."

        );


    if (!confirmed) {
        return;
    }


    button.disabled = true;

    button.textContent =
        "⏳ جاري حذف الطلب...";


    const {
        data,
        error
    } =
        await supabaseClient
            .from("orders")
            .delete()
            .eq(
                "id",
                orderId
            )
            .select("id")
            .maybeSingle();


    if (error) {

        console.error(
            "Delete error:",
            error
        );


        showMessage(
            "❌ تعذر حذف الطلب: " +
            error.message
        );


        button.disabled = false;

        button.textContent =
            "🗑️ حذف الطلب";

        return;

    }


    if (!data) {

        showMessage(
            "❌ لم يتم حذف الطلب. تحقق من صلاحية DELETE في Supabase."
        );


        button.disabled = false;

        button.textContent =
            "🗑️ حذف الطلب";

        return;

    }


    showMessage(
        "✅ تم حذف الطلب بنجاح."
    );


    await loadOrders();

}


/* =====================================================
   تسوية مستحق البائع
===================================================== */

async function settleSeller(
    orderId,
    button
) {

    const order =
        orders.find(
            item =>
                String(item.id) ===
                String(orderId)
        );


    if (!order) {

        showMessage(
            "❌ لم يتم العثور على الطلب."
        );

        return;

    }


    const currentStatus =
        normalizeStatus(order.status);


    if (currentStatus !== "confirmed") {

        showMessage(
            "❌ لا يمكن التسوية قبل تأكيد الاستلام."
        );

        return;

    }


    if (order.issue_reported === true) {

        showMessage(
            "❌ لا يمكن التسوية مع وجود اعتراض."
        );

        return;

    }


    if (order.seller_paid === true) {
        return;
    }


    const sellerSummary =
        buildSellerSummary(
            normalizeItems(order.items)
        );


    if (!sellerSummary.length) {

        showMessage(
            "❌ لا يوجد بائع مرتبط بهذا الطلب."
        );

        return;

    }


    const totalDue =
        sellerSummary.reduce(
            (sum, seller) =>
                sum +
                Number(seller.amount || 0),
            0
        );


    const confirmed =
        window.confirm(

            "هل نفذت التحويل للبائع؟\n\n" +

            "إجمالي المستحق: " +
            money(totalDue) +

            "\n\n" +

            "بالضغط على موافق سيتم تسجيل الطلب كمكتمل."

        );


    if (!confirmed) {
        return;
    }


    const originalText =
        button.textContent;


    button.disabled = true;

    button.textContent =
        "⏳ جاري تسجيل التسوية...";


    const now =
        new Date().toISOString();


    /*
     * لا نستخدم:
     * .eq("issue_reported", false)
     *
     * لأن القيمة قد تكون NULL.
     */

    const {
        data,
        error
    } =
        await supabaseClient
            .from("orders")
            .update({

                seller_paid:
                    true,

                seller_paid_at:
                    now,

                status:
                    "completed",

                updated_at:
                    now

            })
            .eq(
                "id",
                orderId
            )
            .eq(
                "status",
                "confirmed"
            )
            .select(
                "id,status,seller_paid"
            )
            .maybeSingle();


    if (error) {

        console.error(
            "Settlement error:",
            error
        );


        showMessage(
            "❌ فشل تسجيل التسوية: " +
            error.message
        );


        button.disabled = false;

        button.textContent =
            originalText;

        return;

    }


    if (!data) {

        showMessage(
            "❌ لم يتم تسجيل التسوية. تحقق من صلاحية UPDATE في Supabase."
        );


        button.disabled = false;

        button.textContent =
            originalText;

        return;

    }


    showMessage(
        "✅ تم تسجيل التسوية واكتملت دورة الطلب."
    );


    await loadOrders();

}


/* =====================================================
   إلغاء الطلب
===================================================== */

async function cancelOrder(
    orderId,
    button
) {

    const confirmed =
        window.confirm(
            "هل تريد إلغاء هذا الطلب؟"
        );


    if (!confirmed) {
        return;
    }


    await updateOrderStatus(
        orderId,
        "cancelled",
        button
    );

}


/* =====================================================
   حدث واحد لكل الأزرار
===================================================== */

ordersContainer.addEventListener(
    "click",
    async function(event) {

        /*
         * مراحل دورة الطلب
         */

        const workflowButton =
            event.target.closest(
                ".workflow-step"
            );


        if (workflowButton) {

            await handleWorkflowClick(
                workflowButton
            );

            return;

        }


        /*
         * حذف الطلب
         */

        const deleteButton =
            event.target.closest(
                ".delete-order-button"
            );


        if (deleteButton) {

            await deleteOrder(
                deleteButton.dataset.deleteId,
                deleteButton
            );

            return;

        }


        /*
         * إلغاء الطلب
         */

        const cancelButton =
            event.target.closest(
                ".secondary-button"
            );


        if (
            cancelButton &&
            cancelButton.dataset.cancelId
        ) {

            await cancelOrder(
                cancelButton.dataset.cancelId,
                cancelButton
            );

            return;

        }


        /*
         * تسوية البائع
         */

        const settlementButton =
            event.target.closest(
                ".settlement-button"
            );


        if (settlementButton) {

            await settleSeller(
                settlementButton.dataset.settleId,
                settlementButton
            );

            return;

        }

    }
);


/* =====================================================
   الرسالة
===================================================== */

function showMessage(text) {

    message.textContent =
        text;


    message.classList.add(
        "show"
    );


    clearTimeout(
        showMessage.timer
    );


    showMessage.timer =
        setTimeout(
            () => {

                message.classList.remove(
                    "show"
                );

            },
            4000
        );

}


/* =====================================================
   الأحداث
===================================================== */

filterStatus.addEventListener(
    "change",
    renderOrders
);


refreshButton.addEventListener(
    "click",
    loadOrders
);


/* =====================================================
   التشغيل
===================================================== */

loadOrders();

</script>
