<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<meta
name="description"
content="سلة المشتريات | لَحْقها"
>

<title>السلة | لَحْقها 🛒</title>

<link rel="stylesheet" href="style.css">

<link rel="manifest" href="manifest.json">

<link
    rel="icon"
    type="image/png"
    href="images/icon.png"
>

<link
    rel="apple-touch-icon"
    href="images/icon.png"
>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

.cart-page {
    width: min(900px, calc(100% - 30px));
    margin: 35px auto 100px;
}

.cart-page-header {
    text-align: center;
    margin-bottom: 30px;
}

.cart-page-header h2 {
    color: #1e3a5f;
    margin-bottom: 8px;
}

.cart-page-header p {
    color: #687585;
}

.cart-box {
    background: #fff;
    border-radius: 20px;
    padding: 22px;
    box-shadow: 0 8px 25px rgba(30,55,80,.08);
    border: 1px solid #e4e9ee;
}

.cart-page-item {
    display: flex;
    align-items: center;
    gap: 15px;
    padding: 15px 0;
    border-bottom: 1px solid #e9edf1;
}

.cart-page-item:last-child {
    border-bottom: 0;
}

.cart-page-image {
    width: 90px;
    height: 90px;
    object-fit: cover;
    border-radius: 12px;
    background: #f1f3f5;
    flex-shrink: 0;
}

.cart-page-info {
    flex: 1;
    min-width: 0;
}

.cart-page-info h3 {
    margin: 0 0 7px;
    color: #1e3a5f;
    font-size: 18px;
}

.cart-page-info p {
    margin: 5px 0;
    color: #687585;
    font-size: 14px;
}

.cart-page-price {
    font-weight: bold;
    color: #1e3a5f !important;
}

.cart-stock {
    font-weight: bold;
}

.cart-stock.available {
    color: #2e7d32;
}

.cart-stock.out {
    color: #b32626;
}

.cart-stock.warning {
    color: #c56a00;
}

.cart-page-controls {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
}

.cart-page-controls button {
    width: 32px;
    height: 32px;
    border: 0;
    border-radius: 8px;
    background: #1e3a5f;
    color: #fff;
    cursor: pointer;
    font-family: inherit;
    font-size: 18px;
}

.cart-page-controls button:disabled {
    background: #cfd5da;
    color: #fff;
    cursor: not-allowed;
    opacity: .8;
}

.cart-page-controls strong {
    min-width: 25px;
    text-align: center;
}

.cart-page-delete {
    width: auto !important;
    height: auto !important;
    padding: 7px 12px !important;
    background: #fbeaea !important;
    color: #b32626 !important;
    font-size: 14px !important;
}

.cart-page-summary {
    margin-top: 25px;
    padding-top: 20px;
    border-top: 2px solid #e8edf2;
}

.cart-page-summary-row {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    margin: 10px 0;
}

.cart-page-total {
    font-size: 22px;
    font-weight: 900;
    color: #1e3a5f;
}

.cart-page-actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
}

.cart-page-button {
    flex: 1;
    display: inline-flex;
    justify-content: center;
    align-items: center;
    padding: 13px 18px;
    border-radius: 10px;
    text-decoration: none;
    border: 0;
    cursor: pointer;
    font-family: inherit;
    font-size: 16px;
    font-weight: bold;
}

.cart-page-button.primary {
    background: #2e7d32;
    color: #fff;
}

.cart-page-button.secondary {
    background: #eef2f5;
    color: #1e3a5f;
}

.cart-page-empty {
    text-align: center;
    padding: 60px 20px;
    color: #687585;
}

.cart-page-empty-icon {
    font-size: 60px;
    margin-bottom: 15px;
}

#cart-toast {
    position: fixed;
    right: 20px;
    bottom: 20px;
    background: #1e3a5f;
    color: #fff;
    padding: 12px 18px;
    border-radius: 10px;
    opacity: 0;
    pointer-events: none;
    transition: .3s;
    z-index: 9999;
}

#cart-toast.show {
    opacity: 1;
}

@media (max-width: 600px) {

    .cart-page-item {
        align-items: flex-start;
    }

    .cart-page-image {
        width: 75px;
        height: 75px;
    }

    .cart-page-actions {
        flex-direction: column;
    }

    .cart-page-controls {
        flex-wrap: wrap;
    }

}

</style>

</head>

<body>

<header class="site-header">

<div class="logo">

    <h1>
        🛒 سلة المشتريات
    </h1>

    <p>
        منتجاتك التي اخترتها من لَحْقها
    </p>

</div>

<nav>

    <a href="index.html">
        الرئيسية
    </a>

    <a href="categories.html">
        الأقسام
    </a>

    <a href="cart.html">
        🛒 السلة
    </a>

</nav>

</header>


<main class="cart-page">

<div class="cart-page-header">

    <h2>
        🛒 سلة المشتريات
    </h2>

    <p>
        راجع منتجاتك قبل إتمام الطلب.
    </p>

</div>


<div
    class="cart-box"
    id="cart-container"
></div>

</main>


<div id="cart-toast"></div>


<script>

/* =========================================
   Supabase
========================================= */

const SUPABASE_URL =
    "https://gyyyzavjzvcxzgrtukqu.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_Rj6F5Fp2tHJSWzbRRdLVZQ_8D5wL8p-";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================
   السلة تعتمد على sessionStorage
========================================= */

let cart = [];


/* =========================================
   قراءة السلة
========================================= */

function loadCart() {

    try {

        const saved =
            sessionStorage.getItem("cart");

        if (!saved) {

            cart = [];

            return;

        }

        const parsed =
            JSON.parse(saved);

        cart =
            Array.isArray(parsed)
                ? parsed
                : [];

    }
    catch (error) {

        console.error(
            "خطأ في قراءة السلة:",
            error
        );

        cart = [];

    }

}


/* =========================================
   العناصر
========================================= */

const container =
    document.getElementById(
        "cart-container"
    );

const toast =
    document.getElementById(
        "cart-toast"
    );


/* =========================================
   حماية النص
========================================= */

function escapeHtml(value) {

    return String(value ?? "")
        .replace(
            /[&<>"']/g,
            character => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;"
            }[character])
        );

}


/* =========================================
   الصور
========================================= */

function imageUrl(path) {

    const value =
        String(path || "").trim();

    if (!value) {

        return "";

    }

    if (
        /^https?:\/\//i.test(value) ||
        /^data:image\//i.test(value) ||
        /^blob:/i.test(value)
    ) {

        return value;

    }

    return encodeURI(
        value.replace(
            /^\.\//,
            ""
        )
    );

}


/* =========================================
   التنبيه
========================================= */

function showToast(message) {

    toast.textContent =
        message;

    toast.classList.add(
        "show"
    );

    clearTimeout(
        showToast.timer
    );

    showToast.timer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            2200
        );

}


/* =========================================
   حفظ السلة
========================================= */

function saveCart() {

    try {

        if (!cart.length) {

            sessionStorage.removeItem(
                "cart"
            );

        }
        else {

            sessionStorage.setItem(
                "cart",
                JSON.stringify(cart)
            );

        }

    }
    catch (error) {

        console.error(
            "تعذر حفظ السلة:",
            error
        );

        showToast(
            "تعذر حفظ السلة"
        );

        return;

    }

    renderCart();

}


/* =========================================
   جلب مخزون منتج واحد من Supabase
========================================= */

async function getProductStock(productId) {

    const id =
        String(productId || "").trim();

    if (!id) {

        return {
            success: false,
            error: "معرّف المنتج غير موجود."
        };

    }

    const {
        data,
        error
    } =
        await supabaseClient
            .from("products")
            .select("id, quantity, available")
            .eq("id", id)
            .maybeSingle();

    if (error) {

        console.error(
            "خطأ في قراءة المخزون:",
            error
        );

        return {
            success: false,
            error: "تعذر التحقق من المخزون."
        };

    }

    if (!data) {

        return {
            success: false,
            error: "المنتج غير موجود."
        };

    }

    const stock =
        Number(data.quantity);

    if (
        !Number.isInteger(stock) ||
        stock < 0
    ) {

        return {
            success: false,
            error: "مخزون المنتج غير صالح."
        };

    }

    return {
        success: true,
        stock,
        available: data.available !== false
    };

}


/* =========================================
   تغيير الكمية
========================================= */

async function changeQuantity(index, amount) {

    if (!cart[index]) {

        return;

    }


    /* -------------------------------------
       النقصان لا يحتاج فحص المخزون
    ------------------------------------- */

    if (amount < 0) {

        let quantity =
            Number(
                cart[index].quantity
            ) || 1;

        quantity += amount;


        if (quantity <= 0) {

            cart.splice(
                index,
                1
            );

            showToast(
                "تم حذف المنتج من السلة"
            );

        }
        else {

            cart[index].quantity =
                quantity;

        }

        saveCart();

        return;

    }


    /* -------------------------------------
       الزيادة: فحص المخزون الحقيقي
    ------------------------------------- */

    const item =
        cart[index];

    const currentQuantity =
        Math.max(
            1,
            Number(item.quantity) || 1
        );


    const stockResult =
        await getProductStock(
            item.id
        );


    if (!stockResult.success) {

        showToast(
            stockResult.error
                || "تعذر التحقق من المخزون، حاول مرة أخرى."
        );

        return;

    }


    if (!stockResult.available) {

        showToast(
            `المنتج «${item.title || item.name || "المنتج"}» غير متاح حاليًا.`
        );

        renderCart();

        return;

    }


    const stock =
        stockResult.stock;


    /* -------------------------------------
       المخزون صفر
    ------------------------------------- */

    if (stock <= 0) {

        showToast(
            `🔴 المنتج «${item.title || item.name || "المنتج"}» نفد من المخزون.`
        );

        renderCart();

        return;

    }


    /* -------------------------------------
       منع تجاوز المخزون
    ------------------------------------- */

    if (currentQuantity >= stock) {

        showToast(
            `الحد الأقصى المتوفر من «${item.title || item.name || "المنتج"}» هو ${stock}`
        );

        renderCart();

        return;

    }


    /* -------------------------------------
       الزيادة مسموحة
    ------------------------------------- */

    item.quantity =
        currentQuantity + 1;


    /*
       نحفظ آخر مخزون معروف في السلة
       لاستخدامه في العرض فقط.
       التحقق الحقيقي يبقى من قاعدة البيانات.
    */

    item.stock =
        stock;


    saveCart();

}


/* =========================================
   حذف منتج
========================================= */

function deleteItem(index) {

    if (!cart[index]) {

        return;

    }

    const title =
        cart[index].title ||
        cart[index].name ||
        "المنتج";

    cart.splice(
        index,
        1
    );

    saveCart();

    showToast(
        `تم حذف «${title}» من السلة`
    );

}


/* =========================================
   إفراغ السلة
========================================= */

function clearCart() {

    if (!cart.length) {

        return;

    }

    const confirmed =
        confirm(
            "هل تريد إفراغ السلة بالكامل؟"
        );

    if (!confirmed) {

        return;

    }

    cart = [];

    sessionStorage.removeItem(
        "cart"
    );

    renderCart();

    showToast(
        "تم إفراغ السلة"
    );

}


/* =========================================
   جلب مخزون جميع منتجات السلة
   لعرض الحالة الصحيحة
========================================= */

async function getCartStocks() {

    const productIds =
        cart
            .map(
                item =>
                    String(
                        item.id || ""
                    ).trim()
            )
            .filter(Boolean);


    if (!productIds.length) {

        return new Map();

    }


    const uniqueIds =
        [...new Set(productIds)];


    const {
        data,
        error
    } =
        await supabaseClient
            .from("products")
            .select("id, quantity, available")
            .in(
                "id",
                uniqueIds
            );


    if (error) {

        console.error(
            "تعذر جلب مخزون السلة:",
            error
        );

        return null;

    }


    const stockMap =
        new Map();


    (data || []).forEach(
        product => {

            const stock =
                Number(
                    product.quantity
                );


            stockMap.set(
                String(product.id),
                {
                    stock:
                        Number.isInteger(stock) &&
                        stock >= 0
                            ? stock
                            : 0,
                    available:
                        product.available !== false
                }
            );

        }
    );


    return stockMap;

}


/* =========================================
   عرض السلة
========================================= */

async function renderCart() {

    container.innerHTML = "";


    /* =====================================
       السلة فارغة
    ===================================== */

    if (!cart.length) {

        container.innerHTML = `

            <div class="cart-page-empty">

                <div class="cart-page-empty-icon">
                    🛍️
                </div>

                <h3>
                    السلة فارغة
                </h3>

                <p>
                    أضف المنتجات التي تريد شراءها من الأقسام.
                </p>

                <div
                    class="cart-page-actions"
                    style="justify-content:center;"
                >

                    <a
                        href="categories.html"
                        class="cart-page-button primary"
                    >
                        🛍️ تصفح الأقسام
                    </a>

                </div>

            </div>

        `;

        return;

    }


    /*
       جلب المخزون الحالي مرة واحدة
       لجميع المنتجات الموجودة في السلة.
    */

    const stockMap =
        await getCartStocks();


    let total = 0;

    let count = 0;


    /* =====================================
       المنتجات
    ===================================== */

    cart.forEach(
        (item, index) => {

            const quantity =
                Math.max(
                    1,
                    Number(
                        item.quantity
                    ) || 1
                );


            item.quantity =
                quantity;


            const price =
                Number(
                    item.price
                ) || 0;


            const subtotal =
                price * quantity;


            total += subtotal;

            count += quantity;


            const title =
                item.title ||
                item.name ||
                "منتج";


            const category =
                item.category ||
                "سلعة";


            const image =
                imageUrl(
                    item.image
                );


            /* ---------------------------------
               حالة المخزون
            --------------------------------- */

            const productId =
                String(
                    item.id || ""
                ).trim();


            const stockInfo =
                stockMap
                    ? stockMap.get(productId)
                    : null;


            let stockHtml = "";

            let plusDisabled = false;


            if (stockInfo) {

                const stock =
                    stockInfo.stock;


                if (!stockInfo.available) {

                    stockHtml = `
                        <p class="cart-stock out">
                            🔴 المنتج غير متاح حاليًا
                        </p>
                    `;

                    plusDisabled = true;

                }
                else if (stock <= 0) {

                    stockHtml = `
                        <p class="cart-stock out">
                            🔴 نفد المخزون
                        </p>
                    `;

                    plusDisabled = true;

                }
                else if (quantity >= stock) {

                    stockHtml = `
                        <p class="cart-stock warning">
                            📦 المتوفر: ${stock}
                            — وصلت للحد الأقصى
                        </p>
                    `;

                    plusDisabled = true;

                }
                else {

                    stockHtml = `
                        <p class="cart-stock available">
                            🟢 المتوفر: ${stock}
                        </p>
                    `;

                }

            }
            else if (stockMap === null) {

                stockHtml = `
                    <p class="cart-stock warning">
                        ⚠️ تعذر التحقق من المخزون
                    </p>
                `;

                plusDisabled = true;

            }
            else {

                /*
                   إذا لم يوجد المنتج في نتيجة قاعدة البيانات
                   نمنع الزيادة احتياطيًا.
                */

                stockHtml = `
                    <p class="cart-stock out">
                        🔴 المنتج غير موجود
                    </p>
                `;

                plusDisabled = true;

            }


            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "cart-page-item";


            row.innerHTML = `

                ${
                    image
                    ?
                    `
                    <img
                        class="cart-page-image"
                        src="${escapeHtml(image)}"
                        alt="${escapeHtml(title)}"
                    >
                    `
                    :
                    `
                    <div
                        class="cart-page-image"
                        style="
                            display:flex;
                            align-items:center;
                            justify-content:center;
                            font-size:35px;
                        "
                    >
                        📦
                    </div>
                    `
                }


                <div class="cart-page-info">

                    <h3>
                        ${escapeHtml(title)}
                    </h3>


                    <p>
                        📂
                        ${escapeHtml(category)}
                    </p>


                    <p class="cart-page-price">

                        ${price.toLocaleString(
                            "ar-SA",
                            {
                                minimumFractionDigits: 2,
                                maximumFractionDigits: 2
                            }
                        )}

                        ريال

                    </p>


                    ${stockHtml}


                    <div class="cart-page-controls">

                        <button
                            type="button"
                            data-action="minus"
                        >
                            −
                        </button>


                        <strong>
                            ${quantity}
                        </strong>


                        <button
                            type="button"
                            data-action="plus"
                            ${plusDisabled ? "disabled" : ""}
                        >
                            +
                        </button>


                        <button
                            type="button"
                            class="cart-page-delete"
                            data-action="delete"
                        >
                            🗑 حذف
                        </button>

                    </div>

                </div>

            `;


            /* زيادة */

            row
                .querySelector(
                    '[data-action="plus"]'
                )
                .addEventListener(
                    "click",
                    () => {

                        changeQuantity(
                            index,
                            1
                        );

                    }
                );


            /* نقصان */

            row
                .querySelector(
                    '[data-action="minus"]'
                )
                .addEventListener(
                    "click",
                    () => {

                        changeQuantity(
                            index,
                            -1
                        );

                    }
                );


            /* حذف */

            row
                .querySelector(
                    '[data-action="delete"]'
                )
                .addEventListener(
                    "click",
                    () => {

                        deleteItem(
                            index
                        );

                    }
                );


            container.appendChild(
                row
            );

        }
    );


    /* =====================================
       ملخص السلة
    ===================================== */

    const summary =
        document.createElement(
            "div"
        );


    summary.className =
        "cart-page-summary";


    summary.innerHTML = `

        <div class="cart-page-summary-row">

            <span>
                عدد المنتجات
            </span>

            <strong>
                ${count}
            </strong>

        </div>


        <div class="cart-page-summary-row">

            <span>
                الإجمالي
            </span>

            <strong class="cart-page-total">

                ${total.toLocaleString(
                    "ar-SA",
                    {
                        minimumFractionDigits: 2,
                        maximumFractionDigits: 2
                    }
                )}

                ريال

            </strong>

        </div>


        <div class="cart-page-actions">

            <button
                type="button"
                class="cart-page-button secondary"
                id="clear-all"
            >
                🗑 إفراغ السلة
            </button>


            <a
                href="checkout.html"
                class="cart-page-button primary"
                id="checkout-link"
            >
                🛒 إتمام الطلب
            </a>

        </div>

    `;


    container.appendChild(
        summary
    );


    /* =====================================
       إفراغ السلة
    ===================================== */

    document
        .getElementById("clear-all")
        .addEventListener(
            "click",
            clearCart
        );


    /* =====================================
       الانتقال إلى إتمام الطلب
    ===================================== */

    document
        .getElementById("checkout-link")
        .addEventListener(
            "click",
            event => {

                if (!cart.length) {

                    event.preventDefault();

                    showToast(
                        "السلة فارغة"
                    );

                }

            }
        );

}


/* =========================================
   التشغيل
========================================= */

loadCart();

renderCart();

</script>

</body>

</html>
