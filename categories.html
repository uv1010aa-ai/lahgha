<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="أقسام وسلع منصة لَحْقها">
<title>الأقسام | لَحْقها 🛍️</title>

<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="images/icon.png">
<link rel="apple-touch-icon" href="images/icon.png">

<style>
.categories-page{
    width:min(1100px,calc(100% - 30px));
    margin:30px auto 100px;
}

.page-intro{
    text-align:center;
    margin-bottom:30px;
}

.page-intro h2{
    margin-bottom:8px;
    color:#1e3a5f;
}

.page-intro p{
    color:#666;
}

.categories-home,
.products-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.category-card{
    display:block;
    text-decoration:none;
    color:inherit;
    background:#fff;
    border-radius:18px;
    padding:25px 20px;
    text-align:center;
    border:1px solid #e5e5e5;
    box-shadow:0 5px 20px rgba(0,0,0,.07);
    transition:.2s;
}

.category-card:hover,
.product-card:hover{
    transform:translateY(-4px);
}

.category-icon{
    font-size:48px;
    margin-bottom:10px;
}

.category-card h3{
    margin:8px 0;
    color:#1e3a5f;
}

.category-card p{
    margin:0;
    color:#777;
}

.category-count{
    display:inline-block;
    margin-top:12px;
    padding:5px 12px;
    border-radius:20px;
    background:#eef7ef;
    color:#267a35;
    font-size:13px;
    font-weight:bold;
}

.back-link{
    display:inline-block;
    margin-bottom:20px;
    padding:9px 15px;
    background:#fff;
    border:1px solid #ddd;
    border-radius:9px;
    color:#1e3a5f;
    text-decoration:none;
}

.product-card{
    background:#fff;
    border-radius:18px;
    overflow:hidden;
    border:1px solid #e5e5e5;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
    transition:.2s;
}

.product-image-button{
    display:block;
    width:100%;
    padding:0;
    border:0;
    background:#f1f1f1;
    cursor:pointer;
}

.product-image{
    width:100%;
    height:230px;
    object-fit:cover;
    display:block;
    background:#f1f1f1;
}

.product-info{
    padding:18px;
}

.product-info h3{
    margin:0 0 10px;
    color:#1e3a5f;
}

.product-info p{
    margin:7px 0;
    color:#666;
}

.product-price{
    font-size:20px;
    font-weight:bold;
    color:#1e3a5f!important;
}

.available{
    color:#25823a!important;
    font-weight:bold;
}

.add-product-btn{
    width:100%;
    border:0;
    padding:13px;
    background:#1e3a5f;
    color:#fff;
    font-family:inherit;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.empty-box,
.loading-box{
    grid-column:1/-1;
    background:#fff;
    border-radius:16px;
    padding:45px 20px;
    text-align:center;
    box-shadow:0 5px 20px rgba(0,0,0,.06);
}

.empty-icon{
    font-size:55px;
    margin-bottom:10px;
}

.product-modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.72);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:5000;
}

.product-modal.show{
    display:flex;
}

.modal-box{
    width:min(900px,100%);
    max-height:90vh;
    overflow-y:auto;
    background:#fff;
    border-radius:18px;
    padding:20px;
    position:relative;
}

.modal-close{
    position:absolute;
    top:10px;
    left:10px;
    width:40px;
    height:40px;
    border:0;
    border-radius:50%;
    background:#1e3a5f;
    color:#fff;
    font-size:22px;
    cursor:pointer;
    z-index:5;
}

.modal-main-image{
    width:100%;
    height:360px;
    object-fit:contain;
    background:#f5f5f5;
    border-radius:14px;
}

.modal-thumbs{
    display:flex;
    gap:10px;
    overflow-x:auto;
    padding:12px 0;
}

.modal-thumb{
    flex:0 0 85px;
    width:85px;
    height:70px;
    border:2px solid transparent;
    border-radius:10px;
    overflow:hidden;
    padding:0;
    background:#eee;
    cursor:pointer;
}

.modal-thumb.active{
    border-color:#1e3a5f;
}

.modal-thumb img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.modal-info{
    padding:10px 5px;
}

.modal-info h2{
    color:#1e3a5f;
}

#toast{
    position:fixed;
    right:20px;
    bottom:20px;
    background:#1e3a5f;
    color:#fff;
    padding:12px 18px;
    border-radius:10px;
    opacity:0;
    pointer-events:none;
    transition:.3s;
    z-index:6000;
}

#toast.show{
    opacity:1;
}

@media(max-width:900px){
    .categories-home,
    .products-grid{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:600px){
    .categories-home,
    .products-grid{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<header class="site-header">
    <div class="logo">
        <h1>🛍️ لَحْقها</h1>
        <p>شفتها؟ لَحْقها قبل تروح!</p>
    </div>

    <nav>
        <a href="index.html">الرئيسية</a>
        <a href="categories.html">الأقسام</a>
        <a href="about.html">من نحن</a>
        <a href="contact.html">اتصل بنا</a>
        <a href="cart.html">🛒 السلة</a>
        <a href="seller/offer.html">📦 اعرض سلعتك</a>
    </nav>
</header>

<main class="categories-page">

<section id="categories-view">

    <div class="page-intro">
        <h2>🛍️ اختر القسم</h2>
        <p>تصفح السلع المتاحة في القسم الذي تبحث عنه.</p>
    </div>

    <div class="categories-home" id="categories-list"></div>

</section>

<section id="products-view" style="display:none;">

    <a href="categories.html" class="back-link">
        ← العودة إلى الأقسام
    </a>

    <div class="page-intro">
        <h2 id="category-title">📂 السلع</h2>
        <p id="category-subtitle"></p>
    </div>

    <div id="category-products"></div>

</section>

</main>

<footer>
    <p>© 2026 لَحْقها 🛍️</p>
</footer>

<div id="toast"></div>

<div class="product-modal" id="product-modal">

    <div class="modal-box">

        <button class="modal-close" id="modal-close">
            ×
        </button>

        <img
            src=""
            class="modal-main-image"
            id="modal-main-image"
        >

        <div class="modal-thumbs" id="modal-thumbs"></div>

        <div class="modal-info" id="modal-info"></div>

    </div>

</div>

<script>
/* ================================
   SUPABASE
================================ */

const SUPABASE_URL =
"https://gyyyzavjzvcxzgrtukqu.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Rj6F5Fp2tHJSWzbRRdLVZQ_8D5wL8p-";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* ================================
   الأقسام
================================ */

const categories = [

    {
        name:"كتب",
        icon:"📚",
        description:"كتب وروايات ومراجع"
    },

    {
        name:"جوالات",
        icon:"📱",
        description:"جوالات وملحقاتها"
    },

    {
        name:"كمبيوتر",
        icon:"💻",
        description:"أجهزة الكمبيوتر وملحقاتها"
    },

    {
        name:"ألعاب",
        icon:"🎮",
        description:"ألعاب وترفيه"
    },

    {
        name:"أثاث",
        icon:"🪑",
        description:"أثاث منزلي ومكتبي"
    },

    {
        name:"أجهزة",
        icon:"📺",
        description:"أجهزة منزلية وإلكترونية"
    },

    {
        name:"رياضة",
        icon:"🚲",
        description:"معدات واحتياجات رياضية"
    },

    {
        name:"أدوات",
        icon:"🛠️",
        description:"أدوات ومستلزمات"
    },

    {
        name:"ملابس",
        icon:"👕",
        description:"ملابس وأزياء"
    },

    {
        name:"أخرى",
        icon:"📦",
        description:"سلع متنوعة"
    }

];


/* ================================
   الرابط
================================ */

const params =
new URLSearchParams(
    window.location.search
);

const selectedCategory =
(params.get("category") || "").trim();


/* ================================
   العناصر
================================ */

const categoriesView =
document.getElementById("categories-view");

const productsView =
document.getElementById("products-view");

const categoriesList =
document.getElementById("categories-list");

const productsContainer =
document.getElementById("category-products");

const categoryTitle =
document.getElementById("category-title");

const categorySubtitle =
document.getElementById("category-subtitle");

const toast =
document.getElementById("toast");


/* ================================
   حماية النص
================================ */

function escapeHtml(value){

    return String(value ?? "")
        .replace(/[&<>"']/g,char => ({
            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",
            "'":"&#039;"
        }[char]));

}


/* ================================
   الصور
================================ */

function imageUrl(path){

    if(!path) return "";

    let value=String(path).trim();

    if(
        /^https?:\/\//i.test(value) ||
        /^data:image\//i.test(value) ||
        /^blob:/i.test(value)
    ){
        return value;
    }

    return encodeURI(
        value.replace(/^\.\//,"")
    );

}


function getProductImages(product){

    let result=[];

    if(product.image){
        result.push(product.image);
    }

    if(Array.isArray(product.images)){

        product.images.forEach(image=>{

            if(typeof image==="string"){
                result.push(image);
            }

        });

    }

    return [
        ...new Set(
            result
            .filter(Boolean)
            .map(imageUrl)
        )
    ];

}


function getMainImage(product){

    const images=
    getProductImages(product);

    return images[0] || "";
}


/* ================================
   توحيد القسم
================================ */

function normalizeCategory(value){

    return String(value || "")
        .trim()
        .replace(/\s+/g," ")
        .replace(/^الكتب$/,"كتب")
        .replace(/^كتاب$/,"كتب")
        .replace(/^كتب وروايات$/,"كتب");

}


function sameCategory(a,b){

    return normalizeCategory(a) ===
           normalizeCategory(b);

}


/* ================================
   تحميل books.json
================================ */

async function loadBooks(){

    try{

        const response =
        await fetch("books.json",{
            cache:"no-store"
        });

        if(!response.ok){
            throw new Error(
                "books.json غير موجود"
            );
        }

        const data =
        await response.json();

        if(!Array.isArray(data)){
            return [];
        }

        return data
            .filter(product =>
                product &&
                product.available !== false
            )
            .map(product => ({
                ...product,
                source:"json"
            }));

    }
    catch(error){

        console.error(
            "خطأ books.json:",
            error
        );

        return [];

    }

}


/* ================================
   تحميل Supabase
================================ */

async function loadSupabaseProducts(){

    try{

        const {
            data,
            error
        } =
        await supabaseClient
            .from("products")
            .select("*")
            .eq("available",true)
            .order("id",{
                ascending:false
            });

        if(error){

            console.error(
                "Supabase:",
                error
            );

            return [];

        }

        return (data || [])
            .filter(product =>
                product &&
                product.title &&
                product.category
            )
            .map(product => ({
                ...product,
                source:"supabase"
            }));

    }
    catch(error){

        console.error(error);

        return [];

    }

}


/* ================================
   دمج المنتجات
================================ */

async function getProducts(){

    const [
        books,
        supabaseProducts
    ] =
    await Promise.all([
        loadBooks(),
        loadSupabaseProducts()
    ]);


    /*
       نبدأ بكتب JSON
       ثم نضيف منتجات Supabase.

       إذا كان نفس id موجودًا في المصدرين
       نأخذ نسخة Supabase.
    */

    const map=new Map();


    books.forEach(product=>{

        map.set(
            "json-"+product.id,
            product
        );

    });


    supabaseProducts.forEach(product=>{

        const same =
        [...map.values()].find(item =>
            String(item.id) ===
            String(product.id)
        );

        if(same){

            map.delete(
                "json-"+same.id
            );

        }

        map.set(
            "supabase-"+product.id,
            product
        );

    });


    return [...map.values()]
        .filter(product =>
            product &&
            product.title &&
            product.category &&
            product.available !== false
        );

}


/* ================================
   السلة
================================ */

let cart=[];

try{

    const saved =
    JSON.parse(
        localStorage.getItem("cart") || "[]"
    );

    if(Array.isArray(saved)){
        cart=saved;
    }

}
catch{
    cart=[];
}


function saveCart(){

    localStorage.setItem(
        "cart",
        JSON.stringify(cart)
    );

}


function addToCart(product){

    const existing =
    cart.find(item =>
        String(item.id) ===
        String(product.id)
    );

    if(existing){

        existing.quantity =
        (Number(existing.quantity)||1)+1;

    }
    else{

        cart.push({

            id:product.id,

            title:product.title,

            price:Number(product.price)||0,

            category:product.category,

            image:getMainImage(product),

            images:getProductImages(product),

            quantity:1

        });

    }

    saveCart();

    showToast(
        `تمت إضافة «${product.title}» إلى السلة`
    );

}


/* ================================
   التنبيه
================================ */

function showToast(message){

    toast.textContent=message;

    toast.classList.add("show");

    clearTimeout(showToast.timer);

    showToast.timer=
    setTimeout(()=>{
        toast.classList.remove("show");
    },2200);

}


/* ================================
   عرض الأقسام
================================ */

async function renderCategories(){

    categoriesList.innerHTML=`
        <div class="loading-box">
            ⏳ جارٍ تحميل المنتجات...
        </div>
    `;

    const products =
    await getProducts();

    categoriesList.innerHTML="";


    categories.forEach(category=>{

        const count =
        products.filter(product =>
            sameCategory(
                product.category,
                category.name
            )
        ).length;


        const link =
        document.createElement("a");

        link.className="category-card";

        link.href=
        "categories.html?category="+
        encodeURIComponent(category.name);


        link.innerHTML=`

            <div class="category-icon">
                ${category.icon}
            </div>

            <h3>
                ${escapeHtml(category.name)}
            </h3>

            <p>
                ${escapeHtml(category.description)}
            </p>

            <span class="category-count">
                ${count} سلعة
            </span>

        `;


        categoriesList.appendChild(link);

    });

}


/* ================================
   النافذة
================================ */

const productModal =
document.getElementById("product-modal");

const modalClose =
document.getElementById("modal-close");

const modalMainImage =
document.getElementById("modal-main-image");

const modalThumbs =
document.getElementById("modal-thumbs");

const modalInfo =
document.getElementById("modal-info");


function openProductModal(product){

    const images =
    getProductImages(product);

    modalThumbs.innerHTML="";


    if(images.length){

        modalMainImage.src=images[0];

        modalMainImage.alt=product.title;


        images.forEach((image,index)=>{

            const button =
            document.createElement("button");

            button.type="button";

            button.className=
            "modal-thumb"+
            (index===0 ? " active":"");


            const img =
            document.createElement("img");

            img.src=image;

            img.alt=
            `صورة ${index+1}`;

            button.appendChild(img);


            button.addEventListener(
                "click",
                ()=>{

                    modalMainImage.src=image;

                    document
                    .querySelectorAll(".modal-thumb")
                    .forEach(thumb =>
                        thumb.classList.remove("active")
                    );

                    button.classList.add("active");

                }
            );


            modalThumbs.appendChild(button);

        });

    }


    modalInfo.innerHTML=`

        <h2>
            ${escapeHtml(product.title)}
        </h2>

        ${
            product.author
            ? `<p>✍️ ${escapeHtml(product.author)}</p>`
            : ""
        }

        <p>
            📂 ${escapeHtml(product.category)}
        </p>

        <p class="product-price">
            ${Number(product.price||0).toLocaleString("ar-SA")}
            ريال
        </p>

        ${
            product.description
            ? `<p>${escapeHtml(product.description)}</p>`
            : ""
        }

    `;


    productModal.classList.add("show");

}


function closeProductModal(){

    productModal.classList.remove("show");

}


modalClose.addEventListener(
    "click",
    closeProductModal
);


productModal.addEventListener(
    "click",
    event=>{
        if(event.target===productModal){
            closeProductModal();
        }
    }
);


document.addEventListener(
    "keydown",
    event=>{
        if(event.key==="Escape"){
            closeProductModal();
        }
    }
);


/* ================================
   عرض منتجات القسم
================================ */

async function renderCategory(){

    categoriesView.style.display="none";

    productsView.style.display="block";


    const currentCategory =
    categories.find(category =>
        sameCategory(
            category.name,
            selectedCategory
        )
    );


    categoryTitle.textContent =
    currentCategory
        ? `${currentCategory.icon} ${currentCategory.name}`
        : `📂 ${selectedCategory}`;


    categorySubtitle.textContent =
    `جميع السلع المتاحة في قسم ${selectedCategory}.`;


    productsContainer.innerHTML=`
        <div class="loading-box">
            ⏳ جارٍ تحميل السلع...
        </div>
    `;


    const allProducts =
    await getProducts();


    const products =
    allProducts.filter(product =>
        sameCategory(
            product.category,
            selectedCategory
        )
    );


    if(!products.length){

        productsContainer.innerHTML=`
            <div class="empty-box">
                <div class="empty-icon">📭</div>

                <h3>
                    لا توجد سلع في هذا القسم حاليًا
                </h3>

                <p>
                    ستظهر السلع هنا تلقائيًا.
                </p>
            </div>
        `;

        return;

    }


    const grid =
    document.createElement("div");

    grid.className="products-grid";


    products.forEach(product=>{

        const card =
        document.createElement("article");

        card.className="product-card";


        const image =
        getMainImage(product);


        card.innerHTML=`

            <button
                type="button"
                class="product-image-button"
            >

                ${
                    image
                    ?
                    `
                    <img
                        src="${escapeHtml(image)}"
                        alt="${escapeHtml(product.title)}"
                        class="product-image"
                    >
                    `
                    :
                    `
                    <div class="product-image">
                        📦
                    </div>
                    `
                }

            </button>


            <div class="product-info">

                <h3>
                    ${escapeHtml(product.title)}
                </h3>

                ${
                    product.author
                    ?
                    `
                    <p>
                        ✍️ ${escapeHtml(product.author)}
                    </p>
                    `
                    :
                    ""
                }

                <p>
                    📂 ${escapeHtml(product.category)}
                </p>

                <p class="product-price">
                    ${Number(product.price||0).toLocaleString("ar-SA")}
                    ريال
                </p>

                ${
                    product.description
                    ?
                    `
                    <p>
                        ${escapeHtml(product.description)}
                    </p>
                    `
                    :
                    ""
                }

                <p class="available">
                    🟢 متوفر
                </p>

            </div>


            <button
                type="button"
                class="add-product-btn"
            >
                🛒 أضف إلى السلة
            </button>

        `;


        const imageButton =
        card.querySelector(
            ".product-image-button"
        );


        imageButton.addEventListener(
            "click",
            ()=>{
                openProductModal(product);
            }
        );


        const addButton =
        card.querySelector(
            ".add-product-btn"
        );


        addButton.addEventListener(
            "click",
            ()=>{
                addToCart(product);
            }
        );


        grid.appendChild(card);

    });


    productsContainer.appendChild(grid);

}


/* ================================
   تشغيل
================================ */

async function init(){

    if(selectedCategory){

        await renderCategory();

    }
    else{

        categoriesView.style.display="block";

        productsView.style.display="none";

        await renderCategories();

    }

}


init();

</script>

</body>
</html>
