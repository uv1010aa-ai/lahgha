/* =========================================
   حماية النص
========================================= */

function escapeHtml(value){

    return String(value ?? "")
        .replace(
            /[&<>"']/g,
            char => ({
                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#039;"
            }[char])
        );

}


/* =========================================
   الصور
========================================= */

function imageUrl(path){

    if(!path){
        return "";
    }


    let value =
        String(path).trim();


    if(
        /^https?:\/\//i.test(value) ||
        /^data:image\//i.test(value) ||
        /^blob:/i.test(value)
    ){

        return value;

    }


    return encodeURI(
        value.replace(
            /^\.\//,
            ""
        )
    );

}


function getProductImages(product){

    let result = [];


    if(product && product.image){

        result.push(
            product.image
        );

    }


    if(
        product &&
        Array.isArray(product.images)
    ){

        product.images.forEach(
            image => {

                if(
                    typeof image === "string" &&
                    image.trim()
                ){

                    result.push(
                        image
                    );

                }

            }
        );

    }


    return [
        ...new Set(
            result
                .filter(Boolean)
                .map(imageUrl)
                .filter(Boolean)
        )
    ];

}


function getMainImage(product){

    const images =
        getProductImages(product);

    return images[0] || "";

}


/* =========================================
   المخزون
========================================= */

/*
 * نعتبر quantity صالحًا عندما يكون رقمًا صحيحًا
 * وأكبر من أو يساوي صفر.
 *
 * المنتجات القديمة التي لا تحتوي quantity
 * تستمر بالعمل بالطريقة السابقة.
 */

function hasStockValue(product){

    const quantity =
        Number(
            product?.quantity
        );


    return Number.isInteger(quantity) &&
           quantity >= 0;

}


function getStock(product){

    if(!hasStockValue(product)){

        return null;

    }


    return Number(
        product.quantity
    );

}


/* =========================================
   توحيد القسم
========================================= */

function normalizeCategory(value){

    return String(value || "")
        .trim()
        .replace(/\s+/g," ")
        .replace(/^الكتب$/,"كتب")
        .replace(/^كتاب$/,"كتب")
        .replace(/^كتب وروايات$/,"كتب");

}


function sameCategory(a,b){

    return normalizeCategory(a) ===
           normalizeCategory(b);

}


/* =========================================
   تطبيع البحث
========================================= */

function normalizeSearch(value){

    return String(value || "")
        .toLowerCase()
        .trim()
        .replace(/\s+/g," ");

}


/* =========================================
   مطابقة البحث
========================================= */

function matchesSearch(product, query){

    const normalizedQuery =
        normalizeSearch(query);


    if(!normalizedQuery){
        return false;
    }


    const searchableText = [

        product.title,

        product.name,

        product.description,

        product.category,

        product.author

    ]
    .filter(Boolean)
    .map(normalizeSearch)
    .join(" ");


    return searchableText.includes(
        normalizedQuery
    );

}


/* =========================================
   تحميل books.json
========================================= */

async function loadBooks(){

    try{

        const response =
        await fetch(
            "books.json",
            {
                cache:"no-store"
            }
        );


        if(!response.ok){

            throw new Error(
                "books.json غير موجود"
            );

        }


        const data =
        await response.json();


        if(!Array.isArray(data)){
            return [];
        }


        return data

            .filter(product =>
                product &&
                product.available !== false
            )

            .map(product => ({

                ...product,

                source:"json"

            }));

    }
    catch(error){

        console.error(
            "خطأ books.json:",
            error
        );


        return [];

    }

}


/* =========================================
   تحميل منتجات Supabase
========================================= */

async function loadSupabaseProducts(){

    try{

        const {
            data,
            error
        } =
        await supabaseClient

            .from("products")

            .select("*")

            .eq(
                "available",
                true
            )

            .order(
                "id",
                {
                    ascending:false
                }
            );


        if(error){

            console.error(
                "Supabase:",
                error
            );

            return [];

        }


        return (data || [])

            .filter(product =>
                product &&
                product.title
            )

            .map(product => ({

                ...product,

                source:"supabase"

            }));

    }
    catch(error){

        console.error(
            "Supabase error:",
            error
        );

        return [];

    }

}


/* =========================================
   دمج المنتجات
========================================= */

async function getProducts(){

    const [
        books,
        supabaseProducts
    ] =
    await Promise.all([
        loadBooks(),
        loadSupabaseProducts()
    ]);


    const map =
        new Map();


    books.forEach(product => {

        map.set(
            "json-" + product.id,
            product
        );

    });


    supabaseProducts.forEach(product => {

        const same =
        [...map.values()].find(item =>

            String(item.id) ===
            String(product.id)

        );


        if(same){

            map.delete(
                "json-" + same.id
            );

        }


        map.set(
            "supabase-" + product.id,
            product
        );

    });


    return [...map.values()]
        .filter(product =>

            product &&
            product.title &&
            product.available !== false

        );

}


/* =========================================
   السلة
========================================= */

let cart = [];


try{

    const saved =
    JSON.parse(
        sessionStorage.getItem("cart") || "[]"
    );


    if(Array.isArray(saved)){

        cart = saved;

    }

}
catch{

    cart = [];

}


function saveCart(){

    try{

        if(!cart.length){

            sessionStorage.removeItem("cart");

            return;

        }


        sessionStorage.setItem(
            "cart",
            JSON.stringify(cart)
        );

    }
    catch(error){

        console.error(
            "تعذر حفظ السلة:",
            error
        );

        showToast(
            "تعذر حفظ السلة"
        );

    }

}


/* =========================================
   إضافة المنتج إلى السلة مع فحص المخزون
========================================= */

function addToCart(product){

    const stock =
        getStock(product);


    const existing =
    cart.find(item =>

        String(item.id) ===
        String(product.id)

    );


    const currentQuantity =
        existing
            ? Number(existing.quantity) || 0
            : 0;


    /*
     * إذا كان المنتج مرتبطًا بالمخزون
     * وكمية المخزون صفرًا
     */

    if(stock !== null && stock <= 0){

        showToast(
            "🔴 نفد مخزون هذا المنتج"
        );

        return false;

    }


    /*
     * منع تجاوز المخزون
     */

    if(
        stock !== null &&
        currentQuantity >= stock
    ){

        showToast(
            `⚠️ المتوفر فقط: ${stock} حبة`
        );

        return false;

    }


    if(existing){

        existing.quantity =
            currentQuantity + 1;


        /*
         * تحديث المخزون المحفوظ في السلة
         * ليستخدمه cart.html كحد أقصى.
         */

        if(stock !== null){

            existing.stock =
                stock;

        }

    }
    else{

        cart.push({

            id:product.id,

            title:product.title,

            price:
                Number(product.price) || 0,

            category:
                product.category || "",

            image:
                getMainImage(product),

            images:
                getProductImages(product),

            seller_id:
                product.seller_id || null,

            seller_name:
                product.seller_name || "",

            seller_request_id:
                product.seller_request_id || null,

            /*
             * المخزون الحقيقي للمنتج
             */

            stock:
                stock,

            quantity:1

        });

    }


    saveCart();


    showToast(
        `تمت إضافة «${product.title}» إلى السلة`
    );


    return true;

}


/* =========================================
   التنبيه
========================================= */

function showToast(message){

    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        showToast.timer
    );


    showToast.timer =
    setTimeout(
        () => {

            toast.classList.remove(
                "show"
            );

        },
        2200
    );

}

========================================= */

async function performNewSearch(query){

    const value =
        String(query || "").trim();


    if(!value){

        if(
            categoriesView.style.display !== "none"
        ){

            categoriesSearchInput.focus();

        }
        else{

            pageSearchInput.focus();

        }

        return;

    }


    searchQuery =
        value;

    selectedCategory =
        "";


    const newUrl =
        "categories.html?search=" +
        encodeURIComponent(
            value
        );


    window.history.pushState(
        {},
        "",
        newUrl
    );


    await renderSearch(
        value
    );

}


categoriesSearchForm.addEventListener(
    "submit",
    async event => {

        event.preventDefault();


        await performNewSearch(
            categoriesSearchInput.value
        );

    }
);


pageSearchForm.addEventListener(
    "submit",
    async event => {

        event.preventDefault();


        await performNewSearch(
            pageSearchInput.value
        );

    }
);


window.addEventListener(
    "popstate",
    () => {

        const currentParams =
            new URLSearchParams(
                window.location.search
            );


        selectedCategory =
            (
                currentParams.get("category") ||
                ""
            ).trim();


        searchQuery =
            (
                currentParams.get("search") ||
                ""
            ).trim();


        init();

    }
);


/* =========================================
   عرض الأقسام
========================================= */

async function renderCategories(){

    categoriesView.style.display =
        "block";

    productsView.style.display =
        "none";


    categoriesSearchInput.value =
        "";


    categoriesList.innerHTML = `

        <div class="loading-box">

            ⏳ جارٍ تحميل المنتجات...

        </div>

    `;


    const products =
        await getProducts();


    categoriesList.innerHTML =
        "";


    categories.forEach(
        category => {

            const count =
                products.filter(product =>

                    sameCategory(
                        product.category,
                        category.name
                    )

                ).length;


            const link =
                document.createElement(
                    "a"
                );


            link.className =
                "category-card";


            link.href =
                "categories.html?category=" +
                encodeURIComponent(
                    category.name
                );


            link.innerHTML = `

                <div class="category-icon">

                    ${category.icon}

                </div>

                <h3>

                    ${escapeHtml(
                        category.name
                    )}

                </h3>

                <p>

                    ${escapeHtml(
                        category.description
                    )}

                </p>

                <span class="category-count">

                    ${count} سلعة

                </span>

            `;


            categoriesList.appendChild(
                link
            );

        }
    );

}


/* =========================================
   نافذة المنتج
========================================= */

const productModal =
document.getElementById(
    "product-modal"
);

const modalClose =
document.getElementById(
    "modal-close"
);

const modalMainImage =
document.getElementById(
    "modal-main-image"
);

const modalThumbs =
document.getElementById(
    "modal-thumbs"
);

const modalInfo =
document.getElementById(
    "modal-info"
);


function openProductModal(product){

    const images =
        getProductImages(product);


    const stock =
        getStock(product);


    modalThumbs.innerHTML =
        "";


    if(images.length){

        modalMainImage.src =
            images[0];

        modalMainImage.alt =
            product.title;


        images.forEach(
            (image,index) => {

                const button =
                    document.createElement(
                        "button"
                    );


                button.type =
                    "button";


                button.className =
                    "modal-thumb" +
                    (
                        index === 0
                        ? " active"
                        : ""
                    );


                const img =
                    document.createElement(
                        "img"
                    );


                img.src =
                    image;


                img.alt =
                    `صورة ${index + 1}`;


                button.appendChild(
                    img
                );


                button.addEventListener(
                    "click",
                    () => {

                        modalMainImage.src =
                            image;


                        document
                            .querySelectorAll(
                                ".modal-thumb"
                            )
                            .forEach(
                                thumb =>
                                    thumb.classList.remove(
                                        "active"
                                    )
                            );


                        button.classList.add(
                            "active"
                        );

                    }
                );


                modalThumbs.appendChild(
                    button
                );

            }
        );

    }
    else{

        modalMainImage.src =
            "";

        modalMainImage.alt =
            "";

    }


    const stockAvailable =
        stock === null ||
        stock > 0;


    let stockHtml = "";


    if(stock !== null){

        if(stock <= 0){

            stockHtml = `

                <p class="modal-stock out-of-stock">

                    🔴 نفد المخزون

                </p>

            `;

        }
        else{

            stockHtml = `

                <p class="modal-stock available">

                    🟢 المتوفر: ${stock} حبة

                </p>

            `;

        }

    }


    modalInfo.innerHTML = `

        <h2>

            ${escapeHtml(
                product.title
            )}

        </h2>

        ${
            product.author
            ?
            `
            <p>

                ✍️

                ${escapeHtml(
                    product.author
                )}

            </p>
            `
            :
            ""
        }

        <p>

            📂

            ${escapeHtml(
                product.category ||
                "غير مصنفة"
            )}

        </p>

        <p class="product-price">

            ${Number(
                product.price || 0
            ).toLocaleString("ar-SA")}

            ريال

        </p>

        ${stockHtml}

        ${
            product.description
            ?
            `
            <p>

                ${escapeHtml(
                    product.description
                )}

            </p>
            `
            :
            ""
        }

        <button
            type="button"
            class="add-product-btn"
            id="modal-add-to-cart"
            style="margin-top:15px;"
            ${stock !== null && !stockAvailable ? "disabled" : ""}
        >

            ${
                stock !== null && !stockAvailable
                ? "🔴 نفد المخزون"
                : "🛒 أضف إلى السلة"
            }

        </button>

        <a
            href="cart.html"
            style="
                display:block;
                box-sizing:border-box;
                width:100%;
                text-align:center;
                text-decoration:none;
                background:#2e7d32;
                color:#fff;
                padding:13px;
                font-family:inherit;
                font-size:16px;
                font-weight:bold;
                margin-top:8px;
                border-radius:9px;
            "
        >

            🧺 الذهاب إلى السلة

        </a>

    `;


    const addButton =
        document.getElementById(
            "modal-add-to-cart"
        );


    if(addButton){

        addButton.addEventListener(
            "click",
            () => {

                const added =
                    addToCart(
                        product
                    );


                /*
                 * إذا تمت الإضافة بنجاح،
                 * نحدّث الزر إذا وصلنا للمخزون.
                 */

                if(
                    added &&
                    stock !== null
                ){

                    const existing =
                        cart.find(
                            item =>
                                String(item.id) ===
                                String(product.id)
                        );


                    const currentQuantity =
                        existing
                            ? Number(existing.quantity) || 0
                            : 0;


                    if(
                        currentQuantity >= stock
                    ){

                        addButton.disabled =
                            true;

                        addButton.textContent =
                            "📦 اكتملت الكمية المتوفرة";

                    }

                }

            }
        );

    }


    productModal.classList.add(
        "show"
    );

}


function closeProductModal(){

    productModal.classList.remove(
        "show"
    );

}


modalClose.addEventListener(
    "click",
    closeProductModal
);


productModal.addEventListener(
    "click",
    event => {

        if(
            event.target ===
            productModal
        ){

            closeProductModal();

        }

    }
);


document.addEventListener(
    "keydown",
    event => {

        if(
            event.key ===
            "Escape"
        ){

            closeProductModal();

        }

    }
);


/* =========================================
   إنشاء بطاقة المنتج
========================================= */

function createProductCard(product){

    const card =
        document.createElement(
            "article"
        );


    card.className =
        "product-card";


    const image =
        getMainImage(product);


    const stock =
        getStock(product);


    const hasStock =
        stock !== null;


    const outOfStock =
        hasStock &&
        stock <= 0;


    let stockText =
        "🟢 متوفر";


    let stockClass =
        "";


    if(hasStock){

        if(outOfStock){

            stockText =
                "🔴 نفد المخزون";

            stockClass =
                "out-of-stock";

        }
        else{

            stockText =
                `🟢 المتوفر: ${stock} حبة`;

            if(stock <= 3){

                stockClass =
                    "low-stock";

            }

        }

    }


    card.innerHTML = `

        <button
            type="button"
            class="product-image-button"
        >

            ${
                image
                ?
                `
                <img
                    src="${escapeHtml(image)}"
                    alt="${escapeHtml(product.title)}"
                    class="product-image"
                    loading="lazy"
                >
                `
                :
                `
                <div
                    class="product-image"
                    style="
                        display:flex;
                        align-items:center;
                        justify-content:center;
                        font-size:55px;
                    "
                >
                    📦
                </div>
                `
            }

        </button>


        <div class="product-info">

            <h3>

                ${escapeHtml(
                    product.title
                )}

            </h3>


            ${
                product.author
                ?
                `
                <p>

                    ✍️

                    ${escapeHtml(
                        product.author
                    )}

                </p>
                `
                :
                ""
            }


            <p>

                📂

                ${escapeHtml(
                    product.category ||
                    "غير مصنفة"
                )}

            </p>


            <p class="product-price">

                ${Number(
                    product.price || 0
                ).toLocaleString("ar-SA")}

                ريال

            </p>


            ${
                product.description
                ?
                `
                <p>

                    ${escapeHtml(
                        product.description
                    )}

                </p>
                `
                :
                ""
            }


            <p class="available ${stockClass}">

                ${stockText}

            </p>

        </div>


        <button
            type="button"
            class="add-product-btn"
            ${outOfStock ? "disabled" : ""}
        >

            ${
                outOfStock
                ? "🔴 نفد المخزون"
                : "🛒 أضف إلى السلة"
            }

        </button>


        <a
            href="cart.html"
            class="go-to-cart-btn"
            style="
                display:none;
                box-sizing:border-box;
                width:100%;
                text-align:center;
                text-decoration:none;
                background:#2e7d32;
                color:#fff;
                padding:13px;
                font-family:inherit;
                font-size:16px;
                font-weight:bold;
                margin-top:8px;
            "
        >

            🧺 الذهاب إلى السلة

        </a>

    `;


    const imageButton =
        card.querySelector(
            ".product-image-button"
        );


    imageButton.addEventListener(
        "click",
        () => {

            openProductModal(
                product
            );

        }
    );


    const addButton =
        card.querySelector(
            ".add-product-btn"
        );


    const goToCart =
        card.querySelector(
            ".go-to-cart-btn"
        );


    addButton.addEventListener(
        "click",
        () => {

            const added =
                addToCart(
                    product
                );


            if(
                added &&
                goToCart
            ){

                goToCart.style.display =
                    "block";

            }


            /*
             * إذا وصلت الكمية في السلة
             * إلى كامل المخزون، نعطّل زر الإضافة.
             */

            if(
                added &&
                stock !== null
            ){

                const existing =
                    cart.find(
                        item =>
                            String(item.id) ===
                            String(product.id)
                    );


                const currentQuantity =
                    existing
                        ? Number(existing.quantity) || 0
                        : 0;


                if(
                    currentQuantity >= stock
                ){

                    addButton.disabled =
                        true;

                    addButton.textContent =
                        "📦 اكتملت الكمية المتوفرة";

                }

            }

        }
    );


    return card;

}


/* =========================================
   عرض منتجات القسم
========================================= */

async function renderCategory(){

    categoriesView.style.display =
        "none";

    productsView.style.display =
        "block";


    pageSearchInput.value =
        "";


    backLink.href =
        "categories.html";


    backLink.textContent =
        "← العودة للأقسام";


    const currentCategory =
        categories.find(
            category =>

                sameCategory(
                    category.name,
                    selectedCategory
                )

        );


    categoryTitle.textContent =
        currentCategory
        ?
        `${currentCategory.icon} ${currentCategory.name}`
        :
        `📂 ${selectedCategory}`;


    categorySubtitle.textContent =
        `جميع السلع المتاحة في قسم ${selectedCategory}.`;


    productsContainer.innerHTML = `

        <div class="loading-box">

            ⏳ جارٍ تحميل السلع...

        </div>

    `;


    const allProducts =
        await getProducts();


    const products =
        allProducts.filter(
            product =>

                sameCategory(
                    product.category,
                    selectedCategory
                )

        );


    if(!products.length){

        productsContainer.innerHTML = `

            <div class="empty-box">

                <div class="empty-icon">
                    📭
                </div>

                <h3>

                    لا توجد سلع في هذا القسم حاليًا

                </h3>

                <p>

                    ستظهر السلع هنا تلقائيًا.

                </p>

            </div>

        `;

        return;

    }


    const grid =
        document.createElement(
            "div"
        );


    grid.className =
        "products-grid";


    products.forEach(
        product => {

            grid.appendChild(
                createProductCard(
                    product
                )
            );

        }
    );


    productsContainer.appendChild(
        grid
    );

}


/* =========================================
   عرض نتائج البحث
========================================= */

async function renderSearch(
    query = searchQuery
){

    categoriesView.style.display =
        "none";

    productsView.style.display =
        "block";


    pageSearchInput.value =
        query;


    backLink.href =
        "index.html";


    backLink.textContent =
        "← العودة للرئيسية";


    categoryTitle.textContent =
        "🔍 نتائج البحث";


    categorySubtitle.innerHTML = `

        نتائج البحث عن:

        <span class="search-result-note">

            «${escapeHtml(query)}»

        </span>

    `;


    productsContainer.innerHTML = `

        <div class="loading-box">

            ⏳ جارٍ البحث عن السلع...

        </div>

    `;


    const allProducts =
        await getProducts();


    const products =
        allProducts.filter(
            product =>

                matchesSearch(
                    product,
                    query
                )

        );


    if(!products.length){

        productsContainer.innerHTML = `

            <div class="empty-box">

                <div class="empty-icon">
                    🔎
                </div>

                <h3>

                    لم نجد نتائج مطابقة

                </h3>

                <p>

                    لم نجد سلعًا تطابق بحثك عن

                    «${escapeHtml(query)}».

                    <br>

                    جرّب كلمة أخرى من مربع البحث أعلاه.

                </p>

            </div>

        `;

        pageSearchInput.focus();

        return;

    }


    const grid =
        document.createElement(
            "div"
        );


    grid.className =
        "products-grid";


    products.forEach(
        product => {

            grid.appendChild(
                createProductCard(
                    product
                )
            );

        }
    );


    productsContainer.appendChild(
        grid
    );

}


/* =========================================
   التشغيل
========================================= */

async function init(){

    const currentParams =
        new URLSearchParams(
            window.location.search
        );


    selectedCategory =
        (
            currentParams.get("category") ||
            ""
        ).trim();


    searchQuery =
        (
            currentParams.get("search") ||
            ""
        ).trim();


    if(searchQuery){

        await renderSearch(
            searchQuery
        );

        return;

    }


    if(selectedCategory){

        await renderCategory();

        return;

    }


    categoriesView.style.display =
        "block";

    productsView.style.display =
        "none";


    await renderCategories();

}


init();

</script>
