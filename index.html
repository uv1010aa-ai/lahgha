<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="لَحْقها — سوق إلكتروني لعرض وشراء السلع بسهولة وأمان.">
    <title>لَحْقها 🛍️ | الرئيسية</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://jsdelivr.net"></script>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="images/icon.png">
    <link rel="apple-touch-icon" href="images/icon.png">

    <style>
        body {
            background: #f5f7fa;
        }

        .home-page {
            width: min(1180px, calc(100% - 30px));
            margin: 0 auto;
            padding: 35px 0 90px;
        }

        /* =========================================
           البطل الرئيسي
        ========================================= */
        .main-hero {
            position: relative;
            overflow: hidden;
            min-height: 390px;
            display: flex;
            align-items: center;
            border-radius: 28px;
            padding: 55px;
            margin-bottom: 35px;
            background: linear-gradient(135deg, #173a63 0%, #285784 55%, #34709b 100% );
            box-shadow: 0 18px 45px rgba(25, 55, 85, .18);
            color: #fff;
        }

        .main-hero::before,
        .main-hero::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,255,.05);
        }

        .main-hero::before {
            width: 420px;
            height: 420px;
            left: -120px;
            bottom: -190px;
        }

        .main-hero::after {
            width: 200px;
            height: 200px;
            right: -90px;
            top: -120px;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 760px;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 15px;
            border-radius: 30px;
            background: rgba(255,255,255,.12);
            border: 1px solid rgba(255,255,255,.18);
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 18px;
        }

        .hero-badge span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #63d471;
            display: inline-block;
        }

        .main-hero h2 {
            margin: 0 0 18px;
            font-size: clamp(34px, 5vw, 58px);
            line-height: 1.2;
            font-weight: 900;
            color: #fff;
        }

        .main-hero h2 strong {
            color: #dceeff;
        }

        .hero-description {
            margin: 0;
            max-width: 650px;
            color: rgba(255,255,255,.9);
            font-size: 19px;
            line-height: 1.9;
        }

        /* =========================================
           البحث
        ========================================= */
        .home-search {
            display: flex;
            gap: 10px;
            width: min(720px, 100%);
            margin-top: 24px;
        }

        .home-search input {
            flex: 1;
            min-width: 0;
            height: 56px;
            padding: 0 18px;
            border: 0;
            border-radius: 13px;
            background: #fff;
            color: #26384b;
            font-family: inherit;
            font-size: 16px;
            outline: none;
            box-shadow: 0 8px 22px rgba(0,0,0,.10);
        }

        .home-search input::placeholder {
            color: #7b8794;
        }

        .home-search input:focus {
            box-shadow: 0 0 0 3px rgba(255,255,255,.25), 0 8px 22px rgba(0,0,0,.12);
        }

        .home-search button {
            flex-shrink: 0;
            height: 56px;
            padding: 0 24px;
            border: 0;
            border-radius: 13px;
            background: #fff;
            color: #173a63;
            font-family: inherit;
            font-size: 16px;
            font-weight: 900;
            cursor: pointer;
            transition: .2s;
            box-shadow: 0 8px 22px rgba(0,0,0,.10);
        }

        .home-search button:hover {
            transform: translateY(-2px);
        }

        /* =========================================
           الأقسام والمنتجات
        ========================================= */
        .home-section {
            margin-bottom: 55px;
        }

        .section-heading {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 22px;
        }

        .section-heading-text h2 {
            margin: 0 0 7px;
            color: #173a63;
            font-size: 28px;
            font-weight: 900;
        }

        .section-heading-text p {
            margin: 0;
            color: #687585;
            font-size: 15px;
        }

        .home-products {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 20px;
        }

        .home-product-card {
            background: #fff;
            border: 1px solid #e4e9ee;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 6px 22px rgba(30,55,80,.06);
            transition: .2s;
        }

        .home-product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(30,55,80,.11);
        }

        .home-product-image {
            width: 100%;
            height: 210px;
            object-fit: cover;
            display: block;
            background: #eef2f5;
        }

        .home-product-info {
            padding: 17px;
        }

        .home-product-info h3 {
            margin: 0 0 9px;
            color: #26384b;
            font-size: 18px;
            line-height: 1.5;
        }

        .home-product-category {
            color: #74808d;
            font-size: 13px;
            margin: 0 0 10px;
        }

        .home-product-price {
            margin: 0;
            color: #173a63;
            font-size: 19px;
            font-weight: 900;
        }

        /* =========================================
           إضافات المخزون المتوافقة مع حقل quantity 📦
        ========================================= */
        .product-stock-status {
            font-size: 13px;
            font-weight: bold;
            margin-top: 8px;
            display: block;
        }
        .in-stock { color: #2e7d32; }
        .out-of-stock { color: #d32f2f; }

        .home-add-to-cart {
            width: 100%;
            margin-top: 14px;
            padding: 12px 15px;
            border: 0;
            border-radius: 10px;
            background: #173a63;
            color: #fff;
            font-family: inherit;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            transition: .2s;
        }

        .home-add-to-cart:hover:not(:disabled) {
            background: #285784;
            transform: translateY(-1px);
        }

        .home-add-to-cart:disabled {
            background: #ccc !important;
            cursor: not-allowed;
            transform: none !important;
        }
    </style>
</head>

<body>

    <div class="home-page">
        <section class="main-hero">
            <div class="hero-content">
                <div class="hero-badge"><span></span> شفتها؟ لَحْقها قبل تروح!</div>
                <h2>سوق <strong>لَحْقها 🛍️</strong></h2>
                <p class="hero-description">اكتشف السلع المميزة والمعتمدة، وتصفح المنتجات بسهولة من مكان واحد.</p>
                <div class="home-search">
                    <input type="text" id="searchInput" placeholder="ابحث عن منتج...">
                    <button onclick="searchProducts()">بحث</button>
                </div>
            </div>
        </section>

        <section class="home-section">
            <div class="section-heading">
                <div class="section-heading-text">
                    <h2>أحدث السلع</h2>
                    <p>آخر المنتجات التي تمت إضافتها إلى لَحْقها</p>
                </div>
            </div>

            <!-- حاوية عرض المنتجات تلقائياً -->
            <div class="home-products" id="productsContainer">
                <p>جاري تحميل السلع...</p>
            </div>
        </section>
    </div>

    <!-- =========================================
       كود التشغيل والربط بـ Supabase تلقائياً باستخدام حقل quantity
    ========================================= -->
    <script>
        // 1. إعداد الاتصال بـ Supabase (ضع مفاتيحك الخاصة هنا لتفعيلها فوراً)
        const SUPABASE_URL = "YOUR_SUPABASE_URL";
        const SUPABASE_KEY = "YOUR_SUPABASE_ANON_KEY";
        const supabase = bootstrapSupabase();

        function bootstrapSupabase() {
            if(SUPABASE_URL !== "YOUR_SUPABASE_URL") {
                return supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            }
            return null;
        }

        // 2. دالة جلب وعرض المنتجات مع فحص المخزون
        async function loadProducts() {
            const container = document.getElementById('productsContainer');
            if (!supabase) {
                container.innerHTML = '<p style="text-align:center; padding:20px;">يرجى وضع روابط الـ Supabase الخاصة بموقعك ليعمل سحب السلع وتتبع المخزون.</p>';
                return;
            }

            const { data: products, error } = await supabase
                .from('products')
                .select('*');

            if (error || !products) {
                container.innerHTML = '<p>حدث خطأ أثناء تحميل السلع.</p>';
                return;
            }

            container.innerHTML = '';
            products.forEach(product => {
