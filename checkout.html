<script>

/* =====================================================
   Supabase
===================================================== */

const SUPABASE_URL =
    "https://gyyyzavjzvcxzgrtukqu.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_Rj6F5Fp2tHJSWzbRRdLVZQ_8D5wL8p-";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   السلة
===================================================== */

let cart = [];


try {

    cart =
        JSON.parse(
            localStorage.getItem("cart") || "[]"
        );

    if (!Array.isArray(cart)) {
        cart = [];
    }

}
catch {

    cart = [];

}


/* =====================================================
   العناصر
===================================================== */

const productsContainer =
    document.getElementById("products");

const totalCount =
    document.getElementById("totalCount");

const totalPrice =
    document.getElementById("totalPrice");

const form =
    document.getElementById("checkoutForm");

const submitButton =
    document.getElementById("submitButton");

const message =
    document.getElementById("message");

const paymentMethod =
    document.getElementById("paymentMethod");

const bankBox =
    document.getElementById("bankBox");


/* =====================================================
   حماية النصوص
===================================================== */

function escapeHtml(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


/* =====================================================
   الصورة
===================================================== */

function getImage(item) {

    const candidates = [

        item?.image,
        item?.image_url,
        item?.imageUrl,
        item?.productImage,
        item?.photo

    ];


    for (const value of candidates) {

        if (
            value &&
            String(value).trim()
        ) {

            return String(value).trim();

        }

    }


    return "";

}


/* =====================================================
   تجهيز المنتجات
===================================================== */

function prepareProducts() {

    return cart.map(item => {

        const price =
            Number(
                item.price
            ) || 0;


        const quantity =
            Math.max(
                1,
                Number(
                    item.quantity
                ) || 1
            );


        const name =
            item.title ||
            item.name ||
            item.product_name ||
            "منتج";


        const productId =
            item.id ||
            item.product_id ||
            "";


        const category =
            item.category ||
            item.product_category ||
            "—";


        const image =
            getImage(item);


        const subtotal =
            Number(
                (
                    price *
                    quantity
                ).toFixed(2)
            );


        return {

            product_id:
                String(productId),

            name:
                name,

            category:
                category,

            image:
                image,

            price:
                price,

            quantity:
                quantity,

            subtotal:
                subtotal,

            seller_request_id:
                item.seller_request_id ||
                item.sellerRequestId ||
                null

        };

    });

}


/* =====================================================
   جلب seller_request_id من products
===================================================== */

async function attachSellerRequestIds(
    products
) {

    const productIds =
        [
            ...new Set(
                products
                    .map(
                        product =>
                            String(
                                product.product_id || ""
                            ).trim()
                    )
                    .filter(Boolean)
            )
        ];


    if (!productIds.length) {

        return products;

    }


    const {
        data,
        error
    } =
        await supabaseClient
            .from("products")
            .select(
                "id, seller_request_id"
            )
            .in(
                "id",
                productIds
            );


    if (error) {

        console.error(
            "Product relation error:",
            error
        );

        throw error;

    }


    const relationMap =
        new Map();


    (data || []).forEach(
        row => {

            relationMap.set(
                String(row.id),
                row.seller_request_id
                    ? String(
                        row.seller_request_id
                    )
                    : null
            );

        }
    );


    return products.map(
        product => {

            const sellerRequestId =
                relationMap.get(
                    String(
                        product.product_id
                    )
                );


            return {

                ...product,

                seller_request_id:
                    sellerRequestId ||
                    product.seller_request_id ||
                    null

            };

        }
    );

}


/* =====================================================
   التحقق من ربط المنتجات
===================================================== */

function validateSellerLinks(
    products
) {

    const missing =
        products.filter(
            product =>
                !product.seller_request_id
        );


    if (missing.length) {

        return false;

    }


    return true;

}


/* =====================================================
   عرض المنتجات
===================================================== */

function renderProducts() {

    const products =
        prepareProducts();


    productsContainer.innerHTML =
        "";


    if (!products.length) {

        productsContainer.innerHTML = `

            <div class="empty">
                ⚠️ السلة فارغة.
            </div>

        `;


        submitButton.disabled =
            true;


        return;

    }


    products.forEach(
        product => {

            const image =
                product.image;


            const imageHtml =
                image

                    ?

                    `

                        <img
                            class="product-image"
                            src="${escapeHtml(image)}"
                            alt="${escapeHtml(product.name)}"
                            onerror="this.style.display='none';"
                        >

                    `

                    :

                    `

                        <div
                            class="product-image"
                            style="
                                display:flex;
                                align-items:center;
                                justify-content:center;
                                font-size:45px;
                            "
                        >
                            📦
                        </div>

                    `;


            productsContainer.insertAdjacentHTML(
                "beforeend",
                `

                    <article class="product">

                        ${imageHtml}

                        <div class="product-info">

                            <h3>
                                ${escapeHtml(product.name)}
                            </h3>


                            <p class="code">

                                🔢 كود المنتج:

                                ${escapeHtml(
                                    product.product_id || "—"
                                )}

                            </p>


                            <p class="category">

                                📂 القسم:

                                ${escapeHtml(
                                    product.category
                                )}

                            </p>


                            <p class="quantity">

                                🔢 الكمية:

                                ${product.quantity}

                            </p>


                            <p class="price">

                                💰 سعر الوحدة:

                                ${product.price.toFixed(2)}
                                ريال

                            </p>


                            <div class="subtotal">

                                إجمالي المنتج:

                                ${product.subtotal.toFixed(2)}
                                ريال

                            </div>

                        </div>

                    </article>

                `
            );

        }
    );

}


/* =====================================================
   الملخص
===================================================== */

function updateSummary() {

    const products =
        prepareProducts();


    let count = 0;

    let total = 0;


    products.forEach(
        product => {

            count +=
                product.quantity;

            total +=
                product.subtotal;

        }
    );


    totalCount.textContent =
        count;


    totalPrice.textContent =
        total.toFixed(2) +
        " ريال";

}


/* =====================================================
   الدفع
===================================================== */

paymentMethod.addEventListener(
    "change",
    () => {

        bankBox.style.display =
            paymentMethod.value ===
            "تحويل بنكي"
                ? "block"
                : "none";

    }
);


/* =====================================================
   إرسال الطلب
===================================================== */

form.addEventListener(
    "submit",
    async event => {

        event.preventDefault();


        if (!cart.length) {

            showMessage(
                "❌ السلة فارغة.",
                "error"
            );

            return;

        }


        const buyerName =
            document
                .getElementById("buyerName")
                .value
                .trim();


        const buyerPhone =
            document
                .getElementById("buyerPhone")
                .value
                .trim();


        const buyerAddress =
            document
                .getElementById("buyerAddress")
                .value
                .trim();


        const selectedPayment =
            paymentMethod.value;


        if (!buyerName) {

            showMessage(
                "❌ اكتب الاسم الكامل.",
                "error"
            );

            return;

        }


        if (!buyerPhone) {

            showMessage(
                "❌ اكتب رقم الجوال.",
                "error"
            );

            return;

        }


        if (!buyerAddress) {

            showMessage(
                "❌ اكتب العنوان.",
                "error"
            );

            return;

        }


        submitButton.disabled =
            true;

        submitButton.textContent =
            "⏳ جاري تجهيز الطلب...";


        try {

            let products =
                prepareProducts();


            /*
             * نأخذ الربط من جدول products
             * بدل قراءة seller_requests من الصفحة العامة.
             */

            products =
                await attachSellerRequestIds(
                    products
                );


            /*
             * يجب أن يكون كل منتج معتمد
             * مرتبطًا بطلب بائع.
             */

            if (
                !validateSellerLinks(
                    products
                )
            ) {

                throw new Error(
                    "هناك منتج في السلة غير مرتبط ببائع معتمد."
                );

            }


            let total = 0;


            products.forEach(
                product => {

                    total +=
                        Number(
                            product.subtotal || 0
                        );

                }
            );


            const orderNumber =
                "ORD-" +
                Date.now();


            /*
             * حفظ الطلب.
             *
             * بيانات البائع لا تظهر للمشتري.
             * seller_request_id موجود داخل items
             * لاستخدامه لاحقًا من لوحة التحكم.
             */

            const orderData = {

                order_number:
                    orderNumber,

                buyer_name:
                    buyerName,

                buyer_phone:
                    buyerPhone,

                buyer_address:
                    buyerAddress,

                payment_method:
                    selectedPayment,

                items:
                    products,

                total:
                    Number(
                        total.toFixed(2)
                    ),

                status:
                    "pending"

            };


            const {
                data,
                error
            } =
                await supabaseClient
                    .from("orders")
                    .insert(
                        [orderData]
                    )
                    .select()
                    .single();


            if (error) {

                console.error(
                    "Supabase order error:",
                    error
                );

                throw error;

            }


            console.log(
                "Order created:",
                data
            );


            localStorage.removeItem(
                "cart"
            );

            cart = [];


            showMessage(
                "✅ تم إرسال طلبك بنجاح. رقم الطلب: " +
                orderNumber,
                "success"
            );


            submitButton.textContent =
                "✅ تم إرسال الطلب";


            form
                .querySelectorAll(
                    "input, textarea, select"
                )
                .forEach(
                    element => {

                        element.disabled =
                            true;

                    }
                );


            renderProducts();

            updateSummary();

        }
        catch (error) {

            console.error(
                "Order submission error:",
                error
            );


            let errorText =
                "❌ تعذر إرسال الطلب.";


            if (
                error &&
                error.code === "42501"
            ) {

                errorText =
                    "❌ لا توجد صلاحية لإضافة الطلب في Supabase.";

            }
            else if (
                error &&
                error.code === "23505"
            ) {

                errorText =
                    "❌ رقم الطلب مكرر.";

            }
            else if (
                error &&
                error.message
            ) {

                errorText +=
                    " " +
                    error.message;

            }


            showMessage(
                errorText,
                "error"
            );


            submitButton.disabled =
                false;

            submitButton.textContent =
                "✅ تأكيد وإرسال الطلب";

        }

    }
);


/* =====================================================
   الرسائل
===================================================== */

function showMessage(
    text,
    type
) {

    message.textContent =
        text;

    message.className =
        type;

}


/* =====================================================
   التشغيل الأولي
===================================================== */

renderProducts();

updateSummary();

</script>


</body>

</html>
