<script>

/* =====================================================

const SUPABASE_URL =

const SUPABASE_KEY =

const supabaseClient =
    window.supabase.createClient(

    );


/* =====================================================
   السلة
===================================================== */

let cart = [];


try {

    cart =
        JSON.parse(
            localStorage.getItem("cart") || "[]"
        );

    if (!Array.isArray(cart)) {
        cart = [];
    }

}
catch {

    cart = [];

/* =====================================================
   العناصر
===================================================== */

const productsContainer =
    document.getElementById("products");

const totalCount =
    document.getElementById("totalCount");

const totalPrice =
    document.getElementById("totalPrice");

const form =
    document.getElementById("checkoutForm");

const submitButton =
    document.getElementById("submitButton");

const message =
    document.getElementById("message");

const paymentMethod =
    document.getElementById("paymentMethod");

const bankBox =
    document.getElementById("bankBox");


const buyerNameInput =
    document.getElementById("buyerName");

const buyerPhoneInput =
    document.getElementById("buyerPhone");

const buyerAddressInput =
    document.getElementById("buyerAddress");


const buyerNameError =
    document.getElementById("buyerNameError");

const buyerPhoneError =
    document.getElementById("buyerPhoneError");

const buyerAddressError =
    document.getElementById("buyerAddressError");


/* =====================================================
   حماية النصوص
===================================================== */

function escapeHtml(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


/* =====================================================
   الصورة
===================================================== */

function getImage(item) {

    const candidates = [

        item?.image,
        item?.image_url,
        item?.imageUrl,
        item?.productImage,
        item?.photo

    ];


    for (const value of candidates) {

        if (
            value &&
            String(value).trim()
        ) {

            return String(value).trim();

        }

    }


    return "";

}


/* =====================================================
   تحويل الأرقام العربية
===================================================== */

function normalizeArabicNumbers(value) {

    return String(value || "")
        .replace(/[٠-٩]/g, digit =>
            String(
                "٠١٢٣٤٥٦٧٨٩"
                    .indexOf(digit)
            )
        )
        .replace(/[۰-۹]/g, digit =>
            String(
                "۰۱۲۳۴۵۶۷۸۹"
                    .indexOf(digit)
            )
        );

}


/* =====================================================
   تنظيف رقم الجوال
===================================================== */

function normalizePhone(value) {

    let phone =
        normalizeArabicNumbers(value)
            .trim()
            .replace(/[\s\-()]/g, "");


    if (phone.startsWith("+9665")) {

        phone =
            "0" +
            phone.substring(4);

    }

    else if (phone.startsWith("9665")) {

        phone =
            "0" +
            phone.substring(3);

    }


    return phone;

}


/* =====================================================
   رسائل التحقق
===================================================== */

function setFieldError(
    input,
    errorElement,
    text
) {

    input.classList.remove("valid");

    input.classList.add("invalid");

    errorElement.textContent =
        text;

    errorElement.style.display =
        "block";

}


function setFieldValid(
    input,
    errorElement
) {

    input.classList.remove("invalid");

    input.classList.add("valid");

    errorElement.textContent =
        "";

    errorElement.style.display =
        "none";

}


/* =====================================================
   التحقق من الاسم
===================================================== */

function validateBuyerName() {

    const value =
        buyerNameInput.value.trim();


    if (!value) {

        setFieldError(
            buyerNameInput,
            buyerNameError,
            "❌ اكتب الاسم الكامل."
        );

        return false;

    }


    if (value.length < 3) {

        setFieldError(
            buyerNameInput,
            buyerNameError,
            "❌ الاسم يجب أن يكون 3 أحرف على الأقل."
        );

        return false;

    }


    const namePattern =
        /^[\u0600-\u06FFa-zA-Z\s]+$/;


    if (!namePattern.test(value)) {

        setFieldError(
            buyerNameInput,
            buyerNameError,
            "❌ الاسم يحتوي على معلومات غير صحيحة."
        );

        return false;

    }


    setFieldValid(
        buyerNameInput,
        buyerNameError
    );

    return true;

}


/* =====================================================
   التحقق من الجوال السعودي
===================================================== */

function validateBuyerPhone() {

    const value =
        buyerPhoneInput.value.trim();


    if (!value) {

        setFieldError(
            buyerPhoneInput,
            buyerPhoneError,
            "❌ اكتب رقم الجوال."
        );

        return false;

    }


    const phone =
        normalizePhone(value);


    /*
     * الصيغة المعتمدة:
     *
     * 05xxxxxxxx
     *
     * 10 أرقام ويبدأ بـ 05
     */

    const phonePattern =
        /^05\d{8}$/;


    if (!phonePattern.test(phone)) {

        setFieldError(
            buyerPhoneInput,
            buyerPhoneError,
            "❌ رقم الجوال غير صحيح. مثال: 05xxxxxxxx"
        );

        return false;

    }


    buyerPhoneInput.value =
        phone;


    setFieldValid(
        buyerPhoneInput,
        buyerPhoneError
    );

    return true;

}


/* =====================================================
   التحقق من العنوان
===================================================== */

function validateBuyerAddress() {

    const value =
        buyerAddressInput.value.trim();


    if (!value) {

        setFieldError(
            buyerAddressInput,
            buyerAddressError,
            "❌ اكتب عنوان التوصيل."
        );

        return false;

    }


    if (value.length < 5) {

        setFieldError(
            buyerAddressInput,
            buyerAddressError,
            "❌ العنوان قصير جدًا."
        );

        return false;

    }


    setFieldValid(
        buyerAddressInput,
        buyerAddressError
    );

    return true;

}


/* =====================================================
   التحقق أثناء الكتابة
===================================================== */

buyerNameInput.addEventListener(
    "input",
    () => {

        validateBuyerName();

    }

buyerPhoneInput.addEventListener(
    "input",

        validateBuyerPhone();

    }

buyerAddressInput.addEventListener(
    "input",
    () => {

        validateBuyerAddress();

/* =====================================================
   تجهيز المنتجات
===================================================== */

function prepareProducts() {

    return cart.map(item => {

        const price =
            Number(
                item.price
            ) || 0;


        const quantity =
            Math.max(
                1,
                Number(
                    item.quantity
                ) || 1
            );


        const name =
            item.title ||
            item.name ||
            item.product_name ||
            "منتج";


        const productId =
            item.id ||
            item.product_id ||
            "";


        const category =
            item.category ||
            item.product_category ||
            "—";


        const image =
            getImage(item);


        const subtotal =
            Number(
                (
                    price *
                    quantity
                ).toFixed(2)
            );


        return {

            product_id:
                String(productId),

            name:
                name,

            category:
                category,

            image:
                image,

            price:
                price,

            quantity:
                quantity,

            subtotal:
                subtotal,

            seller_request_id:
                item.seller_request_id ||
                item.sellerRequestId ||
                null

        };

    });

}


/* =====================================================
   جلب seller_request_id
===================================================== */

async function attachSellerRequestIds(
    products
) {

    const productIds =
        [
            ...new Set(
                products
                    .map(
                        product =>
                            String(
                                product.product_id || ""
                            ).trim()
                    )
                    .filter(Boolean)
            )
        ];


    if (!productIds.length) {

        return products;

    }


    const {
        data,
        error
    } =
        await supabaseClient
            .from("products")
            .select(
                "id, seller_request_id"
            )
            .in(
                "id",
                productIds
            );


    if (error) {

        console.error(
            "Product relation error:",
            error
        );

        throw error;

    }


    const relationMap =
        new Map();


    (data || []).forEach(
        row => {

            relationMap.set(
                String(row.id),
                row.seller_request_id
                    ? String(
                        row.seller_request_id
                    )
                    : null
            );

        }
    );


    return products.map(
        product => {

            const sellerRequestId =
                relationMap.get(
                    String(
                        product.product_id
                    )
                );


            return {

                ...product,

                seller_request_id:
                    sellerRequestId ||
                    product.seller_request_id ||
                    null

            };

        }
    );

}


/* =====================================================
   التحقق من ربط المنتجات
===================================================== */

function validateSellerLinks(
    products
) {

    const missing =
        products.filter(
            product =>
                !product.seller_request_id
        );


    return missing.length === 0;

}


/* =====================================================
   عرض المنتجات
===================================================== */

function renderProducts() {

    const products =
        prepareProducts();


    productsContainer.innerHTML =
        "";


    if (!products.length) {

        productsContainer.innerHTML = `

            <div class="empty">
                ⚠️ السلة فارغة.
            </div>

        `;


        submitButton.disabled =
            true;


        return;

    }


    products.forEach(
        product => {

            const image =
                product.image;


            const imageHtml =
                image

                    ?

                    `

                        <img
                            class="product-image"
                            src="${escapeHtml(image)}"
                            alt="${escapeHtml(product.name)}"
                            onerror="this.style.display='none';"
                        >

                    `

                    :

                    `

                        <div
                            class="product-image"
                            style="
                                display:flex;
                                align-items:center;
                                justify-content:center;
                                font-size:45px;
                            "
                        >
                            📦
                        </div>

                    `;


            productsContainer.insertAdjacentHTML(
                "beforeend",
                `

                    <article class="product">

                        ${imageHtml}

                        <div class="product-info">

                            <h3>
                                ${escapeHtml(product.name)}
                            </h3>


                            <p class="code">

                                🔢 كود المنتج:

                                ${escapeHtml(
                                    product.product_id || "—"
                                )}

                            </p>


                            <p class="category">

                                📂 القسم:

                                ${escapeHtml(
                                    product.category
                                )}

                            </p>


                            <p class="quantity">

                                🔢 الكمية:

                                ${product.quantity}

                            </p>


                            <p class="price">

                                💰 سعر الوحدة:

                                ${product.price.toFixed(2)}
                                ريال

                            </p>


                            <div class="subtotal">

                                إجمالي المنتج:

                                ${product.subtotal.toFixed(2)}
                                ريال

                            </div>

                        </div>

                    </article>

                `
            );

        }
    );

}


/* =====================================================
   الملخص
===================================================== */

function updateSummary() {

    const products =
        prepareProducts();


    let count = 0;

    let total = 0;


    products.forEach(
        product => {

            count +=
                product.quantity;

            total +=
                product.subtotal;

        }
    );


    totalCount.textContent =
        count;


    totalPrice.textContent =
        total.toFixed(2) +
        " ريال";

}

form.addEventListener(
    "submit",
    async event => {

        event.preventDefault();


        /* =========================
           التحقق من البيانات
        ========================== */

        const nameIsValid =
            validateBuyerName();

        const phoneIsValid =
            validateBuyerPhone();

        const addressIsValid =
            validateBuyerAddress();


        if (
            !nameIsValid ||
            !phoneIsValid ||
            !addressIsValid
        ) {

            showMessage(
                "❌ يرجى تصحيح البيانات قبل إرسال الطلب.",
                "error"
            );


            if (!nameIsValid) {

                buyerNameInput.focus();

            }
            else if (!phoneIsValid) {

                buyerPhoneInput.focus();

            }
            else if (!addressIsValid) {

                buyerAddressInput.focus();

            }


            return;

        }


        if (!cart.length) {

            showMessage(
                "❌ السلة فارغة.",
                "error"
            );

            return;

        }


        const buyerName =
            buyerNameInput.value.trim();

            buyerPhoneInput.value.trim();

            buyerAddressInput.value.trim();

            paymentMethod.value;

            true;

            "⏳ جاري تجهيز الطلب...";


        try {

            let products =
                prepareProducts();


            /*
             * أخذ seller_request_id
             * من جدول products
             */

            products =
                await attachSellerRequestIds(
                    products
                );


            if (
                !validateSellerLinks(
                    products
                )
            ) {

                throw new Error(
                    "هناك منتج في السلة غير مرتبط ببائع معتمد."
                );

            }


            let total = 0;


            products.forEach(
                product => {

                    total +=
                        Number(
                            product.subtotal || 0
                        );

                }
            );


            const orderNumber =
                "ORD-" +
                Date.now();


            const orderData = {

                order_number:
                    orderNumber,

                buyer_name:
                    buyerName,

                buyer_phone:
                    buyerPhone,

                buyer_address:
                    buyerAddress,

                payment_method:
                    selectedPayment,

                items:
                    products,

                total:
                    Number(
                        total.toFixed(2)
                    ),

                status:
                    "pending"

            };


            const {
                data,
                error
            } =
                await supabaseClient
                    .from("orders")
                    .insert(
                        [orderData]
                    )
                    .select()
                    .single();


            if (error) {

                console.error(
                    "Supabase order error:",
                    error
                );

                throw error;

            }


            console.log(
                "Order created:",
                data
            );


            /* =========================================
               تفريغ السلة بعد نجاح الطلب فقط
            ========================================= */

            try {

                localStorage.removeItem("cart");

                cart = [];


                /*
                 * التأكد من أن السلة حُذفت فعليًا
                 */

                if (
                    localStorage.getItem("cart") !== null
                ) {

                    localStorage.setItem(
                        "cart",
                        "[]"
                    );

                }

            }
            catch (storageError) {

                console.error(
                    "تعذر تفريغ السلة:",
                    storageError
                );

                cart = [];

            }


            showMessage(
                "✅ تم إرسال طلبك بنجاح. رقم الطلب: " +
                orderNumber,
                "success"
            );


            submitButton.textContent =
                "✅ تم إرسال الطلب";


            form
                .querySelectorAll(
                    "input, textarea, select"
                )
                .forEach(
                    element => {

                        element.disabled =
                            true;

                    }
                );


            renderProducts();

            updateSummary();

        }
        catch (error) {

            console.error(
                "Order submission error:",
                error
            );


            let errorText =
                "❌ تعذر إرسال الطلب.";


            if (
                error &&
                error.code === "42501"
            ) {

                errorText =
                    "❌ لا توجد صلاحية لإضافة الطلب في Supabase.";

            }
            else if (
                error &&
                error.code === "23505"
            ) {

                errorText =
                    "❌ رقم الطلب مكرر.";

            }
            else if (
                error &&
                error.message
            ) {

                /*
                 * لا نعرض تفاصيل تقنية
                 * للمستخدم.
                 */

                console.error(
                    error.message
                );

            }


            showMessage(
                errorText,
                "error"
            );


            submitButton.disabled =
                false;

            submitButton.textContent =
                "✅ تأكيد وإرسال الطلب";

        }

    }
);


/* =====================================================
   الرسائل
===================================================== */

function showMessage(
    text,
    type
) {

    message.textContent =
        text;

    message.className =
        type;

    message.style.display =
        "block";

}


/* =====================================================
   التشغيل الأولي
===================================================== */

renderProducts();

updateSummary();

</script>


</body>

</html>
