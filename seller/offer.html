commissionLabel.textContent =
  `عمولة الموقع (${COMMISSION_RATE * 100}%)`;


let selectedFiles = [];


/* =========================
   الرسائل
========================= */

function showMessage(message, type) {

  formMessage.textContent =
    message;

  formMessage.className =
    "message " + type;
}


function clearMessage() {

  formMessage.textContent =
    "";

  formMessage.className =
    "message";
}


/* =========================
   أخطاء الحقول
========================= */

function setFieldError(
  input,
  errorId,
  message
) {

  const errorElement =
    document.getElementById(errorId);

  if (message) {

    input.classList.add("invalid");

    input.classList.remove("valid");

    errorElement.textContent =
      message;

    return false;
  }

  input.classList.remove("invalid");

  input.classList.add("valid");

  errorElement.textContent =
    "";

  return true;
}


function clearFieldState(
  input,
  errorId
) {

  input.classList.remove("invalid");

  input.classList.remove("valid");

  const errorElement =
    document.getElementById(errorId);

  if (errorElement) {
    errorElement.textContent =
      "";
  }
}


/* =========================
   السعر والعمولة
========================= */

function updatePriceSummary() {

  const productPrice =
    parseFloat(price.value);

  if (
    !productPrice ||
    productPrice <= 0
  ) {

    resetPriceSummary();

    return;
  }


  const commission =
    productPrice *
    COMMISSION_RATE;


  const sellerAmount =
    productPrice -
    commission;


  salePriceDisplay.textContent =
    productPrice.toFixed(2) +
    " ريال";


  commissionDisplay.textContent =
    commission.toFixed(2) +
    " ريال";


  sellerAmountDisplay.textContent =
    sellerAmount.toFixed(2) +
    " ريال";


  priceSummary.classList.add(
    "show"
  );
}


function resetPriceSummary() {

  salePriceDisplay.textContent =
    "0.00 ريال";

  commissionDisplay.textContent =
    "0.00 ريال";

  sellerAmountDisplay.textContent =
    "0.00 ريال";

  priceSummary.classList.remove(
    "show"
  );
}


price.addEventListener(
  "input",
  updatePriceSummary
);


/* =========================
   التحقق من النموذج
========================= */

function validateForm() {

  let valid = true;


  const sellerNameValue =
    sellerName.value.trim();

  const sellerEmailValue =
    sellerEmail.value.trim();

  const phoneValue =
    phone.value.trim();

  const cityValue =
    city.value.trim();

  const categoryValue =
    category.value.trim();

  const productTitleValue =
    productTitle.value.trim();

  const priceValue =
    parseFloat(price.value);

  const descriptionValue =
    description.value.trim();


  /* اسم البائع */

  if (
    sellerNameValue.length < 2
  ) {

    setFieldError(
      sellerName,
      "sellerNameError",
      "يرجى إدخال اسم البائع."
    );

    valid = false;

  } else {

    setFieldError(
      sellerName,
      "sellerNameError",
      ""
    );
  }


  /* البريد */

  const emailPattern =
    /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

  if (
    !emailPattern.test(
      sellerEmailValue
    )
  ) {

    setFieldError(
      sellerEmail,
      "sellerEmailError",
      "يرجى إدخال بريد إلكتروني صحيح."
    );

    valid = false;

  } else {

    setFieldError(
      sellerEmail,
      "sellerEmailError",
      ""
    );
  }


  /* الجوال */

  const phonePattern =
    /^05\d{8}$/;

  if (
    !phonePattern.test(
      phoneValue
    )
  ) {

    setFieldError(
      phone,
      "phoneError",
      "يرجى إدخال رقم جوال صحيح مثل 05xxxxxxxx."
    );

    valid = false;

  } else {

    setFieldError(
      phone,
      "phoneError",
      ""
    );
  }


  /* المدينة */

  if (!cityValue) {

    setFieldError(
      city,
      "cityError",
      "يرجى اختيار المدينة."
    );

    valid = false;

  } else {

    setFieldError(
      city,
      "cityError",
      ""
    );
  }


  /* التصنيف */

  if (!categoryValue) {

    setFieldError(
      category,
      "categoryError",
      "يرجى اختيار تصنيف المنتج."
    );

    valid = false;

  } else {

    setFieldError(
      category,
      "categoryError",
      ""
    );
  }


  /* اسم المنتج */

  if (
    productTitleValue.length < 2
  ) {

    setFieldError(
      productTitle,
      "productTitleError",
      "يرجى إدخال اسم المنتج."
    );

    valid = false;

  } else {

    setFieldError(
      productTitle,
      "productTitleError",
      ""
    );
  }


  /* السعر */

  if (
    !priceValue ||
    priceValue <= 0
  ) {

    setFieldError(
      price,
      "priceError",
      "يرجى إدخال سعر صحيح."
    );

    valid = false;

  } else {

    setFieldError(
      price,
      "priceError",
      ""
    );
  }


  /* الوصف */

  if (
    descriptionValue.length < 10
  ) {

    setFieldError(
      description,
      "descriptionError",
      "يرجى كتابة وصف واضح للمنتج."
    );

    valid = false;

  } else {

    setFieldError(
      description,
      "descriptionError",
      ""
    );
  }


  /* الصور */

  if (
    selectedFiles.length === 0
  ) {

    document.getElementById(
      "productImageError"
    ).textContent =
      "يرجى اختيار صورة واحدة على الأقل.";

    valid = false;

  } else {

    document.getElementById(
      "productImageError"
    ).textContent =
      "";
  }


  /* الشروط */

  if (
    !agreeTerms.checked
  ) {

    document.getElementById(
      "agreeTermsError"
    ).textContent =
      "يجب الموافقة على الشروط قبل الإرسال.";

    valid = false;

  } else {

    document.getElementById(
      "agreeTermsError"
    ).textContent =
      "";
  }


  return valid;
}

/* =========================
   اسم آمن للصور
========================= */

function createSafeFileName(
  originalName
) {

  const extension =
    originalName.includes(".")
      ? originalName
          .split(".")
          .pop()
          .toLowerCase()
      : "webp";


  let randomPart;


  if (
    window.crypto &&
    crypto.randomUUID
  ) {

    randomPart =
      crypto.randomUUID();

  } else {

    randomPart =
      Date.now() +
      "-" +
      Math.random()
        .toString(36)
        .substring(2);
  }


  return (
    "product-" +
    randomPart +
    "." +
    extension
  );
}


/* =========================
   تحميل الصورة
========================= */

function loadImage(file) {

  return new Promise(
    (resolve, reject) => {

      const reader =
        new FileReader();


      reader.onload =
        function () {

          const img =
            new Image();


          img.onload =
            function () {

              resolve(img);
            };


          img.onerror =
            reject;


          img.src =
            reader.result;
        };


      reader.onerror =
        reject;


      reader.readAsDataURL(
        file
      );
    }
  );
}


/* =========================
   ضغط الصورة
========================= */

async function compressImage(
  file
) {

  const img =
    await loadImage(file);


  let width =
    img.width;

  let height =
    img.height;


  if (
    width > MAX_IMAGE_DIMENSION ||
    height > MAX_IMAGE_DIMENSION
  ) {

    if (width > height) {

      height =
        Math.round(
          height *
          MAX_IMAGE_DIMENSION /
          width
        );

      width =
        MAX_IMAGE_DIMENSION;

    } else {

      width =
        Math.round(
          width *
          MAX_IMAGE_DIMENSION /
          height
        );

      height =
        MAX_IMAGE_DIMENSION;
    }
  }


  const canvas =
    document.createElement(
      "canvas"
    );


  canvas.width =
    width;

  canvas.height =
    height;


  const ctx =
    canvas.getContext(
      "2d"
    );


  ctx.drawImage(
    img,
    0,
    0,
    width,
    height
  );


  let quality =
    INITIAL_IMAGE_QUALITY;


  let blob =
    await new Promise(
      resolve =>
        canvas.toBlob(
          resolve,
          "image/webp",
          quality
        )
    );


  while (
    blob &&
    blob.size > TARGET_IMAGE_SIZE &&
    quality > MIN_IMAGE_QUALITY
  ) {

    quality -=
      0.05;


    blob =
      await new Promise(
        resolve =>
          canvas.toBlob(
            resolve,
            "image/webp",
            quality
          )
      );
  }


  if (!blob) {

    throw new Error(
      "تعذر معالجة إحدى الصور."
    );
  }


  return new File(
    [blob],
    createSafeFileName(
      file.name
    ),
    {
      type: "image/webp"
    }
  );
}


/* =========================
   رفع الصورة
========================= */

async function uploadImage(
  file
) {

  const path =
    "seller-products/" +
    createSafeFileName(
      file.name
    );


  const response =
    await fetch(
      SUPABASE_URL +
      "/storage/v1/object/" +
      STORAGE_BUCKET +
      "/" +
      path,
      {
        method: "POST",

        headers: {

          "Authorization":
            "Bearer " +
            SUPABASE_KEY,

          "apikey":
            SUPABASE_KEY,

          "Content-Type":
            file.type,

          "x-upsert":
            "false"
        },

        body:
          file
      }
    );


  if (!response.ok) {

    let errorText =
      "فشل رفع الصورة.";


    try {

      const data =
        await response.json();


      if (data.message) {

        errorText =
          data.message;
      }

    } catch (error) {}


    throw new Error(
      errorText
    );
  }


  return (
    SUPABASE_URL +
    "/storage/v1/object/public/" +
    STORAGE_BUCKET +
    "/" +
    path
  );
}


/* =========================
   حذف الصور عند الخطأ
========================= */

async function deleteUploadedImages(
  imageUrls
) {

  for (
    const imageUrl of imageUrls
  ) {

    try {

      const marker =
        "/storage/v1/object/public/" +
        STORAGE_BUCKET +
        "/";


      const index =
        imageUrl.indexOf(
          marker
        );


      if (index === -1) {
        continue;
      }


      const path =
        imageUrl.substring(
          index +
          marker.length
        );


      await fetch(
        SUPABASE_URL +
        "/storage/v1/object/" +
        STORAGE_BUCKET +
        "/" +
        path,
        {
          method: "DELETE",

          headers: {

            "Authorization":
              "Bearer " +
              SUPABASE_KEY,

            "apikey":
              SUPABASE_KEY
          }
        }
      );

    } catch (error) {

      console.error(
        "تعذر حذف الصورة:",
        error
      );
    }
  }
}


/* =========================
   إرسال الطلب إلى Supabase
========================= */

async function submitSellerRequest(
  data
) {

  const response =
    await fetch(
      SUPABASE_URL +
      "/rest/v1/seller_requests",
      {
        method: "POST",

        headers: {

          "Authorization":
            "Bearer " +
            SUPABASE_KEY,

          "apikey":
            SUPABASE_KEY,

          "Content-Type":
            "application/json",

          "Prefer":
            "return=minimal"
        },

        body:
          JSON.stringify(data)
      }
    );


  if (!response.ok) {

    let message =
      "تعذر إرسال طلبك.";


    try {

      const errorData =
        await response.json();


      if (
        errorData.message
      ) {

        message =
          errorData.message;
      }

    } catch (error) {}


    throw new Error(
      message
    );
  }
}

========================= */

sellerForm.addEventListener(

      );
