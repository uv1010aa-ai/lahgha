<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>إضافة منتج - لَحْقها 🛍️</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 18px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 26px;
    }

    .container {
      width: 100%;
      max-width: 700px;
      margin: 30px auto;
      padding: 0 15px;
    }

    .form-box {
      background: white;
      border-radius: 14px;
      padding: 25px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
    }

    .form-box h2 {
      margin-top: 0;
      text-align: center;
    }

    .intro {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
      line-height: 1.7;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 9px;
      font-size: 16px;
      outline: none;
      background: white;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #111;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    input.invalid,
    select.invalid,
    textarea.invalid {
      border: 2px solid #d93025;
      background: #fff7f7;
    }

    input.valid,
    select.valid,
    textarea.valid {
      border: 2px solid #188038;
      background: #f7fff8;
    }

    .field-error {
      display: block;
      min-height: 20px;
      margin-top: 5px;
      color: #d93025;
      font-size: 14px;
      line-height: 1.5;
    }

    .field-hint {
      display: block;
      color: #777;
      font-size: 13px;
      margin-top: 5px;
    }

    .images-box {
      border: 2px dashed #ccc;
      padding: 18px;
      border-radius: 10px;
      background: #fafafa;
    }

    .preview-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 15px;
    }

    .preview-item {
      position: relative;
      border-radius: 8px;
      overflow: hidden;
      background: #eee;
      aspect-ratio: 1 / 1;
    }

    .preview-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .terms {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-top: 10px;
    }

    .terms input {
      width: auto;
      margin-top: 4px;
    }

    .terms label {
      margin: 0;
      font-weight: normal;
      line-height: 1.6;
    }

    .submit-btn {
      width: 100%;
      padding: 15px;
      margin-top: 20px;
      border: none;
      border-radius: 10px;
      background: #111;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .submit-btn:hover {
      background: #333;
    }

    .submit-btn:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 14px;
      border-radius: 9px;
      text-align: center;
      line-height: 1.7;
    }

    .message.success {
      display: block;
      background: #e9f8ed;
      color: #137333;
    }

    .message.error {
      display: block;
      background: #fff0f0;
      color: #c5221f;
    }

    @media (max-width: 600px) {
      .form-box {
        padding: 18px;
      }

      .preview-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      header h1 {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>لَحْقها 🛍️</h1>
  </header>

  <main class="container">

    <div class="form-box">

      <h2>إضافة منتج للبيع</h2>

      <p class="intro">
        أدخل معلوماتك ومعلومات المنتج بشكل صحيح، وسيتم مراجعة الطلب قبل نشره.
      </p>

      <form id="sellerForm" novalidate>

        <!-- اسم البائع -->
        <div class="field">
          <label for="seller_name">اسم البائع *</label>

          <input
            id="seller_name"
            name="seller_name"
            type="text"
            autocomplete="name"
            maxlength="60"
            required
            placeholder="اكتب اسمك"
          >

          <small id="seller_name_error" class="field-error"></small>
        </div>


        <!-- البريد الإلكتروني -->
        <div class="field">
          <label for="seller_email">البريد الإلكتروني *</label>

          <input
            id="seller_email"
            name="seller_email"
            type="email"
            autocomplete="email"
            maxlength="120"
            required
            placeholder="example@email.com"
            inputmode="email"
          >

          <small id="seller_email_error" class="field-error"></small>

          <small class="field-hint">
            يجب إدخال بريد إلكتروني صحيح ويمكن التواصل معك من خلاله.
          </small>
        </div>


        <!-- رقم الجوال -->
        <div class="field">
          <label for="phone">رقم الجوال *</label>

          <input
            id="phone"
            name="phone"
            type="tel"
            autocomplete="tel"
            inputmode="numeric"
            maxlength="16"
            required
            placeholder="05xxxxxxxx"
          >

          <small id="phone_error" class="field-error"></small>

          <small class="field-hint">
            مثال: 05xxxxxxxx أو +9665xxxxxxxx
          </small>
        </div>


        <!-- المدينة -->
        <div class="field">
          <label for="city">المدينة *</label>

          <input
            id="city"
            name="city"
            type="text"
            maxlength="50"
            required
            placeholder="مثال: جدة"
          >

          <small id="city_error" class="field-error"></small>
        </div>


        <!-- التصنيف -->
        <div class="field">
          <label for="category">التصنيف *</label>

          <select id="category" name="category" required>
            <option value="">اختر التصنيف</option>
            <option value="كمبيوتر">كمبيوتر 💻</option>
            <option value="ألعاب">ألعاب 🎮</option>
            <option value="أثاث">أثاث 🪑</option>
            <option value="أجهزة">أجهزة 📺</option>
            <option value="رياضة">رياضة 🚲</option>
            <option value="أدوات">أدوات 🛠️</option>
            <option value="ملابس">ملابس 👕</option>
            <option value="أخرى">أخرى 📦</option>
          </select>

          <small id="category_error" class="field-error"></small>
        </div>


        <!-- اسم المنتج -->
        <div class="field">
          <label for="product_title">اسم المنتج *</label>

          <input
            id="product_title"
            name="product_title"
            type="text"
            maxlength="120"
            required
            placeholder="مثال: جوال آيفون 15"
          >

          <small id="product_title_error" class="field-error"></small>
        </div>


        <!-- السعر -->
        <div class="field">
          <label for="price">السعر بالريال *</label>

          <input
            id="price"
            name="price"
            type="number"
            min="0"
            step="0.01"
            required
            placeholder="مثال: 1500"
          >

          <small id="price_error" class="field-error"></small>
        </div>


        <!-- الوصف -->
        <div class="field">
          <label for="description">وصف المنتج *</label>

          <textarea
            id="description"
            name="description"
            minlength="5"
            maxlength="2000"
            required
            placeholder="اكتب وصفًا واضحًا للمنتج وحالته..."
          ></textarea>

          <small id="description_error" class="field-error"></small>
        </div>


        <!-- الصور -->
        <div class="field">

          <label for="product_image">صور المنتج *</label>

          <div class="images-box">

            <input
              id="product_image"
              name="product_image"
              type="file"
              accept="image/*"
              multiple
              required
            >

            <small class="field-hint">
              يمكنك إضافة من صورة واحدة إلى 4 صور، وحجم كل صورة يجب ألا يتجاوز 5MB.
            </small>

            <small id="product_image_error" class="field-error"></small>

            <div
              id="previewGrid"
              class="preview-grid"
            ></div>

          </div>

        </div>


        <!-- الشروط -->
        <div class="field">

          <div class="terms">

            <input
              id="agree_terms"
              name="agree_terms"
              type="checkbox"
              required
            >

            <label for="agree_terms">
              أقر بأن المعلومات التي أدخلتها صحيحة، وأن المنتج المعروض للبيع
              يعود لي أو لدي الحق في بيعه، وأوافق على شروط الموقع.
            </label>

          </div>

          <small id="agree_terms_error" class="field-error"></small>

        </div>


        <!-- زر الإرسال -->
        <button
          id="submitBtn"
          class="submit-btn"
          type="submit"
        >
          إرسال المنتج للمراجعة
        </button>

        <div id="formMessage" class="message"></div>

      </form>

    </div>

  </main>


  <script>
    // ==============================
    // إعداد Supabase
    // ==============================

    const SUPABASE_URL =
      "https://gyyyzavjzvcxzgrtukqu.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_Rj6F5Fp2tHJSWzbRRdLVZQ_8D5wL8p-";

    const STORAGE_BUCKET = "product-images";

    const MAX_IMAGES = 4;

    const MAX_IMAGE_SIZE = 5 * 1024 * 1024;


    // ==============================
    // العناصر
    // ==============================

    const sellerForm =
      document.getElementById("sellerForm");

    const sellerName =
      document.getElementById("seller_name");

    const sellerEmail =
      document.getElementById("seller_email");

    const phone =
      document.getElementById("phone");

    const city =
      document.getElementById("city");

    const category =
      document.getElementById("category");

    const productTitle =
      document.getElementById("product_title");

    const price =
      document.getElementById("price");

    const description =
      document.getElementById("description");

    const productImage =
      document.getElementById("product_image");

    const agreeTerms =
      document.getElementById("agree_terms");

    const previewGrid =
      document.getElementById("previewGrid");

    const submitBtn =
      document.getElementById("submitBtn");

    const formMessage =
      document.getElementById("formMessage");


    // ==============================
    // تحويل الأرقام العربية والفارسية
    // ==============================

    function normalizeArabicNumbers(value) {

      return String(value || "")
        .replace(/[٠-٩]/g, function(digit) {
          return String("٠١٢٣٤٥٦٧٨٩".indexOf(digit));
        })
        .replace(/[۰-۹]/g, function(digit) {
          return String("۰۱۲۳۴۵۶۷۸۹".indexOf(digit));
        });
    }


    // ==============================
    // تنظيف رقم الجوال
    // ==============================

    function normalizePhone(value) {

      let phoneValue =
        normalizeArabicNumbers(value)
          .trim()
          .replace(/[\s()-]/g, "");

      if (phoneValue.startsWith("+966")) {
        phoneValue = "0" + phoneValue.substring(4);
      }

      if (phoneValue.startsWith("9665")) {
        phoneValue = "0" + phoneValue.substring(3);
      }

      return phoneValue;
    }


    // ==============================
    // إظهار الخطأ
    // ==============================

    function setError(input, errorId, message) {

      input.classList.remove("valid");
      input.classList.add("invalid");

      const error =
        document.getElementById(errorId);

      error.textContent = "❌ " + message;
    }


    // ==============================
    // إزالة الخطأ
    // ==============================

    function setValid(input, errorId) {

      input.classList.remove("invalid");
      input.classList.add("valid");

      const error =
        document.getElementById(errorId);

      error.textContent = "";
    }


    // ==============================
    // التحقق من اسم البائع
    // ==============================

    function validateSellerName() {

      const value =
        sellerName.value.trim();

      if (!value) {

        setError(
          sellerName,
          "seller_name_error",
          "يجب إدخال اسم البائع."
        );

        return false;
      }

      if (value.length < 3) {

        setError(
          sellerName,
          "seller_name_error",
          "اسم البائع يجب أن يكون 3 أحرف على الأقل."
        );

        return false;
      }

      if (!/^[\u0600-\u06FFa-zA-Z\s]+$/.test(value)) {

        setError(
          sellerName,
          "seller_name_error",
          "اكتب اسم البائع باستخدام الحروف فقط."
        );

        return false;
      }

      setValid(
        sellerName,
        "seller_name_error"
      );

      return true;
    }


    // ==============================
    // التحقق من البريد الإلكتروني
    // ==============================

    function validateEmail() {

      const value =
        sellerEmail.value.trim();

      if (!value) {

        setError(
          sellerEmail,
          "seller_email_error",
          "يجب إدخال البريد الإلكتروني."
        );

        return false;
      }

      if (value.length > 120) {

        setError(
          sellerEmail,
          "seller_email_error",
          "البريد الإلكتروني طويل جدًا."
        );

        return false;
      }

      /*
       * التحقق من صيغة البريد الإلكتروني.
       * أمثلة صحيحة:
       * example@gmail.com
       * name@hotmail.com
       * seller123@yahoo.com
       */

      const emailRegex =
        /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

      if (!emailRegex.test(value)) {

        setError(
          sellerEmail,
          "seller_email_error",
          "البريد الإلكتروني غير صحيح. مثال: example@email.com"
        );

        return false;
      }

      setValid(
        sellerEmail,
        "seller_email_error"
      );

      return true;
    }


    // ==============================
    // التحقق من الجوال السعودي
    // ==============================

    function validatePhone() {

      const normalized =
        normalizePhone(phone.value);

      phone.value = normalized;

      if (!normalized) {

        setError(
          phone,
          "phone_error",
          "يجب إدخال رقم الجوال."
        );

        return false;
      }

      /*
       * الرقم السعودي يجب أن يكون:
       * 05xxxxxxxx
       *
       * أي 10 أرقام ويبدأ بـ 05
       */

      if (!/^05\d{8}$/.test(normalized)) {

        setError(
          phone,
          "phone_error",
          "رقم الجوال غير صحيح. يجب أن يكون مثل 05xxxxxxxx."
        );

        return false;
      }

      setValid(
        phone,
        "phone_error"
      );

      return true;
    }


    // ==============================
    // التحقق من المدينة
    // ==============================

    function validateCity() {

      const value =
        city.value.trim();

      if (!value) {

        setError(
          city,
          "city_error",
          "يجب إدخال المدينة."
        );

        return false;
      }

      if (value.length < 2) {

        setError(
          city,
          "city_error",
          "اكتب اسم المدينة بشكل صحيح."
        );

        return false;
      }

      setValid(
        city,
        "city_error"
      );

      return true;
    }


    // ==============================
    // التحقق من التصنيف
    // ==============================

    function validateCategory() {

      if (!category.value) {

        setError(
          category,
          "category_error",
          "يجب اختيار تصنيف المنتج."
        );

        return false;
      }

      setValid(
        category,
        "category_error"
      );

      return true;
    }


    // ==============================
    // التحقق من اسم المنتج
    // ==============================

    function validateProductTitle() {

      const value =
        productTitle.value.trim();

      if (!value) {

        setError(
          productTitle,
          "product_title_error",
          "يجب إدخال اسم المنتج."
        );

        return false;
      }

      if (value.length < 2) {

        setError(
          productTitle,
          "product_title_error",
          "اسم المنتج قصير جدًا."
        );

        return false;
      }

      setValid(
        productTitle,
        "product_title_error"
      );

      return true;
    }


    // ==============================
    // التحقق من السعر
    // ==============================

    function validatePrice() {

      const value =
        normalizeArabicNumbers(price.value);

      price.value = value;

      if (!value) {

        setError(
          price,
          "price_error",
          "يجب إدخال سعر المنتج."
        );

        return false;
      }

      const number =
        Number(value);

      if (!Number.isFinite(number)) {

        setError(
          price,
          "price_error",
          "السعر غير صحيح."
        );

        return false;
      }

      if (number < 0) {

        setError(
          price,
          "price_error",
          "السعر لا يمكن أن يكون سالبًا."
        );

        return false;
      }

      setValid(
        price,
        "price_error"
      );

      return true;
    }


    // ==============================
    // التحقق من الوصف
    // ==============================

    function validateDescription() {

      const value =
        description.value.trim();

      if (!value) {

        setError(
          description,
          "description_error",
          "يجب كتابة وصف للمنتج."
        );

        return false;
      }

      if (value.length < 5) {

        setError(
          description,
          "description_error",
          "الوصف يجب أن يكون 5 أحرف على الأقل."
        );

        return false;
      }

      setValid(
        description,
        "description_error"
      );

      return true;
    }


    // ==============================
    // التحقق من الصور
    // ==============================

    function validateImages() {

      const files =
        Array.from(productImage.files || []);

      if (files.length === 0) {

        setError(
          productImage,
          "product_image_error",
          "يجب إضافة صورة واحدة على الأقل."
        );

        return false;
      }

      if (files.length > MAX_IMAGES) {

        setError(
          productImage,
          "product_image_error",
          "يمكنك إضافة 4 صور كحد أقصى."
        );

        return false;
      }

      for (const file of files) {

        if (!file.type.startsWith("image/")) {

          setError(
            productImage,
            "product_image_error",
            "كل الملفات يجب أن تكون صورًا."
          );

          return false;
        }

        if (file.size > MAX_IMAGE_SIZE) {

          setError(
            productImage,
            "product_image_error",
            `الصورة "${file.name}" أكبر من 5MB.`
          );

          return false;
        }
      }

      setValid(
        productImage,
        "product_image_error"
      );

      return true;
    }


    // ==============================
    // التحقق من الموافقة
    // ==============================

    function validateTerms() {

      if (!agreeTerms.checked) {

        document.getElementById(
          "agree_terms_error"
        ).textContent =
          "❌ يجب الموافقة على الشروط قبل إرسال المنتج.";

        return false;
      }

      document.getElementById(
        "agree_terms_error"
      ).textContent = "";

      return true;
    }


    // ==============================
    // معاينة الصور
    // ==============================

    productImage.addEventListener(
      "change",
      function() {

        previewGrid.innerHTML = "";

        const files =
          Array.from(productImage.files || []);

        if (files.length > MAX_IMAGES) {

          setError(
            productImage,
            "product_image_error",
            "يمكنك إضافة 4 صور كحد أقصى."
          );

          productImage.value = "";
          return;
        }

        files.forEach(function(file) {

          if (!file.type.startsWith("image/")) {
            return;
          }

          const item =
            document.createElement("div");

          item.className =
            "preview-item";

          const img =
            document.createElement("img");

          img.src =
            URL.createObjectURL(file);

          img.alt =
            "معاينة صورة المنتج";

          item.appendChild(img);

          previewGrid.appendChild(item);

        });

        validateImages();
      }
    );


    // ==============================
    // التحقق أثناء الكتابة
    // ==============================

    sellerName.addEventListener(
      "input",
      validateSellerName
    );

    sellerEmail.addEventListener(
      "input",
      validateEmail
    );

    phone.addEventListener(
      "input",
      function() {

        phone.value =
          normalizePhone(phone.value);

        validatePhone();
      }
    );

    city.addEventListener(
      "input",
      validateCity
    );

    category.addEventListener(
      "change",
      validateCategory
    );

    productTitle.addEventListener(
      "input",
      validateProductTitle
    );

    price.addEventListener(
      "input",
      validatePrice
    );

    description.addEventListener(
      "input",
      validateDescription
    );

    agreeTerms.addEventListener(
      "change",
      validateTerms
    );


    // ==============================
    // رسالة عامة
    // ==============================

    function showMessage(
      message,
      type
    ) {

      formMessage.textContent =
        message;

      formMessage.className =
        "message " + type;
    }


    // ==============================
    // رفع صورة إلى Supabase Storage
    // ==============================

    async function uploadImage(
      file,
      index
    ) {

      const extension =
        file.name
          .split(".")
          .pop()
          .toLowerCase();

      const safeTitle =
        productTitle.value
          .trim()
          .replace(/[^\u0600-\u06FFa-zA-Z0-9]/g, "-")
          .substring(0, 40);

      const fileName =
        Date.now() +
        "-" +
        Math.random()
          .toString(36)
          .substring(2, 10) +
        "-" +
        index +
        "." +
        extension;

      const filePath =
        "seller-products/" +
        safeTitle +
        "-" +
        fileName;

      const response =
        await fetch(
          SUPABASE_URL +
          "/storage/v1/object/" +
          STORAGE_BUCKET +
          "/" +
          filePath,
          {
            method: "POST",

            headers: {
              "Authorization":
                "Bearer " + SUPABASE_KEY,

              "apikey":
                SUPABASE_KEY,

              "Content-Type":
                file.type
            },

            body: file
          }
        );

      if (!response.ok) {

        let errorText =
          "فشل رفع الصورة.";

        try {

          const data =
            await response.json();

          errorText =
            data.message ||
            data.error ||
            errorText;

        } catch (error) {}

        throw new Error(errorText);
      }

      const publicUrl =
        SUPABASE_URL +
        "/storage/v1/object/public/" +
        STORAGE_BUCKET +
        "/" +
        filePath;

      return {
        url: publicUrl,
        path: filePath
      };
    }


    // ==============================
    // حذف الصور إذا حدث خطأ
    // ==============================

    async function deleteUploadedImages(
      paths
    ) {

      for (const path of paths) {

        try {

          await fetch(
            SUPABASE_URL +
            "/storage/v1/object/" +
            STORAGE_BUCKET +
            "/" +
            path,
            {
              method: "DELETE",

              headers: {
                "Authorization":
                  "Bearer " + SUPABASE_KEY,

                "apikey":
                  SUPABASE_KEY
              }
            }
          );

        } catch (error) {
          console.warn(
            "تعذر حذف الصورة:",
            path
          );
        }
      }
    }


    // ==============================
    // إرسال الطلب
    // ==============================

    sellerForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        formMessage.className =
          "message";

        formMessage.textContent =
          "";

        // التحقق الكامل قبل أي رفع
        const validName =
          validateSellerName();

        const validEmail =
          validateEmail();

        const validPhone =
          validatePhone();

        const validCity =
          validateCity();

        const validCategory =
          validateCategory();

        const validTitle =
          validateProductTitle();

        const validPrice =
          validatePrice();

        const validDescription =
          validateDescription();

        const validImages =
          validateImages();

        const validTerms =
          validateTerms();


        if (
          !validName ||
          !validEmail ||
          !validPhone ||
          !validCity ||
          !validCategory ||
          !validTitle ||
          !validPrice ||
          !validDescription ||
          !validImages ||
          !validTerms
        ) {

          showMessage(
            "❌ يرجى تصحيح البيانات الموجودة باللون الأحمر قبل إرسال الطلب.",
            "error"
          );

          const firstInvalid =
            sellerForm.querySelector(
              ".invalid"
            );

          if (firstInvalid) {
            firstInvalid.focus();
          }

          return;
        }


        // منع الضغط المتكرر
        submitBtn.disabled = true;

        submitBtn.textContent =
          "جاري إرسال المنتج...";


        let uploadedPaths = [];

        try {

          const files =
            Array.from(
              productImage.files
            );


          // ==========================
          // رفع الصور
          // ==========================

          const uploadedImages = [];

          for (
            let i = 0;
            i < files.length;
            i++
          ) {

            submitBtn.textContent =
              `جاري رفع الصورة ${i + 1} من ${files.length}...`;

            const result =
              await uploadImage(
                files[i],
                i + 1
              );

            uploadedImages.push(
              result.url
            );

            uploadedPaths.push(
              result.path
            );
          }


          // ==========================
          // تجهيز البيانات
          // ==========================

          const sellerNameValue =
            sellerName.value.trim();

          const emailValue =
            sellerEmail.value.trim();

          const phoneValue =
            normalizePhone(phone.value);

          const cityValue =
            city.value.trim();

          const categoryValue =
            category.value;

          const productName =
            productTitle.value.trim();

          const productPrice =
            Number(price.value);

          const descriptionValue =
            description.value.trim();


          // ==========================
          // إرسال الطلب إلى Supabase
          // ==========================

          submitBtn.textContent =
            "جاري حفظ الطلب...";


          const insertResponse =
            await fetch(
              SUPABASE_URL +
              "/rest/v1/seller_requests",
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json",

                  "apikey":
                    SUPABASE_KEY,

                  "Authorization":
                    "Bearer " + SUPABASE_KEY,

                  "Prefer":
                    "return=minimal"
                },

                body: JSON.stringify({
                  product_name:
                    productName,

                  seller_name:
                    sellerNameValue,

                  email:
                    emailValue,

                  phone:
                    phoneValue,

                  city:
                    cityValue,

                  category:
                    categoryValue,

                  price:
                    productPrice,

                  quantity:
                    1,

                  description:
                    descriptionValue,

                  notes:
                    "",

                  agreement_accepted:
                    true,

                  agreement_accepted_at:
                    new Date().toISOString(),

                  status:
                    "pending",

                  published:
                    false,

                  image:
                    uploadedImages[0],

                  images:
                    uploadedImages,

                  image_url:
                    uploadedImages[0]
                })
              }
            );


          // ==========================
          // فحص نتيجة Supabase
          // ==========================

          if (!insertResponse.ok) {

            let errorMessage =
              "حدث خطأ أثناء حفظ الطلب.";

            try {

              const errorData =
                await insertResponse.json();

              errorMessage =
                errorData.message ||
                errorData.error ||
                errorMessage;

            } catch (error) {}

            throw new Error(
              errorMessage
            );
          }


          // ==========================
          // نجاح
          // ==========================

          showMessage(
            "✅ تم إرسال المنتج بنجاح. سيتم مراجعته قبل نشره في الموقع.",
            "success"
          );


          // تنظيف النموذج
          sellerForm.reset();

          previewGrid.innerHTML = "";

          sellerForm
            .querySelectorAll(
              ".valid"
            )
            .forEach(function(element) {
              element.classList.remove(
                "valid"
              );
            });


        } catch (error) {

          console.error(
            "Seller form error:",
            error
          );


          // حذف الصور التي تم رفعها
          // إذا فشل حفظ الطلب
          if (
            uploadedPaths.length > 0
          ) {

            await deleteUploadedImages(
              uploadedPaths
            );
          }


          showMessage(
            "❌ لم يتم إرسال الطلب. " +
            (error.message ||
              "حدث خطأ غير متوقع."),
            "error"
          );

        } finally {

          submitBtn.disabled =
            false;

          submitBtn.textContent =
            "إرسال المنتج للمراجعة";
        }

      }
    );
  </script>
