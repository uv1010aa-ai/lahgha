<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>إضافة منتج - لَحْقها 🛍️</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f7f7f7;
  color: #222;
}

/* ===== Header ===== */

header {
  background: #111;
  color: #fff;
  padding: 20px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 26px;
}

/* ===== زر العودة للمتجر ===== */

.back-to-store {
  display: inline-block;
  margin-top: 14px;
  padding: 11px 20px;
  background: #fff;
  color: #111;
  text-decoration: none;
  border-radius: 9px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  transition: 0.2s;
  position: relative;
  z-index: 1000;
  pointer-events: auto;
}

.back-to-store:hover {
  background: #e9e9e9;
  transform: translateY(-1px);
}

.back-to-store:active {
  transform: translateY(0);
}

/* ===== Container ===== */

.container {
  width: 100%;
  max-width: 700px;
  margin: 30px auto;
  padding: 0 15px;
}

.form-box {
  background: #fff;
  border-radius: 14px;
  padding: 25px;
  box-shadow: 0 4px 18px rgba(0, 0, 0, .08);
}

.form-box h2 {
  margin-top: 0;
  text-align: center;
}

.intro {
  text-align: center;
  color: #666;
  margin-bottom: 25px;
  line-height: 1.7;
}

/* ===== Fields ===== */

.field {
  margin-bottom: 18px;
}

label {
  display: block;
  font-weight: bold;
  margin-bottom: 7px;
}

input,
select,
textarea {
  width: 100%;
  padding: 13px;
  border: 1px solid #ccc;
  border-radius: 9px;
  font-size: 16px;
  outline: none;
  background: #fff;
}

input:focus,
select:focus,
textarea:focus {
  border-color: #111;
}

textarea {
  min-height: 120px;
  resize: vertical;
}

input.invalid,
select.invalid,
textarea.invalid {
  border: 2px solid #d93025;
  background: #fff7f7;
}

input.valid,
select.valid,
textarea.valid {
  border: 2px solid #188038;
  background: #f7fff8;
}

.field-error {
  display: block;
  min-height: 20px;
  margin-top: 5px;
  color: #d93025;
  font-size: 14px;
  line-height: 1.5;
}

.field-hint {
  display: block;
  color: #777;
  font-size: 13px;
  margin-top: 5px;
}

/* ===== Price ===== */

.price-summary {
  display: block;
  margin-top: 12px;
  padding: 15px;
  border-radius: 10px;
  background: #f8f8f8;
  border: 1px solid #ddd;
  line-height: 1.9;
}

.price-row {
  display: flex;
  justify-content: space-between;
  gap: 15px;
  padding: 5px 0;
}

.price-row.total {
  margin-top: 8px;
  padding-top: 10px;
  border-top: 1px solid #ddd;
  font-weight: bold;
  font-size: 17px;
}

.price-value {
  font-weight: bold;
}

.commission-value {
  color: #c5221f;
}

.seller-value {
  color: #137333;
}

/* ===== Images ===== */

.images-box {
  border: 2px dashed #ccc;
  padding: 18px;
  border-radius: 10px;
  background: #fafafa;
}

.image-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 10px;
}

.image-action-btn {
  border: none;
  border-radius: 10px;
  padding: 13px 10px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  transition: 0.2s;
}

.image-action-btn:hover {
  transform: translateY(-1px);
}

.image-action-btn:active {
  transform: translateY(0);
}

.camera-btn {
  background: #111;
  color: #fff;
}

.camera-btn:hover {
  background: #333;
}

.gallery-btn {
  background: #eee;
  color: #111;
  border: 1px solid #ccc;
}

.gallery-btn:hover {
  background: #e2e2e2;
}

.preview-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-top: 15px;
}

/* ===== Terms ===== */

.terms {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  margin-top: 10px;
}

.terms input {
  width: auto;
  margin-top: 4px;
}

.terms label {
  margin: 0;
  font-weight: normal;
  line-height: 1.6;
}

/* ===== Button ===== */

.submit-btn {
  width: 100%;
  padding: 15px;
  margin-top: 20px;
  border: none;
  border-radius: 10px;
  background: #111;
  color: #fff;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

.submit-btn:hover {
  background: #333;
}

.submit-btn:disabled {
  background: #999;
  cursor: not-allowed;
}

/* ===== Messages ===== */

.message {
  display: none;
  margin-top: 18px;
  padding: 16px;
  border-radius: 9px;
  text-align: center;
  line-height: 1.7;
  font-weight: bold;
}

.message.success {
  display: block;
  background: #e9f8ed;
  color: #137333;
  border: 1px solid #b7dfc1;
}

.message.error {
  display: block;
  background: #fff0f0;
  color: #c5221f;
  border: 1px solid #f0b8b8;
}

/* ===== Mobile ===== */

@media (max-width: 600px) {
  .form-box {
    padding: 18px;
  }
  .image-actions {
    grid-template-columns: 1fr;
  }
  header h1 {
    font-size: 22px;
  }
  .back-to-store {
    width: 100%;
    max-width: 260px;
  }
}
</style>
</head>

<body>

<!-- ===== Header ===== -->
<header>
  <h1>لَحْقها 🛍️</h1>
  <a href="https://github.io" class="back-to-store">
    ← العودة للمتجر
  </a>
</header>

<!-- ===== Main ===== -->
<main class="container">
  <div class="form-box">
    <h2>إضافة منتج للبيع</h2>
    <p class="intro">
      أدخل معلوماتك ومعلومات المنتج بشكل صحيح، وسيتم التحقق من البيانات ومراجعة الطلب قبل نشره.
    </p>

    <form id="sellerForm" autocomplete="off" novalidate>
      <!-- اسم البائع -->
      <div class="field">
        <label for="sellerName">اسم البائع *</label>
        <input type="text" id="sellerName" name="seller_name" placeholder="أدخل اسمك">
        <span id="sellerNameError" class="field-error"></span>
      </div>

      <!-- البريد -->
      <div class="field">
        <label for="sellerEmail">البريد الإلكتروني *</label>
        <input type="email" id="sellerEmail" name="seller_email" placeholder="example@email.com">
        <span id="sellerEmailError" class="field-error"></span>
      </div>

      <!-- الجوال -->
      <div class="field">
        <label for="phone">رقم الجوال *</label>
        <input type="tel" id="phone" name="phone" placeholder="05xxxxxxxx أو +9665xxxxxxxx">
        <span id="phoneError" class="field-error"></span>
      </div>

      <!-- المدينة -->
      <div class="field">
        <label for="city">المدينة *</label>
        <select id="city" name="city">
          <option value="">اختر المدينة</option>
          <option value="الرياض">الرياض</option>
          <option value="جدة">جدة</option>
          <option value="مكة المكرمة">مكة المكرمة</option>
          <option value="المدينة المنورة">المدينة المنورة</option>
          <option value="الدمام">الدمام</option>
          <option value="الخبر">الخبر</option>
          <option value="الطائف">الطائف</option>
          <option value="تبوك">تبوك</option>
          <option value="أبها">أبها</option>
          <option value="بريدة">بريدة</option>
          <option value="حائل">حائل</option>
          <option value="جازان">جازان</option>
          <option value="نجران">نجران</option>
        </select>
        <span id="cityError" class="field-error"></span>
      </div>

      <!-- القسم -->
      <div class="field">
        <label for="category">القسم المناسب لسلعتك *</label>
        <select id="category" name="category">
          <option value="">اختر القسم</option>
          <option value="السيارات">سيارات ومركبات</option>
          <option value="العقارات">عقارات وأراضي</option>
          <option value="الإلكترونيات">أجهزة وإلكترونيات</option>
          <option value="الموضة">أزياء وملابس</option>
          <option value="المنزل">أثاث ومستلزمات منزلية</option>
          <option value="أخرى">سلع أخرى متنوعة</option>
        </select>
        <span id="categoryError" class="field-error"></span>
      </div>

      <!-- اسم المنتج -->
      <div class="field">
        <label for="productTitle">اسم المنتج / السلعة *</label>
        <input type="text" id="productTitle" name="title" placeholder="مثال: آيفون 15 برو ماكس 256 جيجا">
        <span id="productTitleError" class="field-error"></span>
      </div>

      <!-- حالة المنتج -->
      <div class="field">
        <label for="condition">حالة السلعة *</label>
        <select id="condition" name="condition">
          <option value="">اختر الحالة</option>
          <option value="جديد">جديد (كرتون مغلق)</option>
          <option value="شبه جديد">شبه جديد (استخدام خفيف جداً)</option>
          <option value="مستعمل">مستعمل بحالة جيدة</option>
        </select>
        <span id="conditionError" class="field-error"></span>
      </div>

      <!-- السعر والعمولة -->
      <div class="field">
        <label for="price">السعر المطلوب (ريال سعودي) *</label>
        <input type="number" id="price" name="price" placeholder="مثال: 1500" min="1">
        <span id="priceError" class="field-error"></span>
        
        <div class="price-summary">
          <div class="price-row">
            <span>سعر السلعة:</span>
            <span id="summaryProductPrice" class="price-value">0.00 ريال</span>
          </div>
          <div class="price-row">
            <span>رسوم عمولة المنصة (5%):</span>
            <span id="summaryCommission" class="price-value commission-value">0.00 ريال</span>
          </div>
          <div class="price-row total">
            <span>صافي ربحك كبائع:</span>
            <span id="summarySellerNet" class="price-value seller-value">0.00 ريال</span>
          </div>
        </div>
      </div>

      <!-- الكمية المتوفرة -->
      <div class="field">
        <label for="productQuantity">📦 الكمية المتوفرة *</label>
        <input type="number" id="productQuantity" name="quantity" min="1" step="1" inputmode="numeric" placeholder="مثال: 10">
        <span class="field-hint">اكتب عدد القطع المتوفرة من هذا المنتج.</span>
        <span id="productQuantityError" class="field-error"></span>
      </div>

      <!-- وصف السلعة -->
      <div class="field">
        <label for="description">وصف تفصيلي للسلعة *</label>
